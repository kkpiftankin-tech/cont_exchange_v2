name: consistency-gate

# IN-019/ADR-086, Этап 7 ("Гейты"), сужено владельцем 2026-10-27:
# собираем здесь только то, что уже реально работает в репо (4 существующих
# чекера + свежесть реестра). Сознательно НЕ входит в этот гейт:
#   - `buf breaking` — buf нигде в репо не установлен/не настроен, строить
#     отдельная задача (см. docs/00-methodology/known-gaps.md).
#   - "раннер примеров CALC" (выполнение примеров из CALC-карточек) — такого
#     инструмента не существует, не строится в этом заходе.
#   - .claude/hooks/level_gate.py — отдельное решение владельца, отложено.
#
# ВАЖНО: все 4 чекера (feature-yaml-checker, in013-checker, link-audit.py,
# consistency/check.py) сейчас continue-on-error, НЕ строго блокирующие —
# независимый прогон на main 2026-10-27 показал, что main уже красный по
# всем четырём (pre-existing долг, не внесён этим гейтом, см.
# docs/00-methodology/known-gaps.md "Этап 7"). Единственный строго
# блокирующий шаг сейчас — "Registry freshness". Снимать continue-on-error
# по каждому чекеру отдельно, как только его долг на main закрыт — не
# всем скопом.

on:
  pull_request:
    paths:
      - "docs/**"
      - "specs/**"
      - "tools/**"
      - "contracts/proto/**"
      - "infra/postgres/init.sql"
      - "infra/clickhouse/init.sql"
      - ".github/workflows/consistency-gate.yml"

jobs:
  consistency-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # --- Пункты 1–3: подтверждено независимым прогоном на main 2026-10-27
      # (git worktree, main @ 686d1261^..), что main КРАСНЫЙ уже сейчас по
      # всем трём — не только consistency/check.py (п.4). Причины не связаны
      # с конкретным PR (см. docs/00-methodology/known-gaps.md, запись
      # "Этап 7: пред-существующий долг на main"). Строго блокирующими
      # сделали бы ЛЮБОЙ PR, затрагивающий docs/specs/tools, красным с первого
      # дня. continue-on-error симметрично п.4 — видимость через ::warning::,
      # не блокировка, до закрытия долга.
      - name: feature.yaml ↔ feature-component-map consistency
        id: feature_yaml
        run: python3 tools/feature-yaml-checker/check.py
        continue-on-error: true

      - name: IN-013 (two-axis nav) + Mermaid syntax check
        id: in013
        run: python3 tools/in013-checker/check.py
        continue-on-error: true

      - name: Markdown link audit (broken links only — blocking)
        id: link_audit
        run: python3 tools/link-audit.py
        continue-on-error: true

      - name: Report п.1–3 step outcomes
        run: |
          [ "${{ steps.feature_yaml.outcome }}" = "failure" ] && echo "::warning::feature-yaml-checker found ERRORs (pre-existing on main, see known-gaps.md 'Этап 7'). Not blocking merge yet."
          [ "${{ steps.in013.outcome }}" = "failure" ] && echo "::warning::in013-checker found H1/H6 violations (pre-existing on main, see known-gaps.md 'Этап 7'). Not blocking merge yet."
          [ "${{ steps.link_audit.outcome }}" = "failure" ] && echo "::warning::link-audit.py found broken links (pre-existing on main, see known-gaps.md 'Этап 7'). Not blocking merge yet."
          exit 0

      # --- Этап 2 ADR-086: кросс-правила согласованности docs-as-code ---
      # ВАЖНО (см. docs/00-methodology/known-gaps.md, запись "Первый прогон
      # tools/consistency/check.py ... нашёл 17 преднаблюдений"): первый
      # прогон на main уже даёт 17 ERROR + 9 WARN — это известные
      # pre-existing находки Этапов 2 и 4 ADR-086, не внесённые этим гейтом.
      # `check.py` возвращает exit 1 при наличии ERROR, значит без
      # continue-on-error этот шаг был бы красным на КАЖДОМ PR прямо сейчас,
      # включая PR, не относящиеся к найденным находкам — это сделало бы
      # гейт бесполезным (команда научится игнорировать "вечно красный" шаг)
      # и заблокировало бы несвязанную работу, пока 17 ERROR не закрыты.
      # Решение: continue-on-error: true — шаг репортит найденные ERROR/WARN
      # в лог PR (видимость сохраняется), но не блокирует мердж, пока
      # pre-existing долг не закрыт.
      # TODO(IN-019/ADR-086): убрать continue-on-error, как только
      # docs/00-methodology/known-gaps.md перестанет содержать записи
      # "Этап 2"/"Этап 4 п.1" (C-04/C-05/C-08/C-15, C-02/C-03/C-06/C-17).
      - name: ADR-086 consistency rules (C-01..C-17) — non-blocking until known-gaps closed
        id: consistency
        run: python3 tools/consistency/check.py
        continue-on-error: true

      - name: Report consistency step outcome
        run: |
          if [ "${{ steps.consistency.outcome }}" = "failure" ]; then
            echo "::warning::tools/consistency/check.py found ERROR findings (expected pre-existing debt, see docs/00-methodology/known-gaps.md). Not blocking merge yet — see TODO in this workflow."
          fi

      - name: Registry freshness (specs/registry/registry.yaml is idempotent)
        run: |
          python3 tools/registry/build.py --write
          git diff --exit-code specs/registry/registry.yaml
