syntax = "proto3";

package fob.orders.v1;

import "google/protobuf/empty.proto";
import "fob/common/v1/common.proto";
import "fob/orders/v1/orders.proto";
import "fob/orders/v1/combo.proto";  // F-09: Batch/Combo/Multi-leg order types (ADR-031, ADR-032)

message CreateFlowOrderRequest {
  fob.common.v1.EventMeta meta = 1;
  FlowOrder order = 2;
}

message CreateFlowOrderResponse {
  fob.common.v1.EventMeta meta = 1;
  bool accepted = 2;
  string order_id = 3;
  fob.common.v1.Error error = 4;
}

message CancelFlowOrderRequest {
  fob.common.v1.EventMeta meta = 1;
  string user_id = 2;
  string order_id = 3;
  string reason = 4;
}

message CancelFlowOrderResponse {
  fob.common.v1.EventMeta meta = 1;
  bool success = 2;
  fob.common.v1.Error error = 3;
}

message GetFlowOrderRequest {
  fob.common.v1.EventMeta meta = 1;
  string user_id = 2;
  string order_id = 3;
}

message GetFlowOrderResponse {
  fob.common.v1.EventMeta meta = 1;
  FlowOrderView view = 2;
}

message ListFlowOrdersRequest {
  fob.common.v1.EventMeta meta = 1;
  string user_id = 2;
}

message ListFlowOrdersResponse {
  fob.common.v1.EventMeta meta = 1;
  repeated FlowOrderView views = 2;
}

// F-09 MVP-6 slice 3b (T-F09-067, ADR-039/ADR-040): operator-driven compensation
// resolution. Запрос приходит от F-16 console; order_flow читает pending из
// matching.CompensationService, для reverse_internal создаёт reversing-FlowOrder,
// затем matching.ResolvePending. operator_id — для audit (§22).
message ResolveCompensationRequest {
  fob.common.v1.EventMeta meta = 1;
  string compensation_id = 2;
  string action          = 3;  // reverse_internal | retry_external | accept
  string operator_id     = 4;  // F-16 operator (audit)
}

message ResolveCompensationResponse {
  fob.common.v1.EventMeta meta = 1;
  bool applied                 = 2;  // false → был не-pending (идемпотентный no-op)
  // id созданных reversing-FlowOrder (для action=reverse_internal).
  repeated string reversing_order_ids = 3;
  fob.common.v1.Error error    = 4;  // только на реальную ошибку
}

service OrderFlowService {
  // Main synchronous entrypoint for Gateway.
  rpc CreateFlowOrder(CreateFlowOrderRequest) returns (CreateFlowOrderResponse);
  rpc CancelFlowOrder(CancelFlowOrderRequest) returns (CancelFlowOrderResponse);
  rpc GetFlowOrder(GetFlowOrderRequest) returns (GetFlowOrderResponse);
  rpc ListFlowOrders(ListFlowOrdersRequest) returns (ListFlowOrdersResponse);

  // F-09: Batch/Combo/Multi-leg orders (ADR-031, ADR-032, ADR-033).
  // Backward-compatible additions — existing rpc above are NOT modified.
  rpc CreateBatchOrder(CreateBatchOrderRequest) returns (CreateBatchOrderResponse);
  rpc CreateComboOrder(CreateComboOrderRequest) returns (CreateComboOrderResponse);
  rpc PreviewComboOrder(PreviewComboOrderRequest) returns (PreviewComboOrderResponse);
  rpc CancelComboOrder(CancelComboOrderRequest) returns (CancelComboOrderResponse);
  rpc GetComboOrder(GetComboOrderRequest) returns (GetComboOrderResponse);

  // F-09 MVP-6 slice 3b (T-F09-067): operator resolves a pending compensation.
  rpc ResolveCompensation(ResolveCompensationRequest) returns (ResolveCompensationResponse);
}
