syntax = "proto3";

package fob.risk.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "fob/common/v1/common.proto";
import "fob/orders/v1/orders.proto";
import "fob/matching/v1/batch.proto";
import "fob/execution/v1/execution.proto";

enum RiskDecision {
  RISK_DECISION_UNSPECIFIED = 0;
  RISK_DECISION_ACCEPT = 1;
  RISK_DECISION_REJECT = 2;
  RISK_DECISION_RESIZE = 3;     // accept but with smaller qty/speed
  RISK_DECISION_HALT = 4;       // trading halted (instrument/global)
}

message BalanceSnapshot {
  string currency = 1;
  fob.common.v1.Decimal available = 2;
  fob.common.v1.Decimal reserved = 3;
  fob.common.v1.Decimal total = 4;
}

message PositionSnapshot {
  string symbol = 1;  // "BTC"
  fob.common.v1.Decimal qty = 2;
  fob.common.v1.Decimal avg_entry_price = 3;
}

message PreTradeCheckRequest {
  fob.common.v1.EventMeta meta = 1;

  string user_id = 2;
  fob.orders.v1.FlowOrder order = 3;

  // Optional snapshots to make Risk stateless (OrderFlow can fetch from Ledger).
  repeated BalanceSnapshot balances = 10;
  repeated PositionSnapshot positions = 11;

  // Optional reference price (mid) for notional/margin calculations
  fob.common.v1.Decimal reference_price = 20;
}

message PreTradeCheckResponse {
  fob.common.v1.EventMeta meta = 1;

  RiskDecision decision = 2;

  // Human readable + stable code
  fob.common.v1.Error error = 3;

  // If RESIZE: recommended accepted order params
  fob.orders.v1.FlowOrder resized_order = 10;

  // Risk metrics (optional for MVP)
  fob.common.v1.Decimal required_initial_margin = 20;
  fob.common.v1.Decimal max_loss_estimate = 21;
}

// F-09 (T-F09-040): grouped pre-trade risk — проверка combo-группы целиком.
message GroupRiskLegInput {
  string instrument_symbol = 1;
  fob.common.v1.Decimal notional = 2;  // |qty * price| в quote currency
  bool external = 3;                    // нога требует внешней venue (F-12)
}

message PreTradeCheckGroupRequest {
  fob.common.v1.EventMeta meta = 1;
  string user_id = 2;
  // Строковые значения из combo.proto (без import): strict_atomic/scalable_atomic/
  // best_effort/sequential_fallback/external_compensating.
  string atomicity_policy = 3;
  // internal_batch/venue_native/external_compensating/none.
  string atomicity_scope = 4;
  repeated GroupRiskLegInput legs = 5;
}

message PreTradeCheckGroupResponse {
  fob.common.v1.EventMeta meta = 1;
  RiskDecision decision = 2;
  fob.common.v1.Error error = 3;  // reason на REJECT
}

message KillSwitchRequest {
  fob.common.v1.EventMeta meta = 1;

  // Empty => global halt, else instrument-specific
  string instrument_symbol = 2; // "BTC/USDT" or empty for global

  bool halt = 3;
  string reason = 4;
}

message KillSwitchResponse {
  fob.common.v1.EventMeta meta = 1;
  bool effective_halt = 2;
}

message PostTradeUpdateRequest {
  // Risk consumes batch.outputs (or via RPC) to update exposures, run liquidations, etc.
  fob.common.v1.EventMeta meta = 1;
  fob.matching.v1.BatchResult batch = 2;
}

enum RiskSeverity {
  RISK_SEVERITY_UNSPECIFIED = 0;
  RISK_SEVERITY_INFO = 1;
  RISK_SEVERITY_WARN = 2;
  RISK_SEVERITY_CRITICAL = 3;
}

message RiskAlert {
  // Kafka topic: risk.alerts
  fob.common.v1.EventMeta meta = 1;

  string alert_id = 2;
  RiskSeverity severity = 3;

  string user_id = 4;
  string instrument_symbol = 5; // empty if global
  string alert_type = 6;        // "KILL_SWITCH", "MARGIN_CALL", "LIMIT_BREACH", ...

  fob.common.v1.Error error = 7;

  // Free-form payload for analytics / operator UI
  map<string, string> details = 8;

  google.protobuf.Timestamp timestamp = 9;
}

// ============================================================================
// F-12 Execution Hedge — pre-hedge risk check.
// Sources: IN-005 v1 + IN-008 v2 (resolves DoD-3 + AC F12-8 in feature.yaml).
// Called by Execution Planning before Venue Execution Adapter creates a
// HedgeFlow. Three checks applied in fixed order: (1) notional, (2) exposure,
// (3) expected slippage. Decision is ACCEPT or REJECT; partial accept
// (RESIZE) is intentionally not supported for hedges — operator must reissue.
// ============================================================================
message PreHedgeCheckRequest {
  fob.common.v1.EventMeta meta = 1;

  // Source intent (provider_id, symbol, target_qty, urgency, reference_mid,
  // allowed_venues are required for the three checks).
  fob.execution.v1.ExecutionIntent intent = 2;

  // Routing plan synthesized by Execution Planning. Allows risk to see
  // per-venue quantity split for slippage estimation.
  repeated PreHedgeVenueAllocation venue_allocations = 3;

  // Expected effective slippage from the planner (basis points). Risk will
  // compare this to maxSlippage[urgency] from solver_config.
  int32 expected_slippage_bps = 10;

  // Current hedge exposure for the provider (sum of |position| in base
  // currency across instruments). Allows risk to be stateless.
  fob.common.v1.Decimal current_hedge_exposure = 20;
}

message PreHedgeVenueAllocation {
  string venue_id = 1;
  fob.common.v1.Decimal qty = 2;
  fob.common.v1.Decimal expected_avg_price = 3;
  int32 expected_slippage_bps = 4;
}

message PreHedgeCheckResponse {
  fob.common.v1.EventMeta meta = 1;

  // ACCEPT or REJECT only. Hedges cannot be RESIZE'd by risk because the
  // resulting partial hedge would leave residual exposure with no
  // automatic follow-up plan; operator must reissue smaller intent.
  RiskDecision decision = 2;

  // On REJECT, error.code is one of:
  //   "NOTIONAL_EXCEEDED"   — target_qty * reference_mid > maxNotionalPerHedge
  //   "EXPOSURE_EXCEEDED"   — current_hedge_exposure + target_qty > hedgeExposureLimit
  //   "SLIPPAGE_EXCEEDED"   — expected_slippage_bps > maxSlippage[urgency]
  //   "PROVIDER_HALTED"     — kill-switch active for provider/instrument
  //   "VENUES_UNAVAILABLE"  — all allowed_venues have circuit breaker OPEN
  fob.common.v1.Error error = 3;

  // Diagnostic numbers from the checks (always populated, even on ACCEPT).
  PreHedgeCheckDetails details = 10;
}

message PreHedgeCheckDetails {
  fob.common.v1.Decimal notional_used = 1;
  fob.common.v1.Decimal notional_limit = 2;
  fob.common.v1.Decimal exposure_after = 3;
  fob.common.v1.Decimal exposure_limit = 4;
  int32 slippage_limit_bps = 5;
  // Per-venue health snapshot used at the moment of decision.
  repeated PreHedgeVenueHealth venues = 10;
}

message PreHedgeVenueHealth {
  string venue_id = 1;
  string status = 2;          // CONNECTED | STALE | DISCONNECTED
  bool circuit_breaker_open = 3;
  double health_score = 4;    // 0..1
}

// F-06: aggregated risk/margin snapshot for an entity (user/account).
// Monetary values use fob.common.v1.Decimal (same style as BalanceSnapshot).
// Reuses BalanceSnapshot / PositionSnapshot to expose underlying collateral and
// positions that the margin numbers are derived from.
message RiskSnapshot {
  string entity_id = 1;                              // user_id or account_id
  fob.common.v1.Decimal free_collateral = 2;         // collateral available for new risk
  fob.common.v1.Decimal reserved_collateral = 3;     // collateral locked by open exposure
  fob.common.v1.Decimal initial_margin = 4;          // required initial margin
  fob.common.v1.Decimal maintenance_margin = 5;      // required maintenance margin
  bool margin_call = 6;                              // equity below maintenance margin
  bool liquidation = 7;                              // liquidation triggered
  google.protobuf.Timestamp timestamp = 8;          // snapshot time
  repeated BalanceSnapshot balances = 10;            // underlying collateral balances
  repeated PositionSnapshot positions = 11;          // underlying open positions
}

// F-06: request a risk snapshot for an entity.
message GetRiskSnapshotRequest {
  string entity_id = 1;
}

// F-06: response with the entity's risk snapshot.
message GetRiskSnapshotResponse {
  RiskSnapshot snapshot = 1;
}

service RiskService {
  // Pre-trade risk check (sync)
  rpc CheckNewOrder(PreTradeCheckRequest) returns (PreTradeCheckResponse);

  // F-09 (T-F09-040): grouped pre-trade risk check для combo-группы.
  rpc PreTradeCheckGroup(PreTradeCheckGroupRequest) returns (PreTradeCheckGroupResponse);

  // Pre-hedge risk check (sync). Called by Execution Planning before any
  // ExecutionIntent is fulfilled. See PreHedgeCheckRequest for details.
  // F-12 / DoD-3 / AC F12-8.
  rpc PreHedgeCheck(PreHedgeCheckRequest) returns (PreHedgeCheckResponse);

  // Operator action: halt/resume trading (sync)
  rpc SetKillSwitch(KillSwitchRequest) returns (KillSwitchResponse);

  // Post-trade update (sync alternative to consuming Kafka batch.outputs)
  rpc OnBatchResult(PostTradeUpdateRequest) returns (google.protobuf.Empty);

  // F-06: get aggregated risk/margin snapshot for an entity (user/account)
  rpc GetRiskSnapshot(GetRiskSnapshotRequest) returns (GetRiskSnapshotResponse);
}
