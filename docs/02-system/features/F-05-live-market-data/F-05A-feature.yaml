feature:
  id: F-05A
  name: Vectorized External Liquidity for F-09 Batch/Combo Clearing
  status: planned
  owner: core-team
  level: kite

description: >
  Расширение F-05 Live Market Data для поддержки F-09 multileg_vector_solver.
  market_data преобразует внешние дискретные orderbook levels из CEX/DEX/AMM в
  векторные flow-сегменты w_i (столбцы матрицы W ∈ R^{N×I}, N — активы, I — order
  levels), собирает единую матрицу W и передаёт её в matching. Клиринг возникает
  из условия баланса активов Wx=0 (multi-asset / triangular), БЕЗ создания
  отдельной синтетической книги по парам — каждый внешний order level остаётся
  отдельным flow-сегментом (сохранён provenance venue/source_order_id).

source:
  in: IN-014
  file: incoming-docs/2026-07-07-F-05A-vectorized-external-liquidity-v1.md
  meta: incoming-docs/IN-014.meta.md
  fragmentMap: incoming-docs/IN-014.fragment-map.md
  algorithm: variant_1_external_orders_to_W

# L0 → L1 декомпозиция (IN-013). Use cases создаются на ingress-close.
