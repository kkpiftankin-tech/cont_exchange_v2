feature:
  id: F-11
  name: External Venues / LOB to FOB
  status: in-progress-mvp
  owner: core-team

# Theoretical foundation (IN-012, 2026-04-15) — типология 1D/2D агентов
# для калибровки depth_curve_builder (LOB→FOB conversion).
# См. ADR-035, entities.md §Continuous-Order Primitives, depth_curve_builder.cpp.
theoreticalFoundation:
  source: IN-012
  ref: incoming-docs/2026-04-15-continuous-order-market-academic-v1.md
  sections: ["§5.1", "§5.2", "§A"]
  adr: ADR-035
  primitives: [StandardAgent, LinearFeeAgent, IndependentAgent2D, PortfolioAgent]

description: >
  Подключение внешних торговых площадок (CEX/DEX/AMM), нормализация их
  ордербуков в VenueSnapshot и непрерывное преобразование LOB → FOB в
  VenueLiquidityCurve. Кривые публикуются в Kafka (venue.liquidity.fob)
  и опционально материализуются в SyntheticFlowOrder для совместимости
  с FlowOrder-моделью matching. Параллельно работает Venue Health &
  Routing Service: считает health-score, управляет circuit breaker
  per-venue (CLOSED/OPEN/HALF_OPEN) и публикует venue.health для
  Matching / Risk / Execution Planning. Конфигурация площадок хранится
  в PostgreSQL venue_config с hot reload через Admin API.
  Реализация делится на два compose-сервиса: cpp/venues (External
  Venues Connector + Normalizer + Liquidity Curve Builder + Execution
  Adapter) и cpp/venue_health (Health & Routing).

primaryComponents:
  - external-venues-connector
  - venue-market-data-normalizer
  - venue-liquidity-curve-builder
  - venue-health-routing
  - venue-execution-adapter

protoContracts:
  - contracts/proto/fob/venue/v1/venue.proto
  - contracts/proto/fob/marketdata/v1/marketdata_raw.proto
  - contracts/proto/fob/execution/v1/execution.proto
  - contracts/proto/fob/orders/v1/orders.proto         # SyntheticFlowOrder
  - contracts/proto/fob/common/v1/common.proto

storageDependencies:
  postgresql:
    - venue_config        # площадки + конфиг адаптера, hot reload через Admin API
    - synthetic_orders    # производные SyntheticFlowOrder (lifecycle/audit)
  clickhouse:
    - venue_snapshots          # history of VenueSnapshot (≥ 90 days retention)
    - venue_liquidity_curves   # history of VenueLiquidityCurve

