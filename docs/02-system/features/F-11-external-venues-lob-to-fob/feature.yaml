acceptanceCriteria:
  - "External Venues Connector подключается минимум к 2 CEX (Binance, Coinbase) и 1 DEX/AMM (Uniswap v3) и эмитит нормализованные VenueSnapshot."
  - "Venue Market Data Normalizer публикует VenueSnapshot в Kafka venue.snapshots и в ClickHouse venue_snapshots с retention ≥ 90 дней."
  - "Venue Liquidity Curve Builder строит p(q), S(q), L(v) в режимах L1/L2/L3 и публикует VenueLiquidityCurve в venue.liquidity.fob."
  - "Stale detection: при превышении STALE_THRESHOLD_MS не строятся новые FOB-кривые; обновляется venue.health со status=STALE."
  - "Circuit breaker per-venue реализует FSM CLOSED → OPEN → HALF_OPEN → CLOSED по параметрам CIRCUIT_BREAKER_ERRORS/WINDOW_S/COOLDOWN_S."
  - "Venue Health & Routing Service агрегирует health-score (0..1) и публикует AGGREGATED VenueHealth ≤ 1 секунды после инцидента."
  - "DEX/AMM без классического стакана: синтез virtual LOB через AMM pool extractor + amm_virtual_lob."
  - "Admin API CRUD venue_config + hot reload без рестарта сервиса; изменения применяются ≤ batch_interval_ms."
  - "Производное построение SyntheticFlowOrder из VenueLiquidityCurve по signal synthetic_enabled (опционально, для совместимости с matching v1)."
  - "Venue Execution Adapter принимает ExecutionIntent → child orders → publishes ExecutionReport в execution.venue."
  - "p95 latency получения VenueSnapshot < 500 ms."
  - "p95 LOB→FOB conversion < 50 ms на инструмент в режимах L1/L2."
  - "Cost approximation error epsilon1 ≤ 1% на рабочем диапазоне объёмов."
  - "Graceful degradation L3 → L2 → L1 → OFF при ухудшении данных."
  - "Логирование версий моделей LOB-FOB (level, schema_version, producer_version) для backtest/replay (F-15)."

knownIssues:
  - id: l3-calibration-source-undefined
    severity: feature-gap
    description: >
      L3 (Calibrated) калибруется по execution reports, но источник
      (execution.reports vs execution.venue, окно ретроспективы,
      политика отбора венюй) не зафиксирован спецификацией. См.
      open-questions.md §2.
  - id: routing-policy-not-formalized
    severity: feature-gap
    description: >
      routing_recommendation (allow/caution/avoid/block) рассчитывается
      в cpp/venues (venues_loop.cpp:170-184), но единого формального
      описания политики (пороги health-score, веса метрик) нет.
      Дублируется в Execution Planning (F-12).
  - id: marketdata-raw-vs-venue-snapshots-overlap
    severity: contract-drift
    description: >
      cpp/venues публикует и в legacy marketdata.raw (для F-05), и в
      новый venue.snapshots (для F-11). Дублирование данных. План —
      постепенно перенести consumers F-05 на venue.snapshots, оставив
      marketdata.raw только для совместимости. Conflict Note C-2 в
      venue-topics.md.
  - id: venue-health-dual-producer
    severity: contract-drift
    description: >
      В venue.health пишут оба сервиса: cpp/venues публикует RAW
      heartbeat (через VenueObservabilityProducer), cpp/venue_health
      потребляет и публикует AGGREGATED. event_type разделяет, но
      одна topic+consumer-group может смешать их. Conflict Note C-3
      в venue-topics.md.
  - id: synthetic-orders-table-shape
    severity: doc-drift
    description: >
      Поля таблицы synthetic_orders в IN-004 (syntheticid, venueid,
      pl, ph, qrate, qmax, curveid, snapshotid, status) частично не
      совпадают с тем, что использует
      PostgresSyntheticOrderRepository (см. cpp/venues/src/infra/
      postgres_synthetic_order_repository.cpp). Требуется выравнивание
      перед T-F11-150.
  - id: rest-api-versioning-mixed
    severity: doc-drift
    description: >
      HTTP-маршруты venues admin/public смешаны: /admin/v1/venue-config/*
      (только GET/POST/PUT/DELETE по venue_config) и /api/v1/venues/*
      (полный набор операций). Спецификация описывает только
      /api/v1/venues/*. /admin/v1/* считать deprecated alias.

