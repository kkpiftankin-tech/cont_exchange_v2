  - feature: F-05
    relationship: legacy-overlap
    note: marketdata.raw публикуется venues для F-05; постепенно мигрирует на venue.snapshots
  - feature: F-09
    relationship: matching-consumer
    note: F-09 (combo orders) использует синтез SyntheticFlowOrder
  - feature: F-12
    relationship: downstream-owner
    note: F-12 (Execution Hedge) — основной consumer execution.venue; F-11 предоставляет adapter
  - feature: F-15
