featureId: F-11

components:
  - id: external-venues-connector
    role: primary
    codePath: cpp/venues/src/infra
    runtime: cpp/venues
    docPath: docs/05-components/external-venues-connector/
  - id: venue-market-data-normalizer
    role: primary
    codePath: cpp/venues/src/domain
    runtime: cpp/venues
    docPath: docs/05-components/venue-market-data-normalizer/
  - id: venue-liquidity-curve-builder
    role: primary
    codePath: cpp/venues/src/app
    runtime: cpp/venues
    docPath: docs/05-components/venue-liquidity-curve-builder/
  - id: venue-health-routing
    role: primary
    codePath: cpp/venue_health
    runtime: cpp/venue_health
    docPath: docs/05-components/venue-health-routing/
  - id: venue-execution-adapter
    role: secondary
    codePath: cpp/venues/src/app/execute_on_venue.cpp
    runtime: cpp/venues
    docPath: docs/05-components/venue-execution-adapter/
    note: бизнес-логика принадлежит F-12; F-11 владеет adapter-уровнем
  - id: matching
    role: consumer
    codePath: cpp/matching
    note: использует venue.liquidity.fob и venue.synthetic через external_venue_filter, planner_inputs_cache
  - id: risk
    role: consumer
    codePath: cpp/risk
    status: pending
    note: должен учитывать venue.health (AC-13)
  - id: ledger
    role: consumer
    codePath: cpp/ledger
    note: применяет execution.venue / execution.reports

protoContracts:
  - file: contracts/proto/fob/venue/v1/venue.proto
    role: source-of-truth-for-VenueSnapshot-VenueLiquidityCurve-VenueHealth
  - file: contracts/proto/fob/marketdata/v1/marketdata_raw.proto
    role: legacy-marketdata-feed
  - file: contracts/proto/fob/execution/v1/execution.proto
    role: ExecutionIntent-ExecutionReport
  - file: contracts/proto/fob/orders/v1/orders.proto
    role: SyntheticFlowOrder-message
  - file: contracts/proto/fob/common/v1/common.proto
    role: EventMeta-Decimal-Instrument-Side

kafkaTopics:
  - name: venue.snapshots
    direction: out
    producer: cpp/venues
    consumer:
      - market-data
      - cpp/venue_health
      - observability
    partitionKey: "{venue_id}|{instrument_symbol}"
    retentionMs: 3600000
  - name: venue.liquidity.fob
    direction: out
    producer: cpp/venues
    consumer:
      - matching
      - cpp/matching (Execution Planning)
    partitionKey: "{venue_id}|{instrument_symbol}"
    retentionMs: 86400000
  - name: venue.synthetic
    direction: out
    producer: cpp/venues
    consumer:
      - matching
    partitionKey: "{venue_id}|{instrument_symbol}"
    retentionMs: 86400000
    note: опционально, по флагу synthetic_enabled
  - name: venue.health
    direction: bidirectional
    producer:
      - cpp/venues          # RAW event_type
      - cpp/venue_health    # AGGREGATED event_type
    consumer:
      - cpp/venue_health
      - risk
      - cpp/matching (Execution Planning)
      - observability
    partitionKey: "{venue_id}"
    retentionMs: 604800000
  - name: execution.intents
    direction: in
    producer: matching / risk
    consumer: cpp/venues
    partitionKey: "{intent_id}"
  - name: execution.venue
    direction: out
    producer: cpp/venues
    consumer:
      - ledger
      - observability
    partitionKey: "{hedge_flow_id}"
    retentionMs: 604800000
    note: F-12 owns the contract semantics
  - name: execution.reports
    direction: out
    producer: cpp/venues
    consumer:
      - ledger
      - observability
    status: legacy
  - name: marketdata.raw
    direction: out
    producer: cpp/venues
    consumer:
      - market-data
    status: legacy-overlap-with-venue.snapshots
    note: см. Conflict Note C-2 в venue-topics.md
  - name: backtest.execution.venue
    direction: out
    producer: cpp/venues
    consumer: backtest
    note: только для backtest-режима

restApi:
  - method: GET
    path: /api/v1/venues
    handler: cpp/venues/src/main.cpp (Crow)
  - method: GET
    path: /api/v1/venues/{venueId}
  - method: POST
    path: /api/v1/venues
  - method: PUT
    path: /api/v1/venues/{venueId}
  - method: DELETE
    path: /api/v1/venues/{venueId}
  - method: POST
    path: /api/v1/venues/{venueId}/reconnect
  - method: POST
    path: /api/v1/venues/{venueId}/enable
  - method: POST
    path: /api/v1/venues/{venueId}/disable
  - method: POST
    path: /api/v1/venues/{venueId}/routing-mode
  - method: GET
    path: /api/v1/venues/{venueId}/snapshots
  - method: GET
    path: /api/v1/venues/{venueId}/curves
  - method: GET
    path: /api/v1/venues/{venueId}/synthetics
  - method: GET
    path: /api/v1/venues/health

