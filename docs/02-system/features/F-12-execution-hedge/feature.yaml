feature:
  id: F-12
  name: Execution Hedge
  status: doc-complete-impl-partial
  owner: core-team
  level: kite

description: >
  Автоматическое хеджирование нетто-позиций провайдера на внешних площадках
  (CEX/DEX/AMM) после внутреннего матчинга. Цепочка:
  netPosition -> ExecutionIntent (Kafka execution.intents) -> Execution Planning
  (routing plan по VenueLiquidityCurve + venue.health) -> Risk Manager
  pre-hedge check -> Venue Execution Adapter (HedgeFlow + child_orders) ->
  External Venues Connector -> ExecutionReport (Kafka execution.venue) ->
  Settlement Ledger обновляет позиции и HedgePnL, ClickHouse сохраняет
  историю исполнения.

  Источник истины: IN-005 (`incoming-docs/2026-05-20-F-12-execution-hedge-v1.md`).

primaryComponents:
  - venue-execution-adapter
  - execution-planning
  - matching-fob-core      # эмитент ExecutionIntent (auto-hedge after batch)
  - risk-manager           # pre-hedge check + post-hedge exposure
  - external-venues        # EVC: реальные REST/WS/RPC к CEX/DEX/AMM
  - ledger                 # потребитель execution.venue
  - observability-reporting
  - market-data            # источник venue.health, venue.liquidity.fob (через F-11)

protoContracts:
  - contracts/proto/fob/execution/v1/execution.proto       # ExecutionIntent, ExecutionReport, ExecutionStrategy, ExecutionUrgency, HedgeSource
  - contracts/proto/fob/hedge/v1/hedge.proto               # HedgeFlow, ChildOrder, HedgeFlowStatus, ChildOrderStatus
  - contracts/proto/fob/risk/v1/risk.proto                 # PreHedgeCheck RPC (планируется как extension)
  - contracts/proto/fob/ledger/v1/ledger.proto             # ApplyExecutionReport
  - contracts/proto/fob/venue/v1/venue.proto               # cross-link к F-11: SideLiquidityCurve, VenueSnapshot, venue.health
  - contracts/proto/fob/common/v1/common.proto             # Decimal, Money, Fee, EventMeta, Instrument, Side, TimeInForce
  - contracts/openapi/fob/hedge/v1/api/hedge.yaml          # REST API HedgeFlow Monitor (operator UI)

storageDependencies:
  postgresql:
    - hedgeflows      # сессия хеджа: targetQty, filledQty, avgFillPrice, hedgePnL, status; источник истины при OPEN
    - child_orders    # дочерние ордера на конкретных venues: venueId, price, qty, status, clientOrderId
  clickhouse:
    - execution_reports  # история исполнения: report by venue, slippageBps, hedgePnL, latency; retention >= 90 дней

codePaths:
  # matching publishes ExecutionIntent после batch clearing (F-12 эмитент)
  - cpp/matching/src/app/hedge_trigger_policy.cpp
  - cpp/matching/src/app/hedge_trigger_policy.hpp
  - cpp/matching/src/app/execution_intent_builder.cpp
  - cpp/matching/src/app/execution_intent_builder.hpp
  - cpp/matching/src/app/hedge_execution_intents_publisher.cpp
  - cpp/matching/src/app/hedge_execution_intents_publisher.hpp
  - cpp/matching/src/app/external_venue_filter.cpp
  - cpp/matching/src/app/external_venue_filter.hpp
  - cpp/matching/src/app/position_snapshot_calculator.cpp
  - cpp/matching/src/app/position_snapshot_calculator.hpp
  # AUDIT-001 follow-up (2026-06-08): stub `execution_planning_uc.hpp` was never
  # created; real execution-planning interface lives in execution_planner.{cpp,hpp}.
  - cpp/matching/src/app/execution_planner.hpp
  # venues currently hosts Venue Execution Adapter + EVC concerns (Conflict Note C-1)
  - cpp/venues/src/app/execute_on_venue.cpp
  - cpp/venues/src/app/execute_on_venue.hpp
  - cpp/venues/src/app/venues_loop.cpp
  - cpp/venues/src/infra/execution_intents_consumer.cpp
  - cpp/venues/src/infra/execution_intents_consumer.hpp
  - cpp/venues/src/infra/execution_report_producer.cpp
  - cpp/venues/src/infra/execution_report_producer.hpp
  - cpp/venues/src/infra/cex_ws_rest_adapter.cpp
  - cpp/venues/src/infra/cex_ws_rest_adapter.hpp
  - cpp/venues/src/infra/dex_amm_rpc_adapter.cpp
  - cpp/venues/src/infra/dex_amm_rpc_adapter.hpp
  - cpp/venues/src/infra/venue_sim_adapter.cpp
  - cpp/venues/src/infra/venue_sim_adapter.hpp
  - cpp/venues/src/infra/simulated_venue_adapter.cpp
  - cpp/venues/src/domain/venue_adapter.hpp
  # ledger applies ExecutionReport (хедж-учёт)
  - cpp/ledger/src/app/ledger_uc.cpp
  - cpp/ledger/src/infra/kafka_consumers.cpp

kafkaTopics:
  produces:
    - execution.intents   # producer: matching (auto-batch), planning (retry), gateway (manual override); key = hedge_flow_id
    - execution.venue     # producer: venue-execution-adapter (через venues); key = hedge_flow_id; ExecutionReport
    - risk.alerts         # producer: risk; alerts типа HEDGE_REJECTED, HEDGE_UNDERFILL
  consumes:
    - venue.liquidity.fob # из F-11: SideLiquidityCurve по venue/symbol; вход для routing plan
    - venue.health        # из F-11: статус venue (CONNECTED/STALE/DISCONNECTED), latencyMs
    - execution.intents   # consumed by execution-planning (multi-venue routing)
    - execution.venue     # consumed by ledger (apply hedge), risk (post-hedge), clickhouse, observability

grpcServices:
  exposes:
    - fob.risk.v1.RiskService.PreHedgeCheck    # планируется: pre-hedge gate (3 проверки)
  calls:
    - fob.ledger.v1.LedgerService.ApplyExecutionReport  # alternative path к Kafka execution.venue
    - fob.marketdata.v1.MarketDataService.GetReferencePrices  # на reference mid; cross-link к F-04

acceptanceCriteria:
  - "F12-1: ExecutionIntent генерируется автоматически при |netQty| >= hedgeTriggerThreshold (cpp/matching/src/app/hedge_trigger_policy.cpp)."
  - "F12-2: Поддержка urgency LOW/MEDIUM/HIGH с маппингом на ExecutionStrategy и TimeInForce согласно политике."
  - "F12-3: Мульти-venue routing по VenueLiquidityCurve (доля Lv / SumLv) и venue.health (исключение venue со статусом != CONNECTED)."
  - "F12-4: Overfill guard: при accumulatedFilledQty > targetQty + overfillThreshold publish ExecutionReport(OVERFILL_GUARD) и cancel остальных child orders."
  - "F12-5: Reconciliation по истечении hedgeTimeoutMs; при gap > reconciliationGapThreshold создаётся retry ExecutionIntent с urgency=HIGH или risk.alert(HEDGE_UNDERFILL)."
  - "F12-6: Все ExecutionReport публикуются в Kafka execution.venue с partitionKey = hedge_flow_id."
  - "F12-7: HedgeFlow, child_orders сохраняются в PostgreSQL; execution_reports в ClickHouse."
  - "F12-8: Pre-hedge risk check через Risk Manager (PreHedgeCheck RPC) с тремя проверками: maxNotionalPerHedge, hedgeExposureLimit, expectedSlippage <= maxSlippage[urgency]."
  - "F12-9: Backtest-режим через VenueSim (VenueSimAdapter в cpp/venues/src/infra/venue_sim_adapter.cpp) даёт идентичную execution logic без изменения кода Adapter."
  - "F12-10: p95 latency от ExecutionIntent до first child order <= 100 ms для CEX (p95 <= 1000 ms для DEX/AMM)."
  - "F12-11: HedgePnL рассчитывается Settlement Ledger по формуле (avgFillPrice vs referenceMid) и доступен в UI через REST GET /api/v1/hedge/flows/{id}."
  - "F12-12: Rejection fallback: при ExecutionReport(REJECTED) Execution Planning исключает venue и формирует новый routing plan на оставшиеся."

# Definition of Done — 18-item checklist из IN-008 (v2 spec, §6).
# Используется как Jira-чек-лист при закрытии feature F-12.
# Каждый пункт ссылается на artifact / код / тест, демонстрирующий завершённость.
definitionOfDone:
  - id: DoD-1
    status: implemented
    title: ExecutionIntent публикуется в Kafka execution.intents
    description: >
      Producer matching/risk/manual override; payload содержит все обязательные
      поля (hedgeFlowId, batchId, providerId, symbol, side, targetQty,
      referenceMid, urgency, timeoutMs, allowedVenues).
      PR-F12-5 (2026-05-26): HedgeTriggerConfig + HedgeExecutionIntentConfig
      теперь читаются из env (HEDGE_TRIGGER_QTY_<SYM>, HEDGE_INTENT_URGENCY и
      т.д.). Реальные F-12 intent'ы с source=HEDGE_SOURCE_AUTO_BATCH, deterministic
      hedge_flow_id "<batch>|hedge|<provider>|<symbol>", urgency/strategy/tif/
      allowed_venues. E2E проверено на ubuntu-dev: PG hedgeflows получает
      строки с |hedge| суффиксом, статус COMPLETED после исполнения venues.
    evidence: |
      cpp/matching/src/app/matching_loop.cpp (LoadHedgeTriggerConfig,
      LoadHedgeExecutionIntentConfig + структурный лог "F-12 hedge config loaded"),
      cpp/matching/src/app/execution_intent_builder.cpp:279-357
      (BuildFromHedgeTriggerDecisions),
      cpp/matching/src/app/hedge_execution_intents_publisher.cpp,
      cpp/venues/src/app/venues_loop.cpp (propagation
      intent.hedge_flow_id → report.hedge_flow_id для PG update),
      infra/env/.env-example (HEDGE_TRIGGER_* + HEDGE_INTENT_* vars)
  - id: DoD-2
    status: implemented
    title: Execution Planning Forecast потребляет execution.intents + venue.liquidity.fob + venue.health
    description: >
      Строит routing-план (qty split по venues, urgency, fallback list),
      передаёт в Venue Execution Adapter.

      PR-F12-15 (2026-05-27): multi-venue routing реализован в matching.
      Новый модуль `cpp/matching/src/app/execution_planner.{hpp,cpp}`:
        - `BuildMultiVenuePlan(request, config)` — pure function,
          фильтрует planner_inputs по allowed_venues + usable + health,
          вычисляет L(v) = max(q_grid) на нужной стороне curve,
          распределяет target_qty proportionally to L(v), отбрасывает
          sub-threshold allocations (default 5% от target) и
          перераспределяет share на выживших.
        - `FanOutIntentByPlan(intent, plan)` — клонирует
          ExecutionIntent на N штук, по одному на venue allocation.
          Каждый клон: hedge_flow_id = <base>|<venue>,
          intent_id = <new_hedge_flow_id>|intent,
          target_qty = allocated_qty, venue = venue_id,
          allowed_venues = [venue_id], partition_key обновлён.
      Wiring в `matching_loop.cpp` перед PublishAutoHedgeExecutionIntents:
        - snapshot planner_inputs_cache_ для symbol под mutex,
        - для каждого intent вызвать BuildMultiVenuePlan,
        - если plan.feasible && >=2 allocations → FanOutIntentByPlan и
          использовать клонов вместо оригинала,
        - иначе оригинальный intent сохраняется (fallback-safe).

      PR-F12-16 (2026-05-28): verified.
      - Unit test `matching_execution_planner_test` (7 cases) — ALL PASS:
        proportional split (L=3/1 → 0.30/0.10 of 0.40), circuit-breaker
        venue exclusion, allow-list filter, infeasible (no liquidity),
        sub-threshold prune+redistribute (dust venue dropped, sum still
        == target), fan-out cloning (venue suffix + locked allowed_venues),
        single-allocation passthrough.
      - Live integration on ubuntu-dev: matching emits
        "Multi-venue routing plan computed" per hedge intent; for a
        triggered SELL hedge the planner produced a feasible plan with
        correct qty (e.g. uniswap_v3:0.068 = hedge target). Venue
        filtering confirmed (coinbase excluded via circuit breaker,
        planner_inputs=2). Fallback path confirmed (single usable
        venue → 1 allocation → original intent emitted, hedges keep
        flowing).

      Note on live N>=2 fan-out: in the current dev venue-sim state only
      uniswap_v3 reliably carries usable ask-side liquidity at hedge
      trigger time (binance ask curve intermittently empty), so the live
      2-venue SPLIT is data-gated. The split arithmetic itself is proven
      deterministically by the unit test rather than relying on flaky
      dev curve availability.

      Ограничения текущей реализации:
        - PreHedgeCheck НЕ вызывается перед fan-out (caller integration
          для DoD-3 — отдельный PR, см. DoD-3 description).
        - Urgency → strategy mapping остаётся config-driven из env,
          не per-allocation.
        - reject_reason из plan'а попадает только в structured log,
          не в risk.alerts.
    evidence: |
      cpp/matching/tests/app/execution_planner_test.cpp (7 unit cases, ALL PASS),
      cpp/matching/src/app/execution_planner.hpp (PlanRequest, PlanResult,
      VenueAllocation, BuildMultiVenuePlan, FanOutIntentByPlan),
      cpp/matching/src/app/execution_planner.cpp,
      cpp/matching/src/app/matching_loop.cpp (fan-out integration
      before PublishAutoHedgeExecutionIntents),
      cpp/matching/CMakeLists.txt (new source registered).
    blocked_by_ac: [F12-3]
  - id: DoD-3
    status: implemented
    title: Pre-hedge risk check (RPC RiskService.PreHedgeCheck)
    description: >
      Проверки maxNotionalPerHedge, hedgeExposureLimit, expectedSlippage;
      при fail publish risk.alerts{type=HEDGE_RISK_REJECT}.

      PR-F12-13 (2026-05-27): RPC реализован в cpp/risk. Пять проверок
      в фиксированном порядке (см. proto §111):
        1. PROVIDER_HALTED      — kill-switch state (per-symbol или global)
        2. NOTIONAL_EXCEEDED    — target_qty * reference_mid > RISK_HEDGE_MAX_NOTIONAL
        3. EXPOSURE_EXCEEDED    — current + target > RISK_HEDGE_EXPOSURE_LIMIT
        4. SLIPPAGE_EXCEEDED    — expected_slippage_bps > RISK_HEDGE_MAX_SLIPPAGE_<URGENCY>_BPS
        5. VENUES_UNAVAILABLE   — все allowed_venues с circuit breaker OPEN

      Решение ACCEPT или REJECT (без RESIZE — частичный хедж создаёт
      «тихий» риск с residual exposure без auto-follow-up, оператор
      должен переиздать меньший intent).

      `details` (PreHedgeCheckDetails) заполняется всегда, в том числе
      на ACCEPT — содержит notional_used/limit, exposure_after/limit,
      slippage_limit_bps, per-venue health snapshot.

      Caller integration (Execution Planning блокирующий вызов перед
      публикацией intent) — отдельный PR. Сейчас RPC доступен,
      thresholds конфигурируются через env в `.env-example`.

      Publish risk.alerts на REJECT — отложен в follow-up PR
      (структурный лог "PreHedgeCheck REJECTED" пишется, alert не
      эмитируется).

      E2E verified on ubuntu-dev: grpcurl против infra-risk-1
      (172.19.0.3:50052) — ACCEPT (0.05 BTC at 76k = 3800 USDT <
      100k limit) + REJECT NOTIONAL_EXCEEDED + REJECT SLIPPAGE_EXCEEDED
      + REJECT EXPOSURE_EXCEEDED. Все ответы содержат корректные
      diagnostic details.
    evidence: |
      contracts/proto/fob/risk/v1/risk.proto (PreHedgeCheck RPC, PR-F12-2),
      cpp/risk/src/app/risk_uc.{hpp,cpp} (PreHedgeCheck method, 5 checks,
      HedgeRiskConfig env loader),
      cpp/risk/src/transport/grpc_risk_service.{hpp,cpp} (gRPC handler),
      infra/env/.env-example (RISK_HEDGE_MAX_NOTIONAL, _EXPOSURE_LIMIT,
      _MAX_SLIPPAGE_{LOW,MEDIUM,HIGH}_BPS).
  - id: DoD-4
    status: implemented
    title: Venue Execution Adapter создаёт HedgeFlow + child_orders в PostgreSQL
    description: >
      INSERT в hedgeflows (status=OPEN) + child_orders (status=PENDING)
      перед адаптер-вызовом; UPDATE по обоим (status, filled_qty,
      avg_price) после Publish ExecutionReport. Идемпотентность через
      ON CONFLICT DO NOTHING. Implemented in PR-F12-3a (2026-05-25).
    evidence: |
      cpp/venues/src/infra/postgres_hedgeflow_repository.{hpp,cpp},
      cpp/venues/src/infra/postgres_child_order_repository.{hpp,cpp},
      wired in venues_loop.cpp + main.cpp. E2E verified on ubuntu-dev:
      order 98ab9c8c → hedgeflows.status=COMPLETED + child_orders.status=FILLED.
    resolved_in: PR-F12-3a
    remaining_gaps: |
      Multi-venue split (PR-F12-5) — current code assumes 1 intent → 1 child.
      provider_id is empty for external_fill intents (matching gap).
  - id: DoD-5
    status: implemented
    title: ExecutionReport публикуется в Kafka execution.venue
    description: >
      Producer ExecutionReportProducer (cpp/venues/src/infra/execution_report_producer.cpp);
      зеркалирование в execution.reports для backward compatibility.
    evidence: IN-007 runtime confirmation (2026-05-22, 70 reports за 3 мин)
    blocked_by_ac: [F12-6]
  - id: DoD-6
    status: implemented
    title: Settlement Ledger потребляет execution.venue и обновляет positions/balances/HedgePnL
    description: >
      Consumer (cpp/ledger/src/infra/kafka_consumers.cpp) подписан на оба
      топика execution.venue/execution.reports с идемпотентностью по
      report_id. HedgePnL рассчитывается в
      LedgerUseCases::calculate_hedge_pnl по формуле
      pnl = (executed - internal) * qty (sign-flip для BUY) — что
      эквивалентно IN-009 §4.6 для favorable side. После расчёта
      аккумулируется в PG hedgeflows row через PostgresHedgeflowPnlSink
      (PR-F12-3c).
    evidence: |
      cpp/ledger/src/app/ledger_uc.cpp::calculate_hedge_pnl,
      cpp/ledger/src/infra/postgres_repositories.cpp::PostgresHedgeflowPnlSink.
      E2E verified on ubuntu-dev (2026-05-26): order 71f8b9c1 ->
      hedgeflows row gets hedge_pnl + tot_fee columns populated (NUMERIC,
      not NULL); ledger emits structured log "Hedge PnL computed (F-12 DoD-6)".
    resolved_in: PR-F12-3c
    remaining_gaps: |
      For matching's external_fill intents, internal_price == executed_price
      by construction (single-leg fill against external liquidity), so
      hedge_pnl_delta = 0. Real non-zero PnL requires the proper F-12 hedge
      path (hedge_trigger_policy → execution_intent_builder → routing plan)
      that ships in PR-F12-5.
      ClickHouse execution_reports.hedge_pnl still receives 0 (market_data
      reads it from ExecutionReport proto field, which matching does not
      populate). Cross-PG join workaround documented in IN-009 §7.
  - id: DoD-7
    status: implemented
    title: ClickHouse table execution_reports с retention >= 90 дней
    description: >
      Canonical 20-field schema создана в init.sql (PR-F12-2) и в C++
      CREATE TABLE через ClickHouseBatchStorage::EnsureSchema (PR-F12-3b).
      cpp/market_data dual-write'ит ExecutionReport в обе таблицы:
      legacy execution_venue (Int32 status, 19 полей) и canonical
      execution_reports (LowCardinality(String) status, 20 полей с
      hedge_pnl, slippage_bps, hedge_flow_id, child_order_id, side).
      Partition by toYYYYMM(event_time_ms), TTL 90 дней.
    evidence: |
      infra/clickhouse/init.sql + cpp/market_data/src/infra/clickhouse_storage.cpp
      (BuildExecutionReportV2JsonRow). E2E verified on ubuntu-dev:
      order bb28e3bd → 1 row в execution_reports, venue_id=binance,
      status=FILLED, filled_qty=0.05, avg_price=76814.1.
    resolved_in: PR-F12-3b
    remaining_gaps: |
      side, hedge_flow_id, slippage_bps, hedge_pnl остаются пустыми для
      external_fill intents из matching (matching не заполняет эти поля).
      Полная заливка приходит с PR-F12-5 (multi-venue routing + proper
      hedge_trigger_policy intents).
  - id: DoD-8
    status: implemented
    title: PostgreSQL OLTP tables hedgeflows / child_orders / execution_reports_raw с индексами
    description: >
      Индексы по hedgeFlowId, providerId, symbol, status для SLA UI/services.

      Все три таблицы существуют в `infra/postgres/init.sql`:
        - `hedgeflows` (line 126-153): PK hedge_flow_id (TEXT), индексы
          provider_id+symbol, batch_id, status (OPEN), status
          (UNDERFILLED/REJECTED). NUMERIC(38,18) для qty/price/pnl.
        - `child_orders` (line 163-185): PK child_order_id (TEXT), FK
          hedge_flow_id, индексы venue_id+status, hedge_flow_id,
          venue_order_id; unique (hedge_flow_id, client_order_id) для
          idempotency.
        - `execution_reports_raw` (line 196-222): optional landing
          zone для нормализованных ExecutionReport (опционально пишется
          ledger для audit). Индексы hedge_flow_id, venue_id+applied_at.

      Drift correction (см. DoD-18 / PR-F12-11): id-колонки TEXT (не
      UUID) — чтобы accommodate matching's composite intent_id формат
      от F-04 external_fill path. NUMERIC precision (38,18) (не 24,8).

      Этот DoD был помечен not-implemented до PR-F12-13 (2026-05-27),
      но фактически таблицы доставлены в PR-F12-2 / PR-F12-3a. Status
      обновлён в PR-F12-14 после re-audit.
    evidence: |
      infra/postgres/init.sql:123-222 (3 tables + 8 indexes),
      docs/07-data/{hedgeflows,child-orders,execution-reports}.md
      (актуальные DDL с drift notes, обновлено в PR-F12-11).
    resolved_in: PR-F12-2 (schema), PR-F12-3a (C++ repos wired),
      PR-F12-14 (status update)
  - id: DoD-9
    status: implemented
    title: Unit-тесты Venue Execution Adapter U1-U10
    description: >
      Happy path, partial+retry, overfill guard, rejection+fallback,
      timeout→UNDERFILLED, urgency→orderType mapping, reconciliation gap,
      clientOrderId idempotency, multi-venue split, pre-hedge risk reject.

      PR-F12-17 (2026-05-28): U-suite доставлен. ExecuteOnVenue —
      тонкий adapter (строит child intent, reconnect, маппит
      VenueOrderResult → ExecutionReport), поэтому U-кейсы разнесены
      по слоям. cpp/venues/tests/execute_on_venue_test.cpp расширен
      с 5 до 13 тестов (ALL PASS, verified on ubuntu-dev):
        - U1 happy path FILLED — маппинг status/filled_qty/avg_price/venue_order_id
        - U2 partial fill — PARTIALLY_FILLED + remaining_qty
        - U3 overfill — passthrough БЕЗ trim (документирует gap:
          трим не реализован, есть только enum EXECUTION_REPORT_STATUS_OVERFILL_GUARD
          в PG mapping)
        - U4 rejection — REJECTED + error code/message propagation
        - U5 timeout/UNDERFILLED — status passthrough
        - U6 strategy/tif defaults (at-layer slice; urgency→strategy
          полный mapping в matching execution_intent_builder)
        - U8 clientOrderId idempotency fallback (true dedup = PG
          ON CONFLICT в postgres_child_order_repository)
        - + fee/slippage enrichment + 5 support (symbol map, reconnect,
          missing-adapter, runtime override).

      Кейсы вне слоя ExecuteOnVenue (cross-referenced в header теста):
        - U7 reconciliation gap → ledger/venues_loop watchdog
        - U9 multi-venue split → matching execution_planner_test (DoD-2)
        - U10 pre-hedge risk reject → risk PreHedgeCheck (DoD-3,
          verified via grpcurl).

      Honest gap: U2 "retry" и U4 "fallback" — это venues_loop/planning
      concerns, не ExecuteOnVenue; покрыт только маппинг исходов, не
      retry/fallback orchestration. Полный retry/fallback E2E — DoD-10
      (integration tests).
    evidence: |
      cpp/venues/tests/execute_on_venue_test.cpp (13 tests, ALL PASS),
      built via builder stage TARGET=venues_execute_on_venue_test,
      run on ubuntu-dev exit 0.
      Cross-refs: cpp/matching/tests/app/execution_planner_test.cpp (U9),
