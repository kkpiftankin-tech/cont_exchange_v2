feature:
  id: F-12
  name: Execution Hedge
  status: doc-complete-impl-partial
  owner: core-team

description: >
  Автоматическое хеджирование нетто-позиций провайдера на внешних площадках
  (CEX/DEX/AMM) после внутреннего матчинга. Цепочка:
  netPosition -> ExecutionIntent (Kafka execution.intents) -> Execution Planning
  (routing plan по VenueLiquidityCurve + venue.health) -> Risk Manager
  pre-hedge check -> Venue Execution Adapter (HedgeFlow + child_orders) ->
  External Venues Connector -> ExecutionReport (Kafka execution.venue) ->
  Settlement Ledger обновляет позиции и HedgePnL, ClickHouse сохраняет
  историю исполнения.

  Источник истины: IN-005 (`incoming-docs/2026-05-20-F-12-execution-hedge-v1.md`).

primaryComponents:
  - venue-execution-adapter
  - execution-planning
  - matching-fob-core      # эмитент ExecutionIntent (auto-hedge after batch)
  - risk-manager           # pre-hedge check + post-hedge exposure
  - external-venues        # EVC: реальные REST/WS/RPC к CEX/DEX/AMM
  - ledger                 # потребитель execution.venue
  - observability-reporting
  - market-data            # источник venue.health, venue.liquidity.fob (через F-11)

protoContracts:
  - contracts/proto/fob/execution/v1/execution.proto       # ExecutionIntent, ExecutionReport, ExecutionStrategy, ExecutionUrgency, HedgeSource
  - contracts/proto/fob/hedge/v1/hedge.proto               # HedgeFlow, ChildOrder, HedgeFlowStatus, ChildOrderStatus
  - contracts/proto/fob/risk/v1/risk.proto                 # PreHedgeCheck RPC (планируется как extension)
  - contracts/proto/fob/ledger/v1/ledger.proto             # ApplyExecutionReport
  - contracts/proto/fob/venue/v1/venue.proto               # cross-link к F-11: SideLiquidityCurve, VenueSnapshot, venue.health
  - contracts/proto/fob/common/v1/common.proto             # Decimal, Money, Fee, EventMeta, Instrument, Side, TimeInForce
  - contracts/openapi/fob/hedge/v1/api/hedge.yaml          # REST API HedgeFlow Monitor (operator UI)

storageDependencies:
  postgresql:
    - hedgeflows      # сессия хеджа: targetQty, filledQty, avgFillPrice, hedgePnL, status; источник истины при OPEN
    - child_orders    # дочерние ордера на конкретных venues: venueId, price, qty, status, clientOrderId
  clickhouse:
    - execution_reports  # история исполнения: report by venue, slippageBps, hedgePnL, latency; retention >= 90 дней

codePaths:
  # matching publishes ExecutionIntent после batch clearing (F-12 эмитент)
  - cpp/matching/src/app/hedge_trigger_policy.cpp
  - cpp/matching/src/app/hedge_trigger_policy.hpp
  - cpp/matching/src/app/execution_intent_builder.cpp
  - cpp/matching/src/app/execution_intent_builder.hpp
  - cpp/matching/src/app/hedge_execution_intents_publisher.cpp
  - cpp/matching/src/app/hedge_execution_intents_publisher.hpp
  - cpp/matching/src/app/external_venue_filter.cpp
  - cpp/matching/src/app/external_venue_filter.hpp
  - cpp/matching/src/app/position_snapshot_calculator.cpp
  - cpp/matching/src/app/position_snapshot_calculator.hpp
  - cpp/matching/src/app/execution_planning_uc.hpp          # interface stub
  # venues currently hosts Venue Execution Adapter + EVC concerns (Conflict Note C-1)
  - cpp/venues/src/app/execute_on_venue.cpp
  - cpp/venues/src/app/execute_on_venue.hpp
  - cpp/venues/src/app/venues_loop.cpp
  - cpp/venues/src/infra/execution_intents_consumer.cpp
  - cpp/venues/src/infra/execution_intents_consumer.hpp
  - cpp/venues/src/infra/execution_report_producer.cpp
  - cpp/venues/src/infra/execution_report_producer.hpp
  - cpp/venues/src/infra/cex_ws_rest_adapter.cpp
  - cpp/venues/src/infra/cex_ws_rest_adapter.hpp
  - cpp/venues/src/infra/dex_amm_rpc_adapter.cpp
  - cpp/venues/src/infra/dex_amm_rpc_adapter.hpp
  - cpp/venues/src/infra/venue_sim_adapter.cpp
  - cpp/venues/src/infra/venue_sim_adapter.hpp
  - cpp/venues/src/infra/simulated_venue_adapter.cpp
  - cpp/venues/src/domain/venue_adapter.hpp
  # ledger applies ExecutionReport (хедж-учёт)
  - cpp/ledger/src/app/ledger_uc.cpp
  - cpp/ledger/src/infra/kafka_consumers.cpp

kafkaTopics:
  produces:
    - execution.intents   # producer: matching (auto-batch), planning (retry), gateway (manual override); key = hedge_flow_id
    - execution.venue     # producer: venue-execution-adapter (через venues); key = hedge_flow_id; ExecutionReport
    - risk.alerts         # producer: risk; alerts типа HEDGE_REJECTED, HEDGE_UNDERFILL
  consumes:
    - venue.liquidity.fob # из F-11: SideLiquidityCurve по venue/symbol; вход для routing plan
    - venue.health        # из F-11: статус venue (CONNECTED/STALE/DISCONNECTED), latencyMs
    - execution.intents   # consumed by execution-planning (multi-venue routing)
    - execution.venue     # consumed by ledger (apply hedge), risk (post-hedge), clickhouse, observability

grpcServices:
  exposes:
    - fob.risk.v1.RiskService.PreHedgeCheck    # планируется: pre-hedge gate (3 проверки)
  calls:
    - fob.ledger.v1.LedgerService.ApplyExecutionReport  # alternative path к Kafka execution.venue
    - fob.marketdata.v1.MarketDataService.GetReferencePrices  # на reference mid; cross-link к F-04

acceptanceCriteria:
  - "F12-1: ExecutionIntent генерируется автоматически при |netQty| >= hedgeTriggerThreshold (cpp/matching/src/app/hedge_trigger_policy.cpp)."
  - "F12-2: Поддержка urgency LOW/MEDIUM/HIGH с маппингом на ExecutionStrategy и TimeInForce согласно политике."
  - "F12-3: Мульти-venue routing по VenueLiquidityCurve (доля Lv / SumLv) и venue.health (исключение venue со статусом != CONNECTED)."
  - "F12-4: Overfill guard: при accumulatedFilledQty > targetQty + overfillThreshold publish ExecutionReport(OVERFILL_GUARD) и cancel остальных child orders."
  - "F12-5: Reconciliation по истечении hedgeTimeoutMs; при gap > reconciliationGapThreshold создаётся retry ExecutionIntent с urgency=HIGH или risk.alert(HEDGE_UNDERFILL)."
  - "F12-6: Все ExecutionReport публикуются в Kafka execution.venue с partitionKey = hedge_flow_id."
  - "F12-7: HedgeFlow, child_orders сохраняются в PostgreSQL; execution_reports в ClickHouse."
  - "F12-8: Pre-hedge risk check через Risk Manager (PreHedgeCheck RPC) с тремя проверками: maxNotionalPerHedge, hedgeExposureLimit, expectedSlippage <= maxSlippage[urgency]."
  - "F12-9: Backtest-режим через VenueSim (VenueSimAdapter в cpp/venues/src/infra/venue_sim_adapter.cpp) даёт идентичную execution logic без изменения кода Adapter."
  - "F12-10: p95 latency от ExecutionIntent до first child order <= 100 ms для CEX (p95 <= 1000 ms для DEX/AMM)."
  - "F12-11: HedgePnL рассчитывается Settlement Ledger по формуле (avgFillPrice vs referenceMid) и доступен в UI через REST GET /api/v1/hedge/flows/{id}."
  - "F12-12: Rejection fallback: при ExecutionReport(REJECTED) Execution Planning исключает venue и формирует новый routing plan на оставшиеся."

# Definition of Done — 18-item checklist из IN-008 (v2 spec, §6).
# Используется как Jira-чек-лист при закрытии feature F-12.
# Каждый пункт ссылается на artifact / код / тест, демонстрирующий завершённость.
definitionOfDone:
  - id: DoD-1
    status: implemented
    title: ExecutionIntent публикуется в Kafka execution.intents
    description: >
      Producer matching/risk/manual override; payload содержит все обязательные
      поля (hedgeFlowId, batchId, providerId, symbol, side, targetQty,
      referenceMid, urgency, timeoutMs, allowedVenues).
      PR-F12-5 (2026-05-26): HedgeTriggerConfig + HedgeExecutionIntentConfig
      теперь читаются из env (HEDGE_TRIGGER_QTY_<SYM>, HEDGE_INTENT_URGENCY и
      т.д.). Реальные F-12 intent'ы с source=HEDGE_SOURCE_AUTO_BATCH, deterministic
      hedge_flow_id "<batch>|hedge|<provider>|<symbol>", urgency/strategy/tif/
      allowed_venues. E2E проверено на ubuntu-dev: PG hedgeflows получает
      строки с |hedge| суффиксом, статус COMPLETED после исполнения venues.
    evidence: |
      cpp/matching/src/app/matching_loop.cpp (LoadHedgeTriggerConfig,
      LoadHedgeExecutionIntentConfig + структурный лог "F-12 hedge config loaded"),
      cpp/matching/src/app/execution_intent_builder.cpp:279-357
      (BuildFromHedgeTriggerDecisions),
      cpp/matching/src/app/hedge_execution_intents_publisher.cpp,
      cpp/venues/src/app/venues_loop.cpp (propagation
      intent.hedge_flow_id → report.hedge_flow_id для PG update),
      infra/env/.env-example (HEDGE_TRIGGER_* + HEDGE_INTENT_* vars)
  - id: DoD-2
    status: partial
    title: Execution Planning Forecast потребляет execution.intents + venue.liquidity.fob + venue.health
    description: >
      Строит routing-план (qty split по venues, urgency, fallback list),
      передаёт в Venue Execution Adapter.
    evidence: cpp/matching/src/app/execution_planning_uc.hpp (интерфейс есть, реализация partial)
    blocked_by_ac: [F12-3]
  - id: DoD-3
    status: not-implemented
    title: Pre-hedge risk check (RPC RiskService.PreHedgeCheck)
    description: >
      Проверки maxNotionalPerHedge, hedgeExposureLimit, expectedSlippage;
      при fail publish risk.alerts{type=HEDGE_RISK_REJECT}.
    evidence: contracts/proto/fob/risk/v1/risk.proto (no PreHedgeCheck method)
    blocked_by_ac: [F12-8]
    blocked_by_issue: no-pre-hedge-rpc
  - id: DoD-4
    status: implemented
    title: Venue Execution Adapter создаёт HedgeFlow + child_orders в PostgreSQL
    description: >
      INSERT в hedgeflows (status=OPEN) + child_orders (status=PENDING)
      перед адаптер-вызовом; UPDATE по обоим (status, filled_qty,
      avg_price) после Publish ExecutionReport. Идемпотентность через
      ON CONFLICT DO NOTHING. Implemented in PR-F12-3a (2026-05-25).
    evidence: |
      cpp/venues/src/infra/postgres_hedgeflow_repository.{hpp,cpp},
      cpp/venues/src/infra/postgres_child_order_repository.{hpp,cpp},
      wired in venues_loop.cpp + main.cpp. E2E verified on ubuntu-dev:
      order 98ab9c8c → hedgeflows.status=COMPLETED + child_orders.status=FILLED.
    resolved_in: PR-F12-3a
    remaining_gaps: |
      Multi-venue split (PR-F12-5) — current code assumes 1 intent → 1 child.
      provider_id is empty for external_fill intents (matching gap).
  - id: DoD-5
    status: implemented
    title: ExecutionReport публикуется в Kafka execution.venue
    description: >
      Producer ExecutionReportProducer (cpp/venues/src/infra/execution_report_producer.cpp);
      зеркалирование в execution.reports для backward compatibility.
    evidence: IN-007 runtime confirmation (2026-05-22, 70 reports за 3 мин)
    blocked_by_ac: [F12-6]
  - id: DoD-6
    status: implemented
    title: Settlement Ledger потребляет execution.venue и обновляет positions/balances/HedgePnL
    description: >
      Consumer (cpp/ledger/src/infra/kafka_consumers.cpp) подписан на оба
      топика execution.venue/execution.reports с идемпотентностью по
      report_id. HedgePnL рассчитывается в
      LedgerUseCases::calculate_hedge_pnl по формуле
      pnl = (executed - internal) * qty (sign-flip для BUY) — что
      эквивалентно IN-009 §4.6 для favorable side. После расчёта
      аккумулируется в PG hedgeflows row через PostgresHedgeflowPnlSink
      (PR-F12-3c).
    evidence: |
      cpp/ledger/src/app/ledger_uc.cpp::calculate_hedge_pnl,
      cpp/ledger/src/infra/postgres_repositories.cpp::PostgresHedgeflowPnlSink.
      E2E verified on ubuntu-dev (2026-05-26): order 71f8b9c1 ->
      hedgeflows row gets hedge_pnl + tot_fee columns populated (NUMERIC,
      not NULL); ledger emits structured log "Hedge PnL computed (F-12 DoD-6)".
    resolved_in: PR-F12-3c
    remaining_gaps: |
      For matching's external_fill intents, internal_price == executed_price
      by construction (single-leg fill against external liquidity), so
      hedge_pnl_delta = 0. Real non-zero PnL requires the proper F-12 hedge
      path (hedge_trigger_policy → execution_intent_builder → routing plan)
      that ships in PR-F12-5.
      ClickHouse execution_reports.hedge_pnl still receives 0 (market_data
      reads it from ExecutionReport proto field, which matching does not
      populate). Cross-PG join workaround documented in IN-009 §7.
  - id: DoD-7
    status: implemented
    title: ClickHouse table execution_reports с retention >= 90 дней
    description: >
      Canonical 20-field schema создана в init.sql (PR-F12-2) и в C++
      CREATE TABLE через ClickHouseBatchStorage::EnsureSchema (PR-F12-3b).
      cpp/market_data dual-write'ит ExecutionReport в обе таблицы:
      legacy execution_venue (Int32 status, 19 полей) и canonical
      execution_reports (LowCardinality(String) status, 20 полей с
      hedge_pnl, slippage_bps, hedge_flow_id, child_order_id, side).
      Partition by toYYYYMM(event_time_ms), TTL 90 дней.
    evidence: |
      infra/clickhouse/init.sql + cpp/market_data/src/infra/clickhouse_storage.cpp
      (BuildExecutionReportV2JsonRow). E2E verified on ubuntu-dev:
      order bb28e3bd → 1 row в execution_reports, venue_id=binance,
      status=FILLED, filled_qty=0.05, avg_price=76814.1.
    resolved_in: PR-F12-3b
    remaining_gaps: |
      side, hedge_flow_id, slippage_bps, hedge_pnl остаются пустыми для
      external_fill intents из matching (matching не заполняет эти поля).
      Полная заливка приходит с PR-F12-5 (multi-venue routing + proper
      hedge_trigger_policy intents).
  - id: DoD-8
    status: not-implemented
    title: PostgreSQL OLTP tables hedgeflows / child_orders / execution_reports_raw с индексами
    description: >
      Индексы по hedgeFlowId, providerId, symbol, status для SLA UI/services.
    evidence: infra/postgres/init.sql (tables missing)
    blocked_by_issue: no-hedgeflows-postgres-schema
  - id: DoD-9
    status: not-implemented
    title: Unit-тесты Venue Execution Adapter U1-U10
    description: >
      Happy path, partial+retry, overfill guard, rejection+fallback,
      timeout→UNDERFILLED, urgency→orderType mapping, reconciliation gap,
      clientOrderId idempotency, multi-venue split, pre-hedge risk reject.
    evidence: cpp/venues/tests/execute_on_venue_test.cpp (только базовый smoke)
  - id: DoD-10
    status: not-implemented
    title: Integration-тесты IT-1..IT-4 (E2E через docker compose)
    description: >
      Полный цикл ExecutionIntent → ExecutionReport → Ledger; partial fill+retry;
      rejection+fallback; timeout+UNDERFILLED+risk alert.
    evidence: cpp/venues/tests/integration/ (отсутствует)
  - id: DoD-11
    status: not-implemented
    title: SLA-тест IT-5 latency p95 <= 100 ms (CEX)
    description: >
      50 ExecutionIntent burst, измеренная задержка от publish до первого
      PlaceChildOrder; p50<=50ms, p95<=100ms, p99<=200ms, max<=500ms.
    evidence: нет latency-test
    blocked_by_ac: [F12-10]
  - id: DoD-12
    status: not-implemented
    title: Нагрузочный тест IT-6 throughput >= 50 HedgeFlow/sec
    description: >
      60 сек × 50 intents/sec = 3000 hedges; assertion: fill rate >= 95%,
      Kafka consumer lag 0, ClickHouse записей = 3000 ± δ.
    evidence: нет load-test
  - id: DoD-13
    status: not-implemented
    title: Backtest parity тест IT-7 (production vs Backtest Replay Engine)
    description: >
      Одинаковый input (100 intents + recorded VenueSim events) → identical
      filledQty/avgPrice/status в обоих прогонах. Determinism check.
    evidence: cpp/venues/tests/backtest_parity_check_test.cpp (smoke есть, full parity нет)
    blocked_by_ac: [F12-9]
  - id: DoD-14
    status: partial
    title: Admin UI HedgeFlow Monitor
    description: >
      Список HedgeFlow с filter по symbol/batchId/provider/status/period,
      drill-down (Overview + Child Orders + Execution Timeline tabs),
      экспорт CSV. См. uxScreens.hedge_flow_monitor.
      PR-F12-6 (2026-05-26): доставлен минимальный PG-backed monitor —
      страница /hedge-flows-live с polling-2s, фильтрами по
      status/period, badge-индикатором источника. GET /api/v1/hedge/flows
      запрашивает PG hedgeflows напрямую (frontend-api → pg pool).
      Остаётся: drill-down (Overview + Child Orders + Execution Timeline),
      CSV export, фильтры по symbol/batchId/provider, фильтры по venue.
      Старый /hedgeflows (mock) сохранён до миграции остальных tabs.
    evidence: |
      frontend/api/server.js (handleHedgeFlowsV1, PG pool),
      frontend/web/src/pages/HedgeFlowMonitor/HedgeFlowMonitorLive.js,
      frontend/web/src/pages/HedgeFlowMonitor/HedgeFlowMonitorLive.css,
      route /hedge-flows-live в App.js
  - id: DoD-15
    status: not-implemented
    title: Admin UI Execution Live Feed + Hedge PnL Dashboard + Reconciliation Alerts + Manual Override + Policy Config
    description: >
      Остальные 5 экранов из uxScreens. Manual Override создаёт ExecutionIntent
      через POST /api/v1/execution-intents (origin=MANUAL).
    evidence: frontend/web/src/pages/ (все 5 страниц отсутствуют)
  - id: DoD-16
    status: not-implemented
    title: Observability — Prometheus metrics + Grafana dashboard
    description: >
      Метрики f12_hedge_intent_total, f12_hedge_latency_ms, f12_slippage_bps,
      f12_underfill_total, f12_venue_circuit_state. Grafana dashboard
      F-12-execution-hedge.json. Алерты HEDGE_UNDERFILLED, SLIPPAGE_EXCEEDED,
      LATENCY_SLA_BREACH.
    evidence: нет F-12-специфичных метрик
  - id: DoD-17
    status: not-implemented
    title: Operations runbook docs/11-operations/runbooks/F-12-incidents.md
    description: >
      Диагностические сценарии: повышенный slippage, массовые UNDERFILLED,
      падение venue (circuit breaker), SLA-нарушение latency. Decision tree
      для on-call (change config, disable venue, manual override).
    evidence: docs/11-operations/runbooks/ (нет F-12-incidents.md)
  - id: DoD-18
    status: partial
    title: Архитектурная документация синхронна с реализацией
    description: >
      Sequence diagrams (SEQ-F12-01..03), контракты Kafka/REST/gRPC,
      схемы PG/CH, cross-links к F-04/F-06/F-11/F-15 актуальны и согласованы
      с фактическим кодом cpp/venues + cpp/matching + cpp/ledger + frontend.
    evidence: docs/05-components/sequences/SEQ-F12-* (есть), docs/06-api/* (partial), docs/07-data/* (partial)

# UX Screens из IN-008 (v2 spec, §2.5).
# Каждый экран — отдельная React-страница, потребляющая один или несколько
# REST endpoints. Layout mockups: см. §2.5.1..2.5.6 в чат-источнике.
uxScreens:
  - id: hedge_flow_monitor
    title: HedgeFlow Monitor
    route: /hedge/flows
    purpose: >
      Operations dashboard со списком HedgeFlow (target/filled/status/PnL),
      filter по symbol/batchId/provider/status/period, drill-down в детали
      одного HedgeFlow (3 tabs: Overview, Child Orders, Execution Timeline).
    primary_data_source: PostgreSQL hedgeflows + child_orders + ClickHouse execution_reports
    api_endpoints:
      - GET /api/v1/hedge/flows (list, filter)
      - GET /api/v1/hedge/flows/{id} (detail)
      - GET /api/v1/hedge/flows/{id}/child-orders
      - GET /api/v1/hedge/flows/{id}/execution-timeline
  - id: execution_live_feed
    title: Execution Live Feed
    route: /execution/live
    purpose: >
      Real-time stream ExecutionReport (table + ticker view) с filter
      по symbol/venue/side/status. Быстрые фильтры (slippage>10bps, fee<1.0).
    primary_data_source: Kafka execution.venue (SSE) + ClickHouse history fallback
    api_endpoints:
      - GET /api/v1/execution/live (SSE stream)
  - id: hedge_pnl_dashboard
    title: Hedge PnL Dashboard
    route: /hedge/pnl
    purpose: >
      Аналитика hedge PnL: KPI cards (total PnL, avg slippage bps, fill ratio,
      underfilled share), графики (PnL over time, clearingPrice vs avgFillPrice
      scatter, slippage histogram), таблица HedgeFlow с PnL по выбранному фильтру.
    primary_data_source: ClickHouse execution_reports + batchresults (cross-join по batchId)
    api_endpoints:
      - GET /api/v1/hedge/pnl?from=&to=&symbol=&venue=&provider=
  - id: reconciliation_alerts
    title: Reconciliation Alerts
    route: /hedge/reconciliation-alerts
    purpose: >
      Incident management: UNDERFILLED / REJECTED HedgeFlow с gap, decision tree
      ("отметить обработанным", "create manual override", "export для ticket").
    primary_data_source: PostgreSQL hedgeflows.status IN ('UNDERFILLED','REJECTED') + risk.alerts
    api_endpoints:
      - GET /api/v1/hedge/reconciliation-alerts
      - POST /api/v1/hedge/reconciliation-alerts/{id}/acknowledge
  - id: manual_override
    title: Manual Override (create ExecutionIntent)
    route: /hedge/manual-override
    purpose: >
      Operator form для создания ExecutionIntent вручную с валидацией лимитов
      и preview ожидаемого slippage. origin=MANUAL для audit trail.
    primary_data_source: solverconfig (limits preview) + Risk Manager (preview check)
    api_endpoints:
      - POST /api/v1/execution-intents (origin=MANUAL)
      - GET /api/v1/risk/preview-limits?notional=&urgency=
  - id: policy_config
    title: Policy Config (solverconfig F-12 section)
    route: /hedge/policy-config
    purpose: >
      Настройка Hedge Urgency Policy (LOW/MED/HIGH профили: orderTypes,
      maxSlippageBps, defaultTimeoutMs), Hedge Trigger Threshold (per symbol +
      notional), Venue-specific overrides, аудит изменений.
    primary_data_source: PostgreSQL solver_config + audit log
    api_endpoints:
      - GET /api/v1/policy-config/f12
      - PUT /api/v1/policy-config/f12 (требует подтверждения)
      - GET /api/v1/policy-config/f12/audit
    refresh_mode: on-demand (operator click)

# Refresh modes для всех 6 UI экранов из IN-009 §7.3 (v2.0-final).
# Применяются дополнительно к описанию каждого экрана в uxScreens[].
uxRefreshModes:
  hedge_flow_monitor: polling-2s        # PG.hedgeflows + child_orders
  execution_live_feed: sse-realtime     # Kafka execution.venue (через OBS slot)
  hedge_pnl_dashboard: polling-batch    # ClickHouse execution_reports, ~10s refresh
  reconciliation_alerts: polling-5s     # PG.hedgeflows(UNDERFILLED) + Kafka risk.alerts
  manual_override: on-demand            # write-path → execution.intents
  policy_config: on-demand              # solver_config

# Architecture section из IN-009 §7.4 (v2.0-final).
# Описывает роль Observability Reporting как read-side компонента между
# Admin UI и хранилищами PG/CH/Kafka. UI никогда не ходит напрямую в
# хранилища — все запросы идут через Observability Reporting (REST/SSE).
architecture:
  observabilityReporting:
    role: read-side only
    description: >
      Единственная точка доступа Admin UI к данным F-12. Подписан на Kafka
      (execution.venue, risk.alerts), читает PG/CH, обслуживает UI через
      REST API и SSE. НЕ участвует в pipeline исполнения (никогда не пишет
      в execution.intents). Исключения: Manual Override и Policy Config
      проксируются через OBS в API Matching Backend / Venue Execution Adapter.
    data_flows:
      ingest_background:
        - source: Kafka execution.venue
          consumer: Observability Reporting
          targets: [PostgreSQL hedgeflows/child_orders (aggregates), ClickHouse execution_reports (history)]
          characteristic: непрерывный фон, не зависит от UI
        - source: Kafka risk.alerts
          consumer: Observability Reporting
          targets: [PostgreSQL risk_alerts_log]
      ui_request:
        pattern: "UI → OBS → DB → OBS → UI (строгий линейный порядок)"
        examples:
          - "GET /api/v1/hedge/flows → SELECT FROM hedgeflows"
          - "GET /api/v1/hedge/flows/{id}/child-orders → SELECT FROM child_orders"
          - "GET /api/v1/hedge/flows/{id}/execution-timeline → SELECT FROM execution_reports"
          - "GET /api/v1/execution/live → SSE stream из execution_reports/Kafka"
    conflict_note: |
      В текущем MVP роль "Observability Reporting" исполняется frontend-api
      (Node.js в frontend/api/server.js), а cpp/observability — минимальный
      Kafka logger без PG/CH access. Полноценный OBS-сервис (C++ с REST API,
      Kafka ingest в PG/CH, SSE-стрим) — отдельный компонент будущего;
      требует ADR-016 для выбора между:
      (a) расширить cpp/observability до full OBS service
      (b) формализовать frontend-api как Observability Reporting role
      (c) выделить новый cpp/observability_reporting сервис

# Operator timeline из IN-009 §7.2 (v2.0-final).
# Step-by-step хронология того, что видит оператор в Admin UI после
# завершения матчинга и публикации ExecutionIntent.
# Полезно для QA test cases (можно превратить в test plan UI scenarios)
# и для UX flow design.
operatorTimeline:
  - step: 1
    actor: Matching Backend
    action: Публикует ExecutionIntent → Kafka execution.intents
    ui_visibility: (не видно, хедж ещё не начат)
  - step: 2
    actor: Venue Execution Adapter
    action: INSERT hedgeflows (status=OPEN) → PostgreSQL
    ui_visibility: HedgeFlow Monitor — новая строка со статусом OPEN
  - step: 3
    actor: Venue Execution Adapter
    action: INSERT child_orders (status=PENDING) → PostgreSQL
    ui_visibility: Drill-down — child-ордера со статусом PENDING
  - step: 4
    actor: External Venues Connector
    action: Отправляет child-ордера на venue (CEX/DEX)
    ui_visibility: (не видно)
  - step: 5
    actor: Venue
    action: Возвращает Execution Report (FILLED/PARTIALLY_FILLED/REJECTED)
    ui_visibility: (не видно)
  - step: 6
    actor: Venue Execution Adapter
    action: Publishes ExecutionReport → Kafka execution.venue
    ui_visibility: Execution Live Feed — новая строка в real-time
  - step: 7
    actor: Venue Execution Adapter
    action: UPDATE child_orders, UPDATE hedgeflows.filledQty → PostgreSQL
    ui_visibility: HedgeFlow Monitor — обновляется filledQty + fillRatio
  - step: 8
    actor: Observability Reporting
    action: Reads execution_reports → ClickHouse
    ui_visibility: Hedge PnL Dashboard — обновляются slippageBps, hedgePnL
  - step: 9
    actor: Venue Execution Adapter
    action: Reconciliation → UPDATE hedgeflows.status = COMPLETED / UNDERFILLED
    ui_visibility: HedgeFlow Monitor — статус меняется OPEN → COMPLETED/UNDERFILLED
  - step: 10
    actor: Risk Manager
    action: risk.alerts(HEDGE_UNDERFILL) → Kafka → Observability
    ui_visibility: Reconciliation Alerts — новая строка с gap и timestamp

knownIssues:
  - id: no-venue-execution-adapter-service
    severity: feature-gap
    description: >
      В коде нет отдельного сервиса `cpp/venue_execution_adapter/`. Реализация
      сосредоточена в `cpp/venues/src/` (ExecuteOnVenue, VenueAdapter implementations,
      ExecutionIntentsConsumer, ExecutionReportProducer). Архитектурно это
      допустимо для MVP, но требует ADR-решения о финальной декомпозиции
      (см. ADR-012 в docs/03-architecture/adr/).
    location: cpp/venues/src/
  - id: no-execution-planning-service
    severity: feature-gap
    description: >
      Multi-venue routing plan (F12-PLAN-1..4) реализован частично:
      ExecutionIntent эмитируется matching-сервисом (через
      HedgeExecutionIntentsPublisher), но логика routing по venue.liquidity.fob
      + venue.health (формула qty[v] = L(v)/Sum L(v') * targetQty) ещё
      не имплементирована. Интерфейс `IExecutionPlanningUseCases` присутствует,
      но без полной реализации.
    location: cpp/matching/src/app/execution_planning_uc.hpp
  - id: venues-sim-zero-execution-price
    severity: dev-limitation
    description: >
      In simulate_orders mode (default in dev), venue adapters publish
      ExecutionReport with executed_price = 0 (no price simulation for
      MARKET strategy). As a result, Settlement Ledger computes
      hedge_pnl_delta = (executed_price - internal_price) * qty = 0
      for every real F-12 hedge intent — even though the flow is fully
      wired and PG.hedgeflows.filled_qty/status/completed_at update correctly.
      A non-zero PnL demonstration requires either (a) wiring sim adapters
      to set executed_price ≈ internal_price ± slippage, or (b) running
      against real CEX/DEX adapters (CEX_SIMULATE_ORDERS=0).
    location: cpp/venues/src/infra/cex_ws_rest_adapter.cpp, cpp/venues/src/infra/dex_amm_rpc_adapter.cpp
    surfaced_in: PR-F12-5 E2E (2026-05-26)
  - id: no-hedgeflows-postgres-schema
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3a (2026-05-25). Schemas in init.sql + C++
      repos (postgres_hedgeflow_repository, postgres_child_order_repository)
      wired into cpp/venues. E2E verified: order → row in hedgeflows +
      child_orders with terminal status. Schema is TEXT (not UUID) to
      accept matching's composite external_fill intent_id format.
    location: infra/postgres/init.sql, cpp/venues/src/infra/postgres_*
    resolved_in: PR-F12-3a
  - id: no-execution-reports-clickhouse
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3b (2026-05-26). Schema in init.sql + C++
      EnsureSchema; cpp/market_data dual-writes ExecutionReport via
      SaveExecutionReport (both legacy execution_venue + canonical
      execution_reports). Live verified: 1 row appears in execution_reports
      after a single test sell order. Hedge PnL Dashboard and
      Reconciliation Alerts (UI screens in PR-F12-6) can now query this table.
    location: infra/clickhouse/init.sql, cpp/market_data/src/infra/clickhouse_storage.*
    resolved_in: PR-F12-3b
  - id: no-pre-hedge-rpc
    severity: feature-gap
    status: contract-ready-impl-pending
    description: >
      В `fob.risk.v1.RiskService` добавлен RPC `PreHedgeCheck` с messages
      `PreHedgeCheckRequest/Response/Details`, `PreHedgeVenueAllocation`,
      `PreHedgeVenueHealth` (PR-F12-2, 2026-05-23). Реализация в C++
      `cpp/risk/src/transport/grpc_risk_service.cpp` отсутствует — будет
      добавлена в PR-F12-4.
    location: contracts/proto/fob/risk/v1/risk.proto
    resolved_in: PR-F12-2 (contract added; server impl pending in PR-F12-4)
  - id: hedge-pnl-not-computed
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3c (2026-05-26). calculate_hedge_pnl in
      ledger_uc.cpp already had correct math (sign-flip for BUY) —
      what was missing was persistence. New PostgresHedgeflowPnlSink
      writes computed hedge_pnl + tot_fee deltas into PG hedgeflows row.
      Live verified: hedge_pnl column transitions NULL -> NUMERIC on
      first ExecutionReport. UI HedgeFlow Monitor (PR-F12-6) can now
      display per-flow PnL.
    location: cpp/ledger/src/app/ledger_uc.cpp, cpp/ledger/src/infra/postgres_repositories.cpp
    resolved_in: PR-F12-3c
  - id: execution-reports-topic-name-mismatch
    severity: conflict
    description: >
      IN-005 спецификация использует имя топика `execution.venue` (producer:
      Venue Execution Adapter; consumer: Ledger/Risk/CH). В создании топиков
      infra/kafka/create_topics.sh заведены и `execution.venue`, и `execution.reports`.
      Существующая документация docs/06-api/messaging/execution-reports.md
      опирается на старое имя `execution.reports`. Источник истины IN-005:
      `execution.venue`. Старый топик остаётся для обратной совместимости
      на период миграции.

      Runtime confirmation (IN-007, 2026-05-22): cpp/venues публикует в
      топик `execution.venue` (поле `topic` в JSON-логе "Produced
      execution report"). CLAUDE.md §7.3 всё ещё перечисляет только
      `execution.reports`. Требуется либо обновить CLAUDE.md, либо
      ADR-015 «execution.venue заменяет execution.reports».
    location: infra/kafka/create_topics.sh#L60-L61, CLAUDE.md §7.3
    target_pr: PR-C (см. IN-007.meta.md)
  - id: ledger-not-consuming-execution-venue-events
    severity: critical
    source: IN-007 (runtime finding 2026-05-22)
    description: >
      cpp/venues публикует 70 execution reports в `execution.venue` за
      ~3 минуты теста (order 89b0a0aa-...), при этом в `docker logs
      infra-ledger-1` за тот же период ноль строк о consumption этого
      топика. Hedge balances в PostgreSQL не обновляются → любой
      auto-hedge сценарий из F-12-01 / F-12-05 молчаливо ломается.

      Возможные причины: (1) ledger подписан только на старый
      `execution.reports` (без producer), (2) consumer для
      `execution.venue` есть, но handler ApplyExecutionReport не
      логирует. Нужно явно подтвердить и закрыть.

      Связано с issue execution-reports-topic-name-mismatch
      (топик-naming) и hedge-pnl-not-implemented (бизнес-логика).
    location: cpp/ledger/src/main.cpp, cpp/ledger/src/app/ledger_uc.cpp
    target_pr: PR-C+ (см. IN-007.meta.md)
  - id: venue-id-vs-venue-symbol-mapping
    severity: feature-gap
    description: >
      Маппинг internal symbol -> venue_symbol реализован простой override-таблицей
      в ExecuteOnVenue (SetVenueSymbolOverride). Полноценный per-venue mapping
      (tick_size, lot_size, fee_bps) приходит из VenueSnapshot, но не
      используется при формировании child orders.
    location: cpp/venues/src/app/execute_on_venue.cpp
  - id: observability-reporting-vs-frontend-api
    severity: conflict
    source: IN-009 (v2.0-final, 2026-05-25)
    description: >
      IN-009 §7 описывает Observability Reporting как полноценный C++ компонент
      между Admin UI и хранилищами PG/CH/Kafka: подписан на Kafka, читает PG/CH,
      обслуживает UI через REST/SSE. В текущем MVP эту роль исполняет
      frontend-api (Node.js в frontend/api/server.js), а cpp/observability —
      минимальный Kafka logger без PG/CH access.

      Решение требует ADR-016 для выбора одного из трёх путей:
      (a) расширить cpp/observability до full OBS service (C++ + libpqxx +
          Crow REST + SSE);
      (b) формализовать frontend-api как Observability Reporting role (Node.js
          остаётся, но переименовывается в архитектурной документации);
      (c) выделить новый cpp/observability_reporting сервис, оставив
          cpp/observability как pure Kafka logger.

      До решения ADR-016: используется путь (b) — frontend-api играет роль
      OBS-слоя, но не называется так в коде. Спецификация IN-009 фиксирует
      это явно через architecture.observabilityReporting.conflict_note.
    location: |
      docs/05-components/observability-reporting/ (current C++ service description)
      vs
      frontend/api/server.js (actual OBS implementation in MVP)
    target_pr: ADR-016 (architecture decision pending)

