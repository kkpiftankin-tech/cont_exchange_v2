# UX Screens из IN-008 (v2 spec, §2.5).
# Каждый экран — отдельная React-страница, потребляющая один или несколько
# REST endpoints. Layout mockups: см. §2.5.1..2.5.6 в чат-источнике.
uxScreens:
  - id: hedge_flow_monitor
    title: HedgeFlow Monitor
    route: /hedge/flows
    purpose: >
      Operations dashboard со списком HedgeFlow (target/filled/status/PnL),
      filter по symbol/batchId/provider/status/period, drill-down в детали
      одного HedgeFlow (3 tabs: Overview, Child Orders, Execution Timeline).
    primary_data_source: PostgreSQL hedgeflows + child_orders + ClickHouse execution_reports
    api_endpoints:
      - GET /api/v1/hedge/flows (list, filter)
      - GET /api/v1/hedge/flows/{id} (detail)
      - GET /api/v1/hedge/flows/{id}/child-orders
      - GET /api/v1/hedge/flows/{id}/execution-timeline
  - id: execution_live_feed
    title: Execution Live Feed
    route: /execution/live
    purpose: >
      Real-time stream ExecutionReport (table + ticker view) с filter
      по symbol/venue/side/status. Быстрые фильтры (slippage>10bps, fee<1.0).
    primary_data_source: Kafka execution.venue (SSE) + ClickHouse history fallback
    api_endpoints:
      - GET /api/v1/execution/live (SSE stream)
  - id: hedge_pnl_dashboard
    title: Hedge PnL Dashboard
    route: /hedge/pnl
    purpose: >
      Аналитика hedge PnL: KPI cards (total PnL, avg slippage bps, fill ratio,
      underfilled share), графики (PnL over time, clearingPrice vs avgFillPrice
      scatter, slippage histogram), таблица HedgeFlow с PnL по выбранному фильтру.
    primary_data_source: ClickHouse execution_reports + batchresults (cross-join по batchId)
    api_endpoints:
      - GET /api/v1/hedge/pnl?from=&to=&symbol=&venue=&provider=
  - id: reconciliation_alerts
    title: Reconciliation Alerts
    route: /hedge/reconciliation-alerts
    purpose: >
      Incident management: UNDERFILLED / REJECTED HedgeFlow с gap, decision tree
      ("отметить обработанным", "create manual override", "export для ticket").
    primary_data_source: PostgreSQL hedgeflows.status IN ('UNDERFILLED','REJECTED') + risk.alerts
    api_endpoints:
      - GET /api/v1/hedge/reconciliation-alerts
      - POST /api/v1/hedge/reconciliation-alerts/{id}/acknowledge
  - id: manual_override
    title: Manual Override (create ExecutionIntent)
    route: /hedge/manual-override
    purpose: >
      Operator form для создания ExecutionIntent вручную с валидацией лимитов
      и preview ожидаемого slippage. origin=MANUAL для audit trail.
    primary_data_source: solverconfig (limits preview) + Risk Manager (preview check)
    api_endpoints:
      - POST /api/v1/execution-intents (origin=MANUAL)
      - GET /api/v1/risk/preview-limits?notional=&urgency=
  - id: policy_config
    title: Policy Config (solverconfig F-12 section)
    route: /hedge/policy-config
    purpose: >
      Настройка Hedge Urgency Policy (LOW/MED/HIGH профили: orderTypes,
      maxSlippageBps, defaultTimeoutMs), Hedge Trigger Threshold (per symbol +
      notional), Venue-specific overrides, аудит изменений.
    primary_data_source: PostgreSQL solver_config + audit log
    api_endpoints:
      - GET /api/v1/policy-config/f12
      - PUT /api/v1/policy-config/f12 (требует подтверждения)
      - GET /api/v1/policy-config/f12/audit
    refresh_mode: on-demand (operator click)

# Refresh modes для всех 6 UI экранов из IN-009 §7.3 (v2.0-final).
# Применяются дополнительно к описанию каждого экрана в uxScreens[].
uxRefreshModes:
  hedge_flow_monitor: polling-2s        # PG.hedgeflows + child_orders
  execution_live_feed: sse-realtime     # Kafka execution.venue (через OBS slot)
  hedge_pnl_dashboard: polling-batch    # ClickHouse execution_reports, ~10s refresh
  reconciliation_alerts: polling-5s     # PG.hedgeflows(UNDERFILLED) + Kafka risk.alerts
  manual_override: on-demand            # write-path → execution.intents
  policy_config: on-demand              # solver_config

# Architecture section из IN-009 §7.4 (v2.0-final).
# Описывает роль Observability Reporting как read-side компонента между
# Admin UI и хранилищами PG/CH/Kafka. UI никогда не ходит напрямую в
# хранилища — все запросы идут через Observability Reporting (REST/SSE).
architecture:
  observabilityReporting:
    role: read-side only
    description: >
      Единственная точка доступа Admin UI к данным F-12. Подписан на Kafka
      (execution.venue, risk.alerts), читает PG/CH, обслуживает UI через
      REST API и SSE. НЕ участвует в pipeline исполнения (никогда не пишет
      в execution.intents). Исключения: Manual Override и Policy Config
      проксируются через OBS в API Matching Backend / Venue Execution Adapter.
    data_flows:
      ingest_background:
        - source: Kafka execution.venue
          consumer: Observability Reporting
          targets: [PostgreSQL hedgeflows/child_orders (aggregates), ClickHouse execution_reports (history)]
          characteristic: непрерывный фон, не зависит от UI
        - source: Kafka risk.alerts
          consumer: Observability Reporting
          targets: [PostgreSQL risk_alerts_log]
      ui_request:
        pattern: "UI → OBS → DB → OBS → UI (строгий линейный порядок)"
        examples:
          - "GET /api/v1/hedge/flows → SELECT FROM hedgeflows"
          - "GET /api/v1/hedge/flows/{id}/child-orders → SELECT FROM child_orders"
          - "GET /api/v1/hedge/flows/{id}/execution-timeline → SELECT FROM execution_reports"
          - "GET /api/v1/execution/live → SSE stream из execution_reports/Kafka"
    conflict_note: |
      В текущем MVP роль "Observability Reporting" исполняется frontend-api
      (Node.js в frontend/api/server.js), а cpp/observability — минимальный
      Kafka logger без PG/CH access. Полноценный OBS-сервис (C++ с REST API,
      Kafka ingest в PG/CH, SSE-стрим) — отдельный компонент будущего;
      требует ADR-016 для выбора между:
      (a) расширить cpp/observability до full OBS service
      (b) формализовать frontend-api как Observability Reporting role
      (c) выделить новый cpp/observability_reporting сервис

# Operator timeline из IN-009 §7.2 (v2.0-final).
# Step-by-step хронология того, что видит оператор в Admin UI после
# завершения матчинга и публикации ExecutionIntent.
# Полезно для QA test cases (можно превратить в test plan UI scenarios)
# и для UX flow design.
operatorTimeline:
  - step: 1
    actor: Matching Backend
    action: Публикует ExecutionIntent → Kafka execution.intents
    ui_visibility: (не видно, хедж ещё не начат)
  - step: 2
    actor: Venue Execution Adapter
    action: INSERT hedgeflows (status=OPEN) → PostgreSQL
    ui_visibility: HedgeFlow Monitor — новая строка со статусом OPEN
  - step: 3
    actor: Venue Execution Adapter
    action: INSERT child_orders (status=PENDING) → PostgreSQL
    ui_visibility: Drill-down — child-ордера со статусом PENDING
  - step: 4
    actor: External Venues Connector
    action: Отправляет child-ордера на venue (CEX/DEX)
    ui_visibility: (не видно)
  - step: 5
    actor: Venue
    action: Возвращает Execution Report (FILLED/PARTIALLY_FILLED/REJECTED)
    ui_visibility: (не видно)
  - step: 6
    actor: Venue Execution Adapter
    action: Publishes ExecutionReport → Kafka execution.venue
    ui_visibility: Execution Live Feed — новая строка в real-time
  - step: 7
    actor: Venue Execution Adapter
    action: UPDATE child_orders, UPDATE hedgeflows.filledQty → PostgreSQL
    ui_visibility: HedgeFlow Monitor — обновляется filledQty + fillRatio
  - step: 8
    actor: Observability Reporting
    action: Reads execution_reports → ClickHouse
    ui_visibility: Hedge PnL Dashboard — обновляются slippageBps, hedgePnL
  - step: 9
    actor: Venue Execution Adapter
    action: Reconciliation → UPDATE hedgeflows.status = COMPLETED / UNDERFILLED
    ui_visibility: HedgeFlow Monitor — статус меняется OPEN → COMPLETED/UNDERFILLED
  - step: 10
    actor: Risk Manager
    action: risk.alerts(HEDGE_UNDERFILL) → Kafka → Observability
    ui_visibility: Reconciliation Alerts — новая строка с gap и timestamp

knownIssues:
  - id: no-venue-execution-adapter-service
    severity: feature-gap
    description: >
      В коде нет отдельного сервиса `cpp/venue_execution_adapter/`. Реализация
      сосредоточена в `cpp/venues/src/` (ExecuteOnVenue, VenueAdapter implementations,
      ExecutionIntentsConsumer, ExecutionReportProducer). Архитектурно это
      допустимо для MVP, но требует ADR-решения о финальной декомпозиции
      (см. ADR-012 в docs/03-architecture/adr/).
    location: cpp/venues/src/
  - id: no-execution-planning-service
    severity: feature-gap
    description: >
      Multi-venue routing plan (F12-PLAN-1..4) реализован частично:
      ExecutionIntent эмитируется matching-сервисом (через
      HedgeExecutionIntentsPublisher), но логика routing по venue.liquidity.fob
      + venue.health (формула qty[v] = L(v)/Sum L(v') * targetQty) ещё
      не имплементирована. Интерфейс `IExecutionPlanningUseCases` присутствует,
      но без полной реализации.
    location: cpp/matching/src/app/execution_planner.hpp
  - id: venues-sim-zero-execution-price
    severity: dev-limitation
    description: >
      In simulate_orders mode (default in dev), venue adapters publish
      ExecutionReport with executed_price = 0 (no price simulation for
      MARKET strategy). As a result, Settlement Ledger computes
      hedge_pnl_delta = (executed_price - internal_price) * qty = 0
      for every real F-12 hedge intent — even though the flow is fully
      wired and PG.hedgeflows.filled_qty/status/completed_at update correctly.
      A non-zero PnL demonstration requires either (a) wiring sim adapters
      to set executed_price ≈ internal_price ± slippage, or (b) running
      against real CEX/DEX adapters (CEX_SIMULATE_ORDERS=0).
    location: cpp/venues/src/infra/cex_ws_rest_adapter.cpp, cpp/venues/src/infra/dex_amm_rpc_adapter.cpp
    surfaced_in: PR-F12-5 E2E (2026-05-26)
  - id: no-hedgeflows-postgres-schema
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3a (2026-05-25). Schemas in init.sql + C++
      repos (postgres_hedgeflow_repository, postgres_child_order_repository)
      wired into cpp/venues. E2E verified: order → row in hedgeflows +
      child_orders with terminal status. Schema is TEXT (not UUID) to
      accept matching's composite external_fill intent_id format.
    location: infra/postgres/init.sql, cpp/venues/src/infra/postgres_*
    resolved_in: PR-F12-3a
  - id: no-execution-reports-clickhouse
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3b (2026-05-26). Schema in init.sql + C++
      EnsureSchema; cpp/market_data dual-writes ExecutionReport via
      SaveExecutionReport (both legacy execution_venue + canonical
      execution_reports). Live verified: 1 row appears in execution_reports
      after a single test sell order. Hedge PnL Dashboard and
      Reconciliation Alerts (UI screens in PR-F12-6) can now query this table.
    location: infra/clickhouse/init.sql, cpp/market_data/src/infra/clickhouse_storage.*
    resolved_in: PR-F12-3b
  - id: no-pre-hedge-rpc
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-13 (2026-05-27). PreHedgeCheck RPC реализован
      в cpp/risk/src/app/risk_uc.cpp + grpc_risk_service.cpp. Пять
      проверок (PROVIDER_HALTED, NOTIONAL_EXCEEDED, EXPOSURE_EXCEEDED,
      SLIPPAGE_EXCEEDED, VENUES_UNAVAILABLE) в фиксированном порядке.
      Thresholds конфигурируются через env (RISK_HEDGE_MAX_NOTIONAL,
      _EXPOSURE_LIMIT, _MAX_SLIPPAGE_{LOW,MEDIUM,HIGH}_BPS).
      Diagnostic details (notional_used/limit, exposure_after/limit,
      slippage_limit_bps, venue health snapshot) возвращаются всегда.

      Остаётся в follow-up: (a) caller integration — Execution Planning
      должен вызывать PreHedgeCheck блокирующе перед публикацией intent,
      (b) publish risk.alerts на REJECT (сейчас только structured log).
    location: cpp/risk/src/app/risk_uc.cpp, cpp/risk/src/transport/grpc_risk_service.cpp
    resolved_in: PR-F12-13
  - id: hedge-pnl-not-computed
    severity: resolved
    status: resolved
    description: >
      RESOLVED in PR-F12-3c (2026-05-26). calculate_hedge_pnl in
      ledger_uc.cpp already had correct math (sign-flip for BUY) —
      what was missing was persistence. New PostgresHedgeflowPnlSink
      writes computed hedge_pnl + tot_fee deltas into PG hedgeflows row.
      Live verified: hedge_pnl column transitions NULL -> NUMERIC on
      first ExecutionReport. UI HedgeFlow Monitor (PR-F12-6) can now
      display per-flow PnL.
    location: cpp/ledger/src/app/ledger_uc.cpp, cpp/ledger/src/infra/postgres_repositories.cpp
    resolved_in: PR-F12-3c
  - id: execution-reports-topic-name-mismatch
    severity: conflict
    description: >
      IN-005 спецификация использует имя топика `execution.venue` (producer:
      Venue Execution Adapter; consumer: Ledger/Risk/CH). В создании топиков
      infra/kafka/create_topics.sh заведены и `execution.venue`, и `execution.reports`.
      Существующая документация docs/06-api/messaging/execution-reports.md
      опирается на старое имя `execution.reports`. Источник истины IN-005:
      `execution.venue`. Старый топик остаётся для обратной совместимости
      на период миграции.

      Runtime confirmation (IN-007, 2026-05-22): cpp/venues публикует в
      топик `execution.venue` (поле `topic` в JSON-логе "Produced
      execution report"). CLAUDE.md §7.3 всё ещё перечисляет только
      `execution.reports`. Требуется либо обновить CLAUDE.md, либо
      ADR-015 «execution.venue заменяет execution.reports».
    location: infra/kafka/create_topics.sh#L60-L61, CLAUDE.md §7.3
    target_pr: PR-C (см. IN-007.meta.md)
  - id: ledger-not-consuming-execution-venue-events
    severity: critical
    source: IN-007 (runtime finding 2026-05-22)
    description: >
      cpp/venues публикует 70 execution reports в `execution.venue` за
      ~3 минуты теста (order 89b0a0aa-...), при этом в `docker logs
      infra-ledger-1` за тот же период ноль строк о consumption этого
      топика. Hedge balances в PostgreSQL не обновляются → любой
      auto-hedge сценарий из F-12-01 / F-12-05 молчаливо ломается.

      Возможные причины: (1) ledger подписан только на старый
      `execution.reports` (без producer), (2) consumer для
      `execution.venue` есть, но handler ApplyExecutionReport не
      логирует. Нужно явно подтвердить и закрыть.

      Связано с issue execution-reports-topic-name-mismatch
      (топик-naming) и hedge-pnl-not-implemented (бизнес-логика).
    location: cpp/ledger/src/main.cpp, cpp/ledger/src/app/ledger_uc.cpp
    target_pr: PR-C+ (см. IN-007.meta.md)
  - id: venue-id-vs-venue-symbol-mapping
    severity: feature-gap
    description: >
      Маппинг internal symbol -> venue_symbol реализован простой override-таблицей
      в ExecuteOnVenue (SetVenueSymbolOverride). Полноценный per-venue mapping
      (tick_size, lot_size, fee_bps) приходит из VenueSnapshot, но не
      используется при формировании child orders.
    location: cpp/venues/src/app/execute_on_venue.cpp
  - id: observability-reporting-vs-frontend-api
    severity: conflict
    source: IN-009 (v2.0-final, 2026-05-25)
    description: >
      IN-009 §7 описывает Observability Reporting как полноценный C++ компонент
      между Admin UI и хранилищами PG/CH/Kafka: подписан на Kafka, читает PG/CH,
      обслуживает UI через REST/SSE. В текущем MVP эту роль исполняет
      frontend-api (Node.js в frontend/api/server.js), а cpp/observability —
      минимальный Kafka logger без PG/CH access.

      Решение требует ADR-016 для выбора одного из трёх путей:
      (a) расширить cpp/observability до full OBS service (C++ + libpqxx +
          Crow REST + SSE);
      (b) формализовать frontend-api как Observability Reporting role (Node.js
          остаётся, но переименовывается в архитектурной документации);
      (c) выделить новый cpp/observability_reporting сервис, оставив
          cpp/observability как pure Kafka logger.

      До решения ADR-016: используется путь (b) — frontend-api играет роль
      OBS-слоя, но не называется так в коде. Спецификация IN-009 фиксирует
      это явно через architecture.observabilityReporting.conflict_note.
    location: |
      docs/05-components/observability-reporting/ (current C++ service description)
      vs
      frontend/api/server.js (actual OBS implementation in MVP)
    target_pr: ADR-016 (architecture decision pending)

