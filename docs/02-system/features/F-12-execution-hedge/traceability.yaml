    expected:
      - U1-happy-path
      - U2-partial-retry
      - U3-overfill-guard
      - U4-rejection-fallback
      - U5-timeout-underfilled
      - U6-urgency-order-type
      - U7-reconciliation
      - U8-client-order-id-idempotency
      - U9-multi-venue-split
      - U10-pre-hedge-risk-rejection
    actual:
      - cpp/matching/tests/app/hedge_trigger_policy_test.cpp
      - cpp/matching/tests/app/execution_intent_builder_test.cpp
      - cpp/matching/tests/app/external_venue_filter_test.cpp
      - cpp/matching/tests/app/position_snapshot_calculator_test.cpp
      - cpp/venues/tests/execute_on_venue_test.cpp
      - cpp/venues/tests/execution_report_producer_test.cpp
      - cpp/venues/tests/venue_sim_adapter_test.cpp
      - cpp/venues/tests/simulated_venue_adapter_test.cpp
      - cpp/venues/tests/cex_ws_rest_adapter_test.cpp
      - cpp/venues/tests/dex_amm_rpc_adapter_test.cpp
  integration:
    expected:
      - IT-1-full-cycle
      - IT-2-partial-retry
      - IT-3-rejection-fallback
      - IT-4-timeout-underfilled
      - IT-5-sla-latency
      - IT-6-load-throughput
      - IT-7-backtest-parity
    actual:
      - cpp/venues/tests/backtest_parity_check_test.cpp
      - cpp/venues/tests/backtest_synthetic_scenarios_test.cpp

sequenceDiagrams:
  system:
    - docs/02-system/use-cases/UC-F12-01-auto-hedge-after-batch/sequences/SEQ-UC-F12-01-system.md
    - docs/02-system/use-cases/UC-F12-02-manual-operator-hedge/sequences/SEQ-UC-F12-02-system.md
    - docs/02-system/use-cases/UC-F12-03-partial-fill-retry/sequences/SEQ-UC-F12-03-system.md
    - docs/02-system/use-cases/UC-F12-04-rejection-fallback/sequences/SEQ-UC-F12-04-system.md
    - docs/02-system/use-cases/UC-F12-05-timeout-underfilled-reconciliation/sequences/SEQ-UC-F12-05-system.md
  service:
    - docs/05-components/sequences/SEQ-F12-01-auto-hedge-services.md
    - docs/05-components/sequences/SEQ-F12-02-rejection-fallback-services.md
    - docs/05-components/sequences/SEQ-F12-03-error-scenarios-services.md

dependentFeatures:
  - id: F-04
    role: emits-clearing-price-as-referenceMid
    note: BatchResult clearing price используется как referenceMid в ExecutionIntent
  - id: F-11
    role: provides-venue-liquidity-and-health
    note: Execution Planning подписывается на venue.liquidity.fob и venue.health
  - id: F-06
    role: consumes-execution.venue-for-position-update
    note: F-06 (Positions/PnL/Margin) обновляет позиции из ExecutionReport
  - id: F-07
    role: provides-PreHedgeCheck-extension
    note: F-07 (Pre-trade Risk) расширяется методом PreHedgeCheck для F-12-8
  - id: F-08
    role: post-trade-exposure-monitoring
  - id: F-15
    role: backtest-counterpart
    note: F-15 (Backtest/Replay) использует VenueSim для parity-проверки

