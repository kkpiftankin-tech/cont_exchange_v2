kafkaTopics:
  produces:
    - replay.results               # ReplayProgressEvent, ReplayCompletedEvent, ReplayFailedEvent, ReplayCancelledEvent
  consumes:
    - replay.commands              # CreateReplayCommand, CancelReplayCommand, RetryReplayCommand (опционально, REST альтернатива)
    - batch.outputs                # для backtest_uc parity-checks с production
    - venue.snapshots              # F-11 historical venue ingest для VenueSim (F-12 parity)

grpcServices:
  exposes: []                       # backtest принимает REST + Kafka, не выставляет gRPC
  calls:
    - fob.matching.v1.Solver/Solve             # standalone solver isolation mode (cpp/matching/src/transport/grpc_isolation_matching_service.cpp)
    - fob.risk.v1.RiskService/CheckPostTrade   # shadow post-trade проверки
    - fob.ledger.v1.LedgerService/ApplyFills   # эквивалент ledger_uc вызывается inline через cpp/ledger/src/app/ledger_uc.cpp в shadow namespace

restEndpoints:
  - POST /api/v1/replay/sessions                       # CreateReplaySession
  - GET  /api/v1/replay/sessions                       # ReadReplaySessions (filters: user_id, status, date range, page)
  - GET  /api/v1/replay/sessions/{id}                  # GetReplaySession
  - GET  /api/v1/replay/sessions/{id}/summary          # GetReplaySummary
  - GET  /api/v1/replay/sessions/{id}/agentlogs        # GetAgentLogs (paginated, filtered)
  - POST /api/v1/replay/sessions/{id}/retry            # RetryReplaySession (strict / override)
  - DELETE /api/v1/replay/sessions/{id}                # CancelReplaySession
  - GET  /api/v1/replay/compare?sessionA&sessionB      # CompareReplaySessions (A/B delta matrix)

acceptanceCriteria:
  # Полный список F15-1..F15-47 см. в acceptance-criteria.md. Здесь — ключевые
  # высокоуровневые формулировки.
  - "REST API: создание, чтение, фильтрация, отмена, retry и compare ReplaySession через /api/v1/replay/* (F15-1..F15-21)."
  - "Replay-цикл использует тот же Matching Backend (Solver), Risk Manager и Ledger что и production, но в shadow namespace (F15-5..F15-7)."
  - "AgentLog (state/action/reward + diagnostics) записывается в ClickHouse replay_agentlogs для каждого batch (F15-8)."
  - "ReplaySummary с метриками PnL, IS, VWAP, FillRate, Sharpe, MaxDD, avgSolveTime пишется в PostgreSQL replay_summaries (F15-9..F15-11, F15-26..F15-34)."
  - "Детерминизм: повторный прогон с теми же snapshot конфигов даёт идентичные AgentLog и ReplaySummary (F15-16, F15-40..F15-43)."
  - "Audit-mode: replay одного batch_id даёт diff vs production BatchResult в пределах equivalent tolerance (F15-13, F15-44..F15-47)."
  - "A/B compare: GET /api/v1/replay/compare возвращает delta-матрицу по avg_is, total_pnl, sharpe, fill_rate, max_drawdown."
  - "Cancel: DELETE сессии сохраняет partial AgentLog и переводит status в cancelled (F15-12, F15-37)."
  - "Soft failure (батч): residual_norm > tolerance — AgentLog с solver_error_flag, replay продолжается (F15-35..F15-38)."
  - "Hard failure (сессия): отсутствие исторических данных / crash — status=failed с error_details (F15-39)."
  - "Shadow isolation: production Collateral Ledger не задет операциями replay (NFR)."
  - "RBAC: проверка ролей admin/analyst/viewer на каждом endpoint; audit_log на каждое действие (F15-RBAC-*)."

nonFunctionalRequirements:
  - "Replay 1 000 батчей завершается за < 60 сек wall clock (single session)."
  - "Replay 10 000 батчей завершается за < 10 мин."
  - "Запись AgentLog в ClickHouse: latency p95 < 50 ms на батч."
  - "До 5 одновременных replay-сессий без деградации production (solve time degradation < 20%)."
  - "20 параллельных stress: solve time p95 ≤ 2× single-session."
  - "ClickHouse retention для replay_agentlogs: 90 дней (настраиваемый через BACKTEST_CLICKHOUSE_REPLAY_AGENTLOGS_RETENTION_DAYS)."
  - "Throughput записи AgentLog ≥ 200 запис/сек (F15-load-5)."

knownIssues:
  - id: lob-fob-replay-beyond-spec
    severity: feature-extension
    description: >
      cpp/backtest/src/app/lob_fob_replay_uc.{cpp,hpp} реализует quality-replay
      LOB→FOB curve reconstruction (F-11 parity). Этот use case в исходной
      спецификации IN-006 не описан — это extension feature, добавленный
      одновременно с F-15. Описан здесь для полноты.
  - id: clickhouse-init-replay-agentlogs-not-in-init-sql
    severity: doc-drift
    description: >
      Таблица replay_agentlogs создаётся динамически из
      cpp/backtest/src/infra/clickhouse_storage.cpp (EnsureSchema), а не
      статически из infra/clickhouse/init.sql. Conflict Note CN-IN006-04
      зафиксирована — источник истины DDL: clickhouse_storage.cpp.
  - id: replay-agentlogs-table-key-divergence
    severity: doc-drift
    description: >
      Источник IN-006 описывает replay_agentlogs ORDER BY (sessionid,
      batchseq) и поле batchresult/state/action как обычные String. Код
      использует ReplacingMergeTree ORDER BY (session_id, original_batch_id)
      с расширенным набором полей (log_id, fills_applied, solver_error_flag,
      risk_status, error_code, failure_component, snapshot_version). См.
      Conflict Note CN-IN006-01.
  - id: replay-sessions-extra-columns
    severity: doc-drift
    description: >
      В коде Postgres replay_sessions имеет дополнительные поля относительно
      IN-006: session_config_snapshot, retry_parent_id. См. Conflict Note
      CN-IN006-02.
  - id: replay-summaries-extra-columns
    severity: doc-drift
    description: >
      В коде Postgres replay_summaries содержит processed_batches,
      failed_batches, partial, avgis_rule, decision_price_source,
      no_requested_volume, metrics (JSONB) — это шире спецификации IN-006.
      См. Conflict Note CN-IN006-03.
  - id: web-ui-not-implemented
    severity: feature-gap
    description: >
      UI экраны (Backtest / Replay form, Results, A/B compare, Audit-mode
      diff, Equity curve) ещё не реализованы — только REST API готов.

