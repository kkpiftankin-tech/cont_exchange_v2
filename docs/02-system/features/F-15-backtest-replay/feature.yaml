feature:
  id: F-15
  name: Backtest / Replay
  status: in-progress-impl
  owner: core-team

description: >
  Backtest и shadow-replay исторических батчей через тот же solver, risk
  manager и ledger, что и production. Сервис cpp/backtest оркестрирует
  пайплайн: загружает batchresults/fills/marketdata_snapshots из ClickHouse,
  получает snapshot конфигов (solver_config, risk_limits, fee_model) из
  PostgreSQL, инициализирует shadow namespace, итеративно вызывает Matching
  Backend (SolveBatch в isolation mode), Risk Manager (CheckPostTrade) и
  Shadow Collateral Ledger (ApplyFills), пишет AgentLog в ClickHouse
  (replay_agentlogs), агрегирует ReplaySummary в PostgreSQL (replay_summaries).
  Поддерживает audit-mode (single batch + diff vs production), A/B compare,
  retry, cancel и RBAC. Используется для тестирования стратегий, тюнинга
  solver, RL training, регрессионных проверок parity (F-04, F-11, F-12) и
  пост-инцидент анализа.

primaryComponents:
  - backtest-service              # cpp/backtest — оркестратор
  - matching-fob-core             # shadow-вызов SolveBatch
  - risk-manager                  # shadow-вызов CheckPostTrade
  - settlement-ledger             # shadow namespace (in-memory изоляция)
  - market-data                   # historical batchresults/marketdata через ClickHouse

protoContracts:
  - contracts/proto/fob/replay/v1/replay.proto             # ReplaySession, Commands, Events
  - contracts/proto/fob/matching/v1/solver.proto           # SolveBatch (isolation gRPC)
  - contracts/proto/fob/matching/v1/batch.proto            # BatchResult
  - contracts/proto/fob/matching/v1/fill_event.proto       # FillEvent
  - contracts/proto/fob/orders/v1/orders.proto             # FlowOrder
  - contracts/proto/fob/risk/v1/risk.proto                 # CheckPostTrade
  - contracts/proto/fob/ledger/v1/ledger.proto             # ApplyFills (shadow)
  - contracts/proto/fob/common/v1/common.proto             # Decimal, EventMeta

openapiContracts:
  - contracts/openapi/fob/replay/v1/api/replay.yaml        # REST API for replay sessions
  - contracts/openapi/fob/replay/v1/schemas/replay.json    # DTO schemas

storageDependencies:
  postgresql:
    # F15-DATA-1 — replay session lifecycle and summaries.
    - replay_sessions               # session lifecycle (pending|running|completed|failed|cancelled)
    - replay_summaries              # aggregated metrics per session
    - replay_compare_cache          # cached A/B comparison results
    - replay_audit_runs             # single-batch audit replay + diff vs production
    # F15-RBAC — roles, permissions, audit.
    - roles                         # role definitions (admin/analyst/viewer)
    - permissions                   # permission catalog (replay:create, replay:read, ...)
    - role_permissions              # M:N role <-> permission
    - users_roles                   # user role assignments
    - audit_log                     # comprehensive audit trail of replay operations
  clickhouse:
    - replay_agentlogs              # F15-BACKTEST-6: per-batch state/action/reward log (ReplacingMergeTree, TTL 90d)
    - batchresults                  # SOURCE: historical batches (read-only)
    - fills                         # SOURCE: historical fills (read-only)
    - marketdata_snapshots          # SOURCE: historical venue snapshots / curves (F-11)
    - venue_snapshots               # SOURCE: external venue depth (F-11 parity)

