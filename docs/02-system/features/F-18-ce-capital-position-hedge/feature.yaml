feature:
  id: F-18
  name: CE Capital, Net Position & Position-Based Hedge
  status: draft            # draft | in-progress | shipped | deprecated
  owner: core-team
  level: kite              # IN-013: Feature всегда kite ☁️

# IN-013. Декомпозиция Feature вниз по Use Cases.
decomposedInto:
  - UC-F18-01            # form CE capital (seed + PnL/fees)
  - UC-F18-02            # derive CE net position from clearing Δposition
  - UC-F18-03            # hedge net position beyond per-asset threshold

parentRequirements:
  - ADR-054             # capital → net position → position-based hedge
  - ADR-049             # money-path (дополняется: net вместо per-segment gross)
  - ADR-052             # log-price clearing (anchor a=ln mid)
  - ADR-053             # safe-translator liquidity model (β_T, P_eff)

description: >
  Биржа CE (Continuous Exchange) держит собственный мультивалютный капитал
  K = {asset → amount}, сформированный из seed-конфига и пополняемый realized
  PnL/fees клиринга и хеджа. Из капитала/клиринга ведётся чистая позиция по
  каждому активу pos = {asset → net_qty}. После каждого converged батча
  вычисляется Δпозиции — проекция вектора клиринга x на активы, — которая
  накапливается в pos. Хедж на внешних площадках эмиттится по НЕТТО-позиции
  актива (|pos_a| > θ_a), а не по каждому потоку сегмента отдельно (как в
  текущем per-segment BuildHedgeIntents, ADR-049). Цель хеджа — вернуть pos_a
  к нулю (flatten). Встречные ноги неттятся и не порождают лишний хедж.

  Источник истины: ADR-054 (2026-09-08), решения владельца:
  капитал = seed + PnL/fees; база хеджа = net-позиция per-asset.

# ADR-054 §10 (2026-09-09): позиция = NOP; ledger=балансы, risk=NOP+размер хеджа,
# execution router=исполнение, frontend читает у сервисов. (Интерим-реализация в
# matching — `ce_*` — снята.)
primaryComponents:
  - ledger                # ВЛАДЕЛЕЦ балансов: house-аккаунт (капитал+venue_balances), seed, GetExchangeBalances
  - risk-manager          # считает NOP = активы−обязательства, θ/лимиты, РАЗМЕР хеджа
  - execution-planning    # router: выбор venue + split (matching execution_planner) — есть (F-12)
  - external-venues       # child orders + execution.venue — есть (F-12)
  - matching-fob-core     # источник fills/клиринга (двигают балансы ledger); НЕ владеет книгой
  - observability-reporting # frontend read-side (NOP у risk, балансы у ledger)

protoContracts:
  - contracts/proto/fob/ledger/v1/ledger.proto       # РАСШИР: GetExchangeBalances (валютный вектор house)
  - contracts/proto/fob/risk/v1/risk.proto           # РАСШИР: NOP + hedge decision (размер); PreHedgeCheck (есть)
  - contracts/proto/fob/execution/v1/execution.proto # ExecutionIntent/Report (router)
  - contracts/proto/fob/common/v1/common.proto       # Decimal, EventMeta, Instrument, Side

storageDependencies:
  postgresql:
    - accounts            # house-аккаунт '__ce_house__': валютные остатки биржи (reuse F-06)
    - ledger_positions    # legacy per-currency ledger (reuse)
    # venue_balances — сейчас in-memory; персистить таблицей ИЛИ rebuild из Kafka-replay (решение на шаге кода)
  # НЕТ новых ce_* таблиц (интерим-книга в matching снята, ADR-054 §10)

codePaths:
  # ledger — владелец балансов house-аккаунта
  - cpp/ledger/src/app/ledger_uc.cpp                  # house-аккаунт, seed, GetExchangeBalances, venue_balances
  - cpp/ledger/src/infra/postgres_repositories.cpp
  - cpp/ledger/src/transport/grpc_ledger_service.cpp  # GetExchangeBalances RPC
  # risk — NOP + размер хеджа
  - cpp/risk/src/app/risk_uc.cpp                       # ComputeNOP + hedge sizing + θ/лимиты
  # execution router (есть, F-12)
  - cpp/matching/src/app/execution_planner.cpp
  - cpp/venues/src/app/execute_on_venue.cpp
  # legacy per-segment путь (остаётся за флагом)
  - cpp/matching/src/app/vector_clearing_hedge_builder.cpp

kafkaTopics:
  produces:
    - execution.intents   # hedge intent от risk (размер по NOP) → execution router
  consumes:
    - batch.outputs       # ledger: клиентские fills двигают балансы (обязательства)
    - execution.venue     # ledger: хедж-исполнение двигает venue_balances (активы биржи)

grpcServices:
  exposes:
    - fob.ledger.v1.LedgerService.GetExchangeBalances  # валютный вектор биржи (house), для risk+UI
    - fob.risk.v1.RiskService.GetRiskSnapshot          # NOP/exposure по валюте (расширение)
  calls:
    - fob.risk.v1.RiskService.PreHedgeCheck            # pre-hedge gate (accept/reject, F-12)

# AC переписаны под ADR-054 §10 (NOP; ledger=балансы, risk=NOP+размер, router=исполнение).
acceptanceCriteria:
  - "F18-1: ledger при старте заводит house-аккаунт '__ce_house__' с валютными остатками из env CE_CAPITAL_SEED_<CCY> (idempotent — только пустой аккаунт)."
  - "F18-2: остатки house-аккаунта двигаются теми же fills/исполнениями, что ledger уже потребляет (batch.outputs двигает обязательства; execution.venue двигает venue_balances) — двойной записью; без отдельной проекции x."
  - "F18-3: venue_balances устойчивы к рестарту (персист таблицей ИЛИ rebuild из Kafka-replay); GetExchangeBalances возвращает корректный валютный вектор после рестарта."
  - "F18-4: risk вычисляет NOP_a = (капитал_a + Σ_v venue_bal_a) − Σ_u client_bal_a; при нуле клиентов NOP = собственный инвентарь (универсальность A⊇B); покрыто unit-тестом."
  - "F18-5: numeraire (CE_NUMERAIRE, default USDT) исключён из NOP (θ=∞, не хеджируется); mark_a = цена в numeraire; сбалансированная клиентская кастодия не создаёт NOP."
  - "F18-6: risk определяет размер хеджа: |NOP_a|>θ_a ⇒ qty=|NOP| (FLATTEN) / |NOP|−θ (TO_BAND), side=излишек→SELL/дефицит→BUY (CE_HEDGE_THRESHOLD_<CCY>, CE_HEDGE_MODE)."
  - "F18-7: хедж-намерение от risk идёт в execution router (matching execution_planner → venues), проходит PreHedgeCheck (accept/reject, F-12); исполнение уменьшает NOP через venue_balances."
  - "F18-8: LedgerService.GetExchangeBalances (валютный вектор house) + RiskService NOP/exposure доступны по gRPC; UI /ce-capital-live рендерит балансы (ledger) + NOP/хедж (risk)."
  - "F18-9: всё за флагом CE_NET_HEDGE_ENABLED (default off); при 0 поведение идентично до-F18 (no regression); legacy per-segment путь ADR-049 сохранён."
  - "F18-10: встречные ноги неттятся в NOP (агрегат по валюте) — противоположные потоки не порождают лишний хедж (net, не gross)."

# UX Screens — панель наблюдаемости ключевых параметров (ADR-054 §8).
uxScreens:
  - id: ce_treasury_dashboard
    title: CE Treasury / Capital & Position
    route: /ce-capital-live
    purpose: >
      Единая панель казначейства CE: per-asset таблица (balance h, target, pos,
      mark, cost_basis, unrealized_pnl, realized_pnl, θ, hedge_armed, last Δpos)
      + агрегат (Equity=Σh·mark, Σ uPnL, Σ rPnL, seed_equity) + индикатор
      сверки учётного тождества (identity_ok ✔/❗). Подсветка активов с
      hedge_armed=true. Цель — визуально доказать корректность (equity сходится,
      неттинг работает, хедж эмиттится только при |pos|>θ).
    primary_data_source: ledger (GetExchangeBalances — валютный вектор) + risk (NOP/exposure), via frontend-api
    api_endpoints:
      - GET /api/v1/ce/treasury (frontend-api агрегирует ledger-балансы + risk-NOP)
    refresh_mode: polling-3s

knownIssues:
  - id: placement-resolved-ledger-risk
    severity: resolved
    description: >
      RESOLVED ADR-054 §10 (2026-09-09): позиция = NOP; владелец балансов — ledger
      (house-аккаунт), расчёт NOP + размер хеджа — risk, исполнение — execution
      router. Интерим-реализация в matching (ce_position_projector/
      postgres_ce_treasury_repository/grpc_treasury_service + проекция x) СНЯТА
      как ошибочная (дубль балансовой книги + неверная модель «позиция =
      проекция клиринга»).
    location: cpp/ledger/ + cpp/risk/ (реализация), ADR-054 §10
  - id: quote-ref-per-asset
    severity: feature-gap
    description: >
      Net-позиция ведётся per-asset (BTC, ETH, SOL, USDT). Для хеджа нужен
      reference-инструмент a/QUOTE_ref (напр. BTC/USDT). Маппинг asset→quote_ref
      берётся из env (CE_HEDGE_QUOTE_REF_<ASSET>, default USDT). Мульти-quote
      неттинг (BTC/ETH cross) — вне scope MVP.
    location: cpp/matching/src/app/ce_net_hedge_builder.cpp

tests:
  unit:
    - cpp/matching/tests/app/ce_position_projector_test.cpp   # проекция x→Δpos, неттинг
    - cpp/matching/tests/app/ce_net_hedge_builder_test.cpp     # порог, flatten side, qty
  integration:
    - Testing/f18_ce_capital_e2e.sh    # seed → clearing → Δpos → net-hedge → PnL→capital
  contract:
    - cpp/matching/tests/transport/ce_treasury_mapper_test.cpp
