feature:
  id: F-18
  name: "CE Virtual Counterparties — Translator/Arbitrageur Agents, Signed Agent Position & Band Hedge"
  status: draft            # draft | in-progress | shipped | deprecated
  owner: core-team
  level: kite              # IN-013: Feature всегда kite ☁️

# IN-013. Декомпозиция Feature вниз по Use Cases.
# ВНИМАНИЕ: v2 (виртуальные контрагенты, знаковая позиция агента с нуля, полоса ±q)
# заменяет модель v1 (капитал → target → net-хедж). UC-F18-01..03 — SUPERSEDED (v1),
# сохранены для истории и Conflict Notes; активный поток v2 — UC-F18-04.
decomposedInto:
  - UC-F18-01            # [SUPERSEDED v1] form CE capital (seed + PnL/fees) — модель заменена house-невязкой
  - UC-F18-02            # [SUPERSEDED v1] derive CE net position (проекция x) — заменена per-agent signed c_j
  - UC-F18-03            # [SUPERSEDED v1] hedge net position beyond θ_a — заменён per-agent полосой ±q_j
  - UC-F18-04            # [v2] хедж по полосе ±q: такт клиринга агентов + эмиссия сверх полосы

parentRequirements:
  - ADR-061             # [accepted 2026-09-15] смена модели позиции CE: с нуля, знаковая, без target, house-невязка, полоса ±q, party_type AGENT (supersede ADR-057)
  - ADR-055             # revised — убрать STOCK-агентов (плечи запаса)
  - ADR-056             # revised — убрать book-узел/склад; добавить house-столбец
  - ADR-058             # revised — committed = позиция; полоса ±q вместо cooldown/target
  - ADR-081             # [proposed 2026-10-19] ширина полосы хеджа: ручной режим и автоматический по волатильности
  - ADR-082             # [proposed 2026-10-20] измерение ликвидности бирж (оборот ленты ν, коэффициент исполнения f) и обратная связь в глубину агента, размер заявки и порог хеджа; шаги 0–2 реализованы (флаги выключены), 3–4 нет; карточка CALC-VENUE-LIQUIDITY-STATS
  - ADR-079             # [proposed 2026-10-16] диагностика решения клиринга: снимок последнего такта в matching → BFF → панель «Решение клиринга» на вкладке «Граф»; карточка CALC-CE-CLEARING-DIAG

description: >
  Биржа CE (Continuous Exchange) выступает дилером через двух виртуальных контрагентов:
  ПЕРЕВОДЧИКОВ (Q_BIN, Q_KRK — маркет-мейкер, меняет на ОДНОЙ площадке актив на деньги)
  и АРБИТРАЖЁРОВ (T_BTC, T_USD — перевозят ОДИН актив между площадками, тариф+срок, без
  цены). Позиция агента c_j — накопленный по клирингу неисполненный поток: стартует с
  НУЛЯ, знаковая, может быть отрицательной. Пока |c_j| ≤ q_j (полоса), наружу не уходит
  ни одной заявки — такт меняет только внутреннюю позицию агента, а не владение биржи.
  При выходе за полосу излишек (|c_j|−q_j)·sign(c_j) эмиттится наружу и помечается in_flight
  (committed); саму c_j уменьшаем ПО ФАКТУ ИСПОЛНЕНИЯ хедж-заявки (A8), а не в момент эмиссии
  (решение владельца 2026-09-15). По таймауту неисполненный остаток снимается с in_flight
  (позиция не меняется). Прибыль/невязка оседает на СЧЁТЕ ДОМА (house) — это НЕ агент: без
  якоря/наклона/полки/полосы, заявок не порождает (переменная-невязка, восстанавливает ядро W).
  Понятия target в v2 НЕТ; committed сохраняется как поле in_flight «отправлено, не исполнено»
  (см. Conflict Note в ADR-061).

  Инвариант владения: владение биржи по каждому активу меняют РОВНО две вещи — сделка с
  клиентом и исполнение на площадке. Клиринг, накопление позиций, перевозы и таймауты
  владение НЕ меняют никогда. Z_a = владение_a(t) − владение_a(0); при отсутствии
  встречного клиентского потока Z_a ≡ 0.

  Полоса — механизм ИНТЕРНАЛИЗАЦИИ встречного клиентского потока: при q=18/30 против q=0
  издержки хеджа падают на −63% (182,73 vs 495,06 USD за 30 тактов, итог +203,18 против
  −246,03). Оговорка: без встречного клиентского потока полоса УХУДШАЕТ результат
  (гасить нечего) — это не универсальный выигрыш, а внутренняя компенсация потоков.

  Источник истины: incoming-docs/2026-09-15-CE_algorithm_v2.md (алгоритм такта A0–A8),
  сводка docs/implementation-plan/F-18-v2-agents-review-summary.md, ADR-061 (accepted 2026-09-15).

# Размещение по сервисам (проект. под ADR-061). Владелец книги позиции — ledger (§17).
primaryComponents:
  - market-data           # A0–A1: снимок обоих стаканов + кривые агентов (m, α, полка c)
  - matching-fob-core     # A2–A6: сдвиг якоря σ*=m+ρ·c, граф W + house-столбец, клиринг, c_j+=f_j
  - risk-manager          # A7: проверка полосы, sizing (walk qty), формат заявки, PreHedgeCheck
  - ledger                # владелец ce_agent_position (signed), party_type AGENT, узловые остатки
  - external-venues       # исполнение хедж/перевозочных ордеров, ExecutionReport
  - observability-reporting # ClearingTrace, панель агентов/house/Z_a (read-side)

# Контракты — planned под ADR-061; реальное изменение .proto вне scope этого doc-шага.
protoContracts:
  - contracts/proto/fob/agent/v1/agent.proto          # [planned] agent_id, agent_kind {TRANSLATOR, ARBITRAGEUR}; убрать STOCK
  - contracts/proto/fob/ledger/v1/ledger.proto        # RPC GetAgentPositions [implemented T-F18-203]; ExchangeNOP без target [planned]
  - contracts/proto/fob/risk/v1/risk.proto            # [planned] ExchangeNOP без target; Z_a=владение(t)−владение(0)
  - contracts/proto/fob/execution/v1/execution.proto  # ExecutionIntent/Report (reuse F-12 router)
  - contracts/proto/fob/common/v1/common.proto        # Decimal, EventMeta, Instrument, Side

storageDependencies:
  postgresql:
    - ce_agent_position   # [implemented T-F18-204] (agent_id, asset, venue) → position(signed), in_flight, updated_at, last_batch_id
    - accounts            # house-аккаунт '__ce_house__' (party_type HOUSE); reuse F-06
    - f05a_clearing_config # [planned +cols] ρ_Q, ρ_T, q_translator, q_arbitrageur, transfer_eta
  # НЕТ понятия target/net-позиции v1; позиция агента знаковая, ключ (agent_id, asset@venue)

codePaths:
  # market-data — A0/A1 (кривые агентов)
  - cpp/market_data/src/app/curve_to_levels.cpp
  # matching — A2..A6 (якорь σ*, граф W+house, клиринг, накопление c_j)
  - cpp/matching/src/app/vector_clearing_use_case.cpp
  - cpp/matching/src/domain/vector_qp_solver.cpp
  # ledger — владелец позиции агента (party_type AGENT)
  - cpp/ledger/src/app/ledger_uc.cpp
  # risk — A7 полоса + sizing + PreHedgeCheck
  - cpp/risk/src/app/risk_uc.cpp
  # venues — исполнение (A8 confirm)
  - cpp/venues/src/app/execute_on_venue.cpp

kafkaTopics:
  produces:
    - ce.position.delta   # matching → ledger: знаковая Δc_j агента по узлу (asset@venue)
    - execution.intents   # risk → venues: заявка сверх полосы (hedge/transfer)
  consumes:
    - marketdata.raw      # market-data: снимок стаканов (A0)
    - execution.venue     # ledger: исполнение двигает qty[asset@venue] + realized (A8 confirm)
    - batch.outputs       # ledger: клиентские fills двигают владение (точка входа №1)

grpcServices:
  exposes:
    - fob.ledger.v1.LedgerService.GetAgentPositions   # (agent_id, asset, venue) → signed position; implemented T-F18-203
    - fob.risk.v1.RiskService.GetRiskSnapshot          # позиции агентов + band state + Z_a (для UI)
  calls:
    - fob.risk.v1.RiskService.PreHedgeCheck            # pre-hedge gate перед эмиссией сверх полосы (reuse F-12)

# AC v2 — покрывают такт A0–A8, полосу ±q, house, party_type AGENT, инвариант владения,
# Z_a = владение(t) − владение(0). Источник: system-analyst (AC-F18v2-01..18).
acceptanceCriteria:
  - "AC-F18v2-01: A0 — снимок обоих стаканов на единый момент такта; площадка со снапшотом старше stale-порога исключается, такт продолжается по оставшимся узлам."
  - "AC-F18v2-02: A1 — кривая агента строится из трёх чисел: якорь m=1000·ln(mid/P0), консервативный наклон α=θ·min V/d, полка c=комиссия+½·|ln(ask/bid)|·1000 (эталон Binance: α=0,50·71,971=35,986)."
  - "AC-F18v2-03: A2 — сдвиг якоря ровно ОДНО слагаемое σ*_j=m_j+ρ_j·c_j от СОБСТВЕННОЙ позиции агента (ρ_Q=0,004 переводчик, ρ_T=0,002 маршрут); отдельного target/committed-слагаемого нет."
  - "AC-F18v2-04: A3 — матрица W: ранг V·A−1, независимых кругов (V−1)(A−1), левое ядро (1,…,1); столбец house — единственная ненулевая клетка в узле нумерария, восстанавливает ядро."
  - "AC-F18v2-05: A4 — клиринг максимизирует Σ[−σ*_j·f_j − c_j·|f_j| − f_j²/(2α_j)] при Wf=0; закрытая форма (λ*) совпадает с OSQP в пределах 1e-9 на квадратном случае (2 площадки × 2 актива)."
  - "AC-F18v2-06: A5 — такт активирует эмиссию только если |Wf|<1e-6 И закрытая форма == OSQP И объём заявки ≤95% остатка узла-источника; иначе такт FAILED, заявки не эмитятся, risk.alerts."
  - "AC-F18v2-07: A6 — накопление c_j+=f_j не порождает ни одной внешней заявки; позиция может уйти в отрицательную зону (эталонный минимум −18000 тыс.); владение узлов этим шагом не меняется (property-тест)."
  - "AC-F18v2-08: A7 — заявка эмиттится СТРОГО когда свободная часть позиции (сверх покрытого in_flight) выходит за |c_j|>q_j; размер=(|c_j|−q_j)·sign(c_j) по стоимости, переведён в qty итеративным walk по книге (2–3 итерации); в момент эмиссии c_j НЕ меняется, отправленное помечается in_flight."
  - "AC-F18v2-09: A7 — у переводчика и арбитражёра РАЗНЫЕ полосы (q_translator=18, q_arbitrageur=30, конфигурируемые per-agent-kind), не общая константа."
  - "AC-F18v2-10 (решение владельца 2026-09-15): эмитированная заявка помечена in_flight (committed); c_j уменьшается ПО ФАКТУ ИСПОЛНЕНИЯ (A8), не в момент эмиссии; in_flight не даёт отправить тот же излишек повторно (защита от двойного хеджа)."
  - "AC-F18v2-11: A8/timeout — неисполненный к дедлайну остаток снимается с in_flight (разрешая повторную отправку в следующем такте); позицию c_j таймаут НЕ меняет (она уменьшалась только по исполнению)."
  - "AC-F18v2-12 (решение владельца 2026-09-15): A8/confirm — исполнение (в т.ч. частичное) меняет qty[asset@venue] узла, realized=fq·(марка−px_факт)/1000·sgn И уменьшает позицию c_j и in_flight на fq. После ПОЛНОГО исполнения |c_j|=q_j точно."
  - "AC-F18v2-13: Инвариант владения — владение_a(t)=Σqty[a@venue]+Σin_transit[a] меняется РОВНО двумя событиями: сделка с клиентом и исполнение на площадке; клиринг/накопление/перевоз/таймаут владение не мутируют (property-тест: N тактов без клиентского потока ⇒ Z_a≡0)."
  - "AC-F18v2-13a (INV-CE-A0, уточнение владельца 2026-09-15): позицию агента c_j двигают встречные потоки клиринга — клиентский встречный поток (A0, когда клиенты есть) И/ИЛИ встречные потоки переводчиков и арбитражёров между разными внешними площадками (собственное накопление клиринга). Клиентов может не быть — тогда A0 нет, но c_j продолжают двигать межплощадочные встречные потоки агентов; неподвижно без клиентов/исполнения только владение Z (Z≡0), а не позиция c_j. Остаток STOCK c_j НЕ двигает (его нет)."
  - "AC-F18v2-14: Z_a=владение_a(t)−владение_a(0); понятия target в модели v2 нет (ExchangeNOP.target удалён — breaking, за флагом до миграции клиентов контракта)."
  - "AC-F18v2-15: Счёт дома (house) — не агент: без якоря/наклона/полки/полосы, заявок не эмиттит; остаток по нумерарию сметается в house; в стоимостных единицах баланс такта сходится ровно (double-entry)."
  - "AC-F18v2-16: party_type=AGENT — отдельный от CLIENT/HOUSE тип участника в ledger; позиция агента знаковая; резерв-чек (неотрицательность, как у CLIENT) к AGENT НЕ применяется."
  - "AC-F18v2-17: Перевоз (арбитражёр) — сущность {asset,src,dst,qty,eta,tariff,status}; приход учитывается на узле назначения при eta≤t; qty≤95% остатка узла-источника перед отправкой, иначе перевоз урезается/откладывается."
  - "AC-F18v2-18: Эффект полосы измерим — при q=18/30 число внешних заявок и издержки хеджа за фиксированный 30-тактовый прогон строго меньше, чем при q=0 (ориентир −63% издержек); НО без встречного клиентского потока полоса результат ухудшает (гасить нечего)."
  - "AC-F18v2-19 (ADR-066): динамический порог band — две независимые оси масштаба поверх плоского Z̄=c/Γ, обе за флагами, обратимы. (a) Волатильностная (D1, CE_BAND_GAMMA_MODE): выше σ ⇒ уже band (VolScaleFactor, σ из ce_asset_volatility). (b) Ликвидностная (#7 scoped, CE_BAND_LIQ_MODE, ADR-066 §D3): глубже стакан ⇒ шире band (LiqScaleFactor=(depth/depth_ref)^0.5, depth=α_e из ce_asset_liquidity, writer matching). Композиция BandTotalScale=clamp(Vol·Liq, tr_min, tr_max) с финальным клэмпом; обе off ⇒ поведение как до фичи. Решение калибровки Γ=γσ²τ — O1 (ADR-066 §Addendum), НЕ тождество эталону IN-017 A=σ√(2γ/Λ); полный O2 (реальная Λ) owner-gate. Планы: F-18-dynamic-band-gamma.tasks.md, F-18-liquidity-band.tasks.md."
  - "AC-F18v2-20 (ADR-079): диагностика решения клиринга. Вкладка «Граф» показывает НАСТОЯЩЕЕ решение последнего такта CE-клиринга (из matching, не пересчёт): потенциалы узлов, по ребру — отклонение d, полку c с составом, запас, поток, состояние; типовые циклы «актив × пара бирж через USDT» с разрывом цен G против порога Σc; отброшенные котировки с причиной; состояние ликвидности внешних бирж (опрос, возраст кривой). Объяснение «почему потока нет» формируется в BFF по снимку; решение старше 30 с объявляется устаревшим, а не «потока нет». Ограничения: хранится только последний такт, кросс-пары без треугольников. Карточка docs/04-domain/calculations/CALC-CE-CLEARING-DIAG.md, контракт docs/06-api/rest/ce-clearing-diagnostics.md."
  - "AC-F18v2-21 (ADR-081): ширина полосы хеджа настраивается оператором на экране «Клиринг»: ручной режим (Z̄lim и Z̄mkt в тыс. USDT, одинаково для всех агентов, 0,1 ≤ Z̄lim ≤ Z̄mkt ≤ 1000), автоматический по волатильности (ADR-066: пол, опорная σ, границы множителя) и от комиссии (прежний, по умолчанию). Режим живой (ledger перечитывает до 3 с), невалидные значения не применяются, изменение пишется в аудит-лог BFF (кто, было, стало). Множитель порога арбитражёров (ce_band_arb_scale, 0,1…20, по умолчанию 1) задаётся там же. Контракт docs/06-api/rest/vector-clearing-config.md, данные docs/07-data/f05a-clearing-config-band.md."
  - "AC-F18v2-22 (ADR-082, шаги 0–2): измерение ликвидности бирж. venues измеряет по каждой паре оборот ленты публичных сделок и коэффициент исполнения хедж-заявок, пишет в venue_liquidity_stats (только изменившиеся пары), панель «Ликвидность бирж» на экране «Внешние биржи» показывает их как есть (нет заявок ⇒ «—», не 100 %). Заявки в период прогрева ленты в коэффициент не входят. Глубина котировки агента умножается на множитель по коэффициенту исполнения за флагом CE_DEPTH_FILL_COEF (по умолчанию выключен): сжатие к единице по числу заявок, нормировка на лучшую биржу того же актива с нижней границей опоры CE_DEPTH_FILL_REF_MIN, нижняя граница множителя, запись старше 300 с игнорируется; применяется после фильтра тонких площадок. После перезапуска venues оценки продолжаются из сохранённых строк, а не начинаются с нуля. Шаг 2: за флагом CE_ORDER_CAP_TAPE (по умолчанию выключен) заявки агентов одной биржи и пары вместе не занимают больше доли π оборота ленты за время жизни заявки (бюджет минус живые заявки, не ниже минимума); остаток над порогом остаётся в позиции и уходит следующими заявками, перепроверяется каждый такт; жёсткий выход в зоне агрессивного сброса и при избытке не меньше 5 бюджетов; нет свежей ν ⇒ ограничения нет. Карточка docs/04-domain/calculations/CALC-VENUE-LIQUIDITY-STATS.md, данные docs/07-data/venue-liquidity-stats.md, контракт docs/06-api/rest/venue-liquidity-stats.md."
  - "AC-F18v2-23 (панель «Живые позиции»): колонки разделены на внутреннюю биржу CE (нога, было, дельта, стало) и внешнюю (отправлено, исполнено, сделки, заработок R / U). Заявка агента (отправлено/исполнено, накопленно из child_orders с дозаполнением резидентных лимитов) стоит в строке той валюты, которую торгует заявка (по BTC/USDT — в строке BTC); у арбитражёра — в строке ноги по бирже заявки. Сделки «база» и «квота» показаны одним столбцом: в строке базовой валюты — база, в строке котируемой — квота; у арбитражёра в строке ноги обе валюты её биржи. На экране объяснено, что R — реализованный заработок, а U — нереализованный результат по текущим ценам (без комиссий). По клику на агента показан график R, U и R + U во времени (окна 1 ч, 6 ч, 24 ч, 7 дн) с отдельными чекбоксами для каждого ряда: ось подгоняется под отмеченные ряды, чтобы малый R рядом с большим U не выглядел прямой: BFF раз в минуту пишет те же числа в ce_agent_pnl_history (хранение 7 дней), график читает записанное, ничего не пересчитывает; нет записей ⇒ сообщение, что история копится с момента включения записи. Данные docs/07-data/ce-agent-pnl-history.md, контракт docs/06-api/rest/agent-pnl-history.md."
  - "AC-F18v2-24 (ADR-083): остаток паритета принадлежит связке-арбитражёру, «дом» — технический счёт-невязка. Рыночный хедж ног связки отключён флагом CE_ARB_MARKET_HEDGE=0: новых внешних заявок ce|band|A_* нет, позиция в пути связок возвращается в ноль, позиции связок ограничены (не растут монотонно), клиринг цел (ошибок нет, потоки на рёбрах ненулевые), заявки переводчиков не деградируют. Следующие шаги: учёт выгод участников S_i = w²/(2α) и прибыли системы по остаткам (CALC-CE-SYSTEM-PNL), затем физический перевод связки. Обоснование docs/experiments/EXP-2026-10-22-ce-theory-conformity.md, решение docs/03-architecture/adr/ADR-083-ce-link-parity-residual-and-no-market-hedge.md."
  - "AC-F18v2-25 (ADR-083, учёт): панель «Живые позиции» показывает выгоду каждого участника в клиринге по теории S = w²/(2α), накопленную по тактам с момента сброса статистики (колонка «выгода по теории» во внутренней группе и итог по переводчикам и арбитражёрам), и ряд S на графике агента. Каждый такт учитывается один раз (по batchId снимка клиринга), хранится число учтённых и ожидаемых тактов, на экране — доля учтённых. Выгода неотрицательна у каждого участника и не складывается с R и U; у связки без внешних сделок это основной показатель. Источник — ce_agent_pnl_history (колонки surplus_inc_usdt, surplus_tacts, surplus_tacts_expected). Карточка docs/04-domain/calculations/CALC-CE-CLEARING-SURPLUS.md, данные docs/07-data/ce-agent-pnl-history.md, контракт docs/06-api/rest/agent-pnl-history.md."
  - "AC-F18v2-26 (ADR-083, учёт): блок «Система по остаткам» показывает прибыль системы по реальным остаткам биржи: изменение стоимости остатков с момента базы делится точно на торговый результат T = Σ(q−q0)·m(t) и переоценку запасов V = Σ q0·(m(t)−m0), T + V = изменение стоимости остатков. База (остатки и цены) задаётся при первом замере и при сбросе статистики сделок. Валюта с остатком без цены в итог не входит и перечисляется отдельно. Без сделок T не меняется. Ряд за окно и таблица по валютам. Карточка docs/04-domain/calculations/CALC-CE-SYSTEM-PNL.md, данные docs/07-data/ce-system-pnl.md, контракт docs/06-api/rest/system-pnl.md. Перезапуск ledger (смена boot_id) не даёт ложного торгового результата: база задаётся заново, накопленное переносится (ADR-084 п. 8)."
  - "AC-F18v2-27 (ADR-084): физический перевод связки между биржами. При CE_ARB_TRANSFER_ENABLED=1 связка не выставляет рыночных заявок; когда позиция её ноги назначения строго выше порога перевода Z̄_A = max(пол, k_band·c_tr), обе ноги сдвигаются к нулю (цель Z_targ = 0,5·Z̄_A, X = min(c_d − Z_targ, |c_s|)), перевод ставится в очередь и через CE_TRANSFER_ETA_BATCHES (3) тактов клиринга ledger двигает остатки бирж: источник −x, назначение +x·(1 − fee), x = X·1000/P_источника (вниз до 8 знаков). Сумма остатков по валюте при нулевой плате не меняется, позиции связок ограничены порогом перевода плюс приток за такт, поток по рёбрам связок не падает, ошибок нет, заявки переводчиков не деградируют. Приход в пути виден как NodeBalance.in_transit (справка). Остаток паритета r = X·1000·(1/P_s − 1/P_d) измеряется и пишется в журнал. Карточка docs/04-domain/calculations/CALC-CE-LINK-TRANSFER.md, контракт docs/06-api/grpc/ledger-apply-node-transfer.md, решение docs/03-architecture/adr/ADR-084-ce-link-physical-transfer.md."
  - "AC-F18v2-28 (ADR-085): уценка устаревших котировок и капитальный предел глубины переводчика. Оба механизма выключены по умолчанию (CE_TRUST_MODE=OFF, CE_CAPITAL_W_T_K=0), при выключенных поведение клиринга не меняется. При включении глубина котировки к номиналу равна w·f·min{θ·α_ext, W_T/(γ·ς²·τ)}: вес по возрасту w доходит до нуля плавно (порог CE_TRUST_PSI_MIN), котировка с нулевым весом исключается из клиринга с причиной «устарели» в списке отброшенных, предел идёт первым, а вес и множитель исполнения действуют поверх него; нет волатильности площадки или возраста — множитель 1 и предела нет. Раз в минуту в журнале market_data строка ADR-085 (применено, исключено, минимальный вес, под пределом, значение CE_AGE_DEAD_ZONE_K). Вход клиринга, в котором котировка ссылается на актив или площадку вне списков assets/venues, не публикуется (проверка FindInconsistentQuote, ERROR с rejected_windows_total) и не роняет matching (try/catch по std::out_of_range, сообщение отклоняется); актив без ссылок ни в одной роли пропускается, актив, на который ссылается кросс-пара, остаётся (SelectClearingAssets); тест cpp/market_data/tests/ce_input_guard_test.cpp повторяет случай инцидента 2026-10-26. Тест cpp/market_data/tests/depth_trust_scale_test.cpp на числах страницы v6, специалиста и базового документа; карточка docs/04-domain/calculations/CALC-CE-TRANSLATOR-DEPTH.md, решение docs/03-architecture/adr/ADR-085-ce-translator-depth-trust-and-capital-cap.md, аудит docs/experiments/EXP-2026-10-26-clearing-page-v6-conformity.md."

# UX Screens — панель наблюдаемости агентов v2 (заменяет ce_treasury_dashboard v1).
uxScreens:
  - id: ce_agents_dashboard
    title: CE Virtual Counterparties / Agents & Band
    route: /ce-agents-live
    purpose: >
      Панель виртуальных контрагентов: per-agent таблица (agent_id, agent_kind
      TRANSLATOR/ARBITRAGEUR, c_j signed, q_j, |c_j|/q_j как %-полоса, in_flight qty,
      статус эмиссии); строка house (house_residual, без якоря/полки/полосы);
      индикатор Z_a=владение(t)−владение(0) per asset; лог перевозов (ce_transfer)
      для арбитражёров. Подсветка агента при выходе за полосу (|c_j|>q_j) и
      in_flight-заявок, ожидающих таймаута; alert-баннер при FAILED-такте.
      Фронт только рендерит уже посчитанные c_j, q_j, Z_a, house_residual
      (памятка "Frontend no domain compute") — полосу/клиринг/якорь не пересчитывает.
    primary_data_source: risk (GetRiskSnapshot — позиции+band+Z_a) + ledger (GetAgentPositions), via frontend-api
    api_endpoints:
      - GET /api/v1/ce/agents (frontend-api агрегирует ledger-позиции + risk-band/Z_a)
    refresh_mode: polling-3s

knownIssues:
  - id: v1-v2-model-conflict
    severity: architectural
    description: >
      v2 содержательно ПРОТИВОРЕЧИТ v1 (UC-F18-01..03, ADR-054/057): модель
      «капитал → target → net-хедж» заменяется на «знаковая позиция агента с нуля,
      без target, house-невязка, полоса ±q». Per CLAUDE.md §0a (Conflict rule):
      требуется ADR-061 (supersede ADR-057; ревизии ADR-055/056/058) и Conflict Notes
      в UC-F18-01..03 ДО кода. UC-F18-01..03 помечены superseded, не удалены.
    location: docs/03-architecture/adr/ (ADR-061 planned), UC-F18-01..03
  - id: engine-consolidation-open
    severity: open-question
    description: >
      Пути клиринга не сведены: ce_agent_clearing (наш), vector_qp_solver/OSQP (F-05A),
      ContinuousClearingSolver (Engine A). Нужен отдельный ADR (кандидат ADR-062).
  - id: agent-position-persist
    severity: resolved
    description: >
      RESOLVED (Э2-шаг-2, 2026-09-16, T-F18-202/203/204/205). Позиция агента
      теперь накапливается c←c+f per (agent_id, asset, venue) в write-through
      кэше LedgerUseCases::agent_positions_ и персистится в PG ce_agent_position
      (PostgresAgentPositionRepository), переживая рестарт — устраняет разрыв
      v1, где ce_committed_ терялся при рестарте (проверено интеграционным
      тестом ledger_ce_agent_position_pg_test: новый pool+repo после
      "рестарта" читает то же накопленное значение из PG). party_type=AGENT в
      ReserveFunds — no-op (ADR-063), не резервирует, позиция знаковая без
      клампа/CHECK>=0 (проверено на отрицательной позиции). ОСТАЁТСЯ
      открытым для Э3/Э4 (T-F18-301..304, T-F18-401+): декремент c_j по факту
      исполнения (A8) и рост in_flight при эмиссии сверх полосы (A7) — сама
      эмиссия ещё не реализована, in_flight persist-колонка всегда 0.
    location: cpp/ledger/src/app/ledger_uc.{hpp,cpp}, cpp/ledger/src/infra/postgres_repositories.{hpp,cpp}

tests:
  unit:
    - cpp/matching/tests/domain/ce_agent_clearing_closed_form_vs_osqp_test.cpp  # AC-F18v2-05
    - cpp/matching/tests/domain/ce_band_emission_test.cpp                        # AC-F18v2-08/09/10
    - cpp/ledger/tests/ce_agent_position_test.cpp                                # T-F18-202/203/205 (Э2-шаг-2): AC-F18v2-07 (c<-c+f, знаковая/отрицательная позиция), AC-F18v2-16 (party_type=AGENT — ReserveFunds no-op, нет резерва/неотрицательности)
    - cpp/risk/tests/app/ownership_invariant_test.cpp                            # AC-F18v2-13/14
  integration:
    - Testing/f18v2_ce_tact_e2e.sh                 # A0..A8, без клиентского потока ⇒ Z_a≡0
    - Testing/f18v2_band_vs_no_band_30_ticks.sh    # AC-F18v2-18, эффект полосы −63%
    - cpp/ledger/tests/ce_agent_position_pg_repository_test.cpp  # T-F18-204/205: upsert+рестарт против реального PG (TEST_PG_DSN, гейт feature-gap agent-position-persist)
  contract:
    - cpp/matching/tests/transport/agent_delta_mapper_test.cpp
