kafkaTopics:
  - name: ce.position.delta
    direction: out
    producer: matching
    consumer: ledger
    message: "AgentDelta{agent_id, agent_kind, asset, venue, delta, price_used, delta_value}"   # замена AssetDelta
    partitionKey: agent_id
    status: planned               # TODO contract (ce-position-delta); заменяет AssetDelta (breaking, IT-CE-V2-08)
  - name: execution.intents
    direction: out
    producer: risk
    consumer: external-venues
    message: fob.execution.v1.ExecutionIntent
    partitionKey: intent_id
    status: existing              # reuse F-12
  - name: marketdata.raw
    direction: in
    producer: external-venues
    consumer: market-data
    status: existing              # A0 снимок стаканов
  - name: execution.venue
    direction: in
    producer: external-venues
    consumer: ledger              # A8 confirm: qty[asset@venue] + realized
    message: fob.execution.v1.ExecutionReport
    status: existing              # + legacy execution.reports (dual-publish, CLAUDE.md §7.3)
  - name: batch.outputs
    direction: in
    producer: matching
    consumer: ledger              # клиентские fills двигают владение (точка входа №1)
    status: existing
  - name: ce.transfers
    direction: out
    producer: matching            # арбитражёр
    consumer: ledger
    message: "Transfer{asset, src, dst, qty, eta, tariff, status}"
    status: planned               # Э5 (CE_TRANSFER_AGENT)

grpcServices:
