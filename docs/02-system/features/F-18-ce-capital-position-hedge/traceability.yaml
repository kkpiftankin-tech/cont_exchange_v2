featureId: F-18
featureName: "CE Virtual Counterparties — Translator/Arbitrageur Agents, Signed Agent Position & Band Hedge (v2)"
level: kite
status: draft   # ADR-061/062/063 accepted (2026-09-15); все codePath — planned (код ещё не написан)

# Бизнес-требования v2 (business-analyst, review §1). Модель v2 supersede v1 (BR v1 → target/net-хедж).
businessRequirements:
  - id: BR-F18v2-01
    text: "Виртуальные контрагенты CE — только переводчики (маркет-мейкер на одной площадке) и арбитражёры (перевоз одного актива между площадками); STOCK/плечи запаса удалены."
    acceptanceCriteria: [AC-F18v2-02, AC-F18v2-15]
  - id: BR-F18v2-02
    text: "Позиция агента c_j стартует с НУЛЯ, знаковая, может быть отрицательной; это и есть накопленный неисполненный поток (нет отдельного committed)."
    acceptanceCriteria: [AC-F18v2-07, AC-F18v2-16]
  - id: BR-F18v2-03
    text: "Интернализация встречного клиентского потока через полосу ±q: пока |c_j|≤q_j наружу не уходит ни одной заявки."
    acceptanceCriteria: [AC-F18v2-08, AC-F18v2-09, AC-F18v2-10, AC-F18v2-18]
  - id: BR-F18v2-04
    text: "Прибыль/невязка оседает на счёте дома (house) — не агент, заявок не порождает; house восстанавливает ядро W."
    acceptanceCriteria: [AC-F18v2-04, AC-F18v2-15]
  - id: BR-F18v2-05
    text: "Отказ от понятия target: ExchangeNOP.target удалён (breaking); хедж — только при выходе за полосу, не по нетто каждый такт."
    acceptanceCriteria: [AC-F18v2-14]
  - id: BR-F18v2-06
    text: "Инвариант владения: владение меняют РОВНО две вещи (клиент + исполнение); Z_a = владение_a(t) − владение_a(0); без клиентского потока Z_a≡0."
    acceptanceCriteria: [AC-F18v2-01, AC-F18v2-11, AC-F18v2-12, AC-F18v2-13]

