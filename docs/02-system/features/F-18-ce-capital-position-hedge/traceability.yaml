      ddlStatus: spec-only          # upsert с guard по last_batch_id; переживает рестарт
    - name: f05a_clearing_config
      role: tact-config             # +ρ_Q, ρ_T, q_translator, q_arbitrageur, transfer_eta (+5 колонок)
      ddlStatus: spec-only
    - name: ce_transfer
      role: arbitrageur-transfer-state-machine   # in_transit → delivered/timed_out → returned
      ddlStatus: spec-only          # Э5
    - name: accounts
      role: house-account '__ce_house__' (party_type HOUSE); CLIENT/HOUSE — generated column
      ddlStatus: reuse-F06          # AGENT — отдельная таблица (несовместимые инварианты, ADR-063)
  clickhouse:
    - name: clearing_trace
      role: tact-trace              # +agent_id, c_j до/после, house-невязка
      ddlStatus: spec-only          # ReplacingMergeTree (идемпотентность replay)

