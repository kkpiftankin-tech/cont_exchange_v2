    role: decrement-c_j-at-emission-A7
    status: planned               # idempotency по intent_id (RememberExecutionIntent)
  - service: fob.risk.v1.RiskService
    method: PreHedgeCheck
    role: pre-hedge-gate-before-band-emission
    status: reuse-F12             # CRITICAL-2: не в живом пути (OQ-F18v2-08)
  - service: fob.risk.v1.RiskService
    method: GetRiskSnapshot
    role: agent-positions + band-state + Z_a (UI)
    status: planned

