      - cpp/matching/tests/domain/w_structure_test.cpp                             # planned
      - cpp/matching/tests/domain/agent_band_test.cpp                              # planned
    status: planned                 # golden ce_tick_v2.py/square_bands.py отсутствуют (OQ-F18v2-09)
  contract:
