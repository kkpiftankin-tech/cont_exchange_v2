# UX Screens (5 шт.) из спека §2.5
uxScreens:
  - id: sim_session_manager
    title: SimSession Manager
    route: /sim/sessions
    purpose: >
      Список активных/прошедших SimSession; создание, пауза, переключение
      routingMode, завершение; статусы real-time.
    primary_data_source: PostgreSQL sim_sessions
    api_endpoints:
      - GET /api/v1/sim/sessions
      - POST /api/v1/sim/sessions
      - PATCH /api/v1/sim/sessions/{id}
      - DELETE /api/v1/sim/sessions/{id}
  - id: live_sim_feed
    title: Live Sim Feed
    route: /sim/live-feed
    purpose: >
      Real-time поток sim ExecutionReport + SimExecutionAnnotation
      (lob_age_ms, impact_bps, latency_sample_ms); фильтрация по
      simSessionId / venue / symbol.
    primary_data_source: Kafka sim.execution.venue + sim.execution.annotations (SSE) + ClickHouse sim_execution_reports fallback
    api_endpoints:
      - GET /api/v1/sim/execution-reports (history)
      - WebSocket /api/v1/sim/execution-reports/stream
  - id: sim_vs_live_comparison
    title: Sim vs Live Comparison (SHADOW)
    route: /sim/shadow-compare
    purpose: >
      Боковое сравнение SIM и LIVE исполнения по hedgeFlowId: delta fillRate,
      delta slippage, delta latency.
    primary_data_source: ClickHouse sim_divergence_log
    api_endpoints:
      - GET /api/v1/sim/divergence
  - id: lob_quality_monitor
    title: LOB Quality Monitor
    route: /sim/lob-quality
    purpose: >
      График lobAge по venue/symbol; алерты Stale LOB.
    primary_data_source: ClickHouse sim_execution_reports (агрегация lob_age_ms) + sim.alerts
    api_endpoints:
      - GET /api/v1/sim/lob-quality
  - id: model_calibration_panel
    title: Model Calibration Panel
    route: /sim/calibration
    purpose: >
      Отображение и hot-update параметров LatencyModel / ImpactModel /
      FeeModel / RejectionModel с мгновенным применением.
    primary_data_source: PostgreSQL sim_sessions (current models) + ClickHouse sim_execution_reports (calibration metrics)
    api_endpoints:
      - GET /api/v1/sim/sessions/{id}/models
      - PUT /api/v1/sim/sessions/{id}/models

uxRefreshModes:
  sim_session_manager: polling-5s
  live_sim_feed: sse-realtime
  sim_vs_live_comparison: polling-10s
  lob_quality_monitor: polling-5s
  model_calibration_panel: on-demand

# Models (§1.0 LatencyModel / ImpactModel / RejectionModel / FeeModel)
models:
  latency:
    distributions: [LOGNORMAL, UNIFORM, FIXED, EMPIRICAL]
    parameters: [p50Ms, p95Ms, p99Ms, tailProbability, timeoutMs]
    behavior: |
      Sample latencySampleMs per child-order from chosen distribution.
      Async-delay publication of SimExecutionReport by that amount. If
      latencySampleMs > timeoutMs -> emit REJECTED with rejectReason=SIM_TIMEOUT.
  impact:
    model_types: [LINEAR, SQRT, POWER_LAW, LEVEL_BY_LEVEL]
    parameters: [impactCoeff, powerExponent, depletionMode, depletionDecayMs]
    formulas:
      LINEAR: "deltaPrice = impactCoeff * filledQty"
      SQRT: "deltaPrice = impactCoeff * sqrt(filledQty)"
      POWER_LAW: "deltaPrice = impactCoeff * filledQty ^ powerExponent"
      LEVEL_BY_LEVEL: "VWAP по фактически поглощённым уровням LOB"
    derived:
      impactBps: "(|avgPriceImpact - mid| / mid) * 10000"
  rejection:
    flags:
      insufficientLiquidityEnabled: bool
      priceConstraintEnabled: bool
    probabilities:
      randomRejectionRate: "[0.0, 1.0]"
      rateLimitRejectRate: "[0.0, 1.0]"
    thresholds:
      minLiquidityThreshold: decimal
    reject_codes:
      - SIM_NO_LIQUIDITY
      - SIM_RANDOM_REJECT
      - SIM_RATE_LIMIT
      - SIM_PRICE_CONSTRAINT
      - SIM_STALE_LOB
      - SIM_TIMEOUT
  fee:
    fields: [makerBps, takerBps, minFee, gasFlat]
    behavior: |
      fee = filledQty * avgPriceImpact * feeRate (taker если orderType=MARKET/IOC,
      maker если LIMIT/POST_ONLY и не пересёк mid). DEX: fee = gasFlat
      (в FeeModel.gasFlat) + AMM swap fee bps.

# FID chain (§4.3) — карта взаимодействий компонентов F-20
fidChain:
  - id: F20-SIM-1
    source: Kafka venue.snapshots
    sink: VenueSimulator
    protocol: Kafka consume
    payload: VenueSnapshot
  - id: F20-SIM-2
    source: Venue Execution Adapter
    sink: VenueSimRouter
    protocol: in-process / gRPC
    payload: ChildOrderRequest
  - id: F20-SIM-3
    source: VenueSimRouter
    sink: VenueSimulator
    protocol: in-process
    payload: ChildOrderRequest + simSessionId
  - id: F20-SIM-4
    source: VenueSimRouter
    sink: External Venues Connector
    protocol: gRPC (LIVE / SHADOW fork)
    payload: PlaceChildOrder
  - id: F20-SIM-5
    source: VenueSimulator
    sink: Kafka sim.execution.venue
    protocol: Kafka produce
    payload: ExecutionReport (unchanged contract; ADR-015 — NOT execution.venue)
  - id: F20-SIM-6
    source: VenueSimulator
    sink: Kafka sim.execution.annotations
    protocol: Kafka produce
    payload: SimExecutionAnnotation (telemetry sidecar, corr. by report_id)
  - id: F20-SIM-7
    source: VenueSimulator
    sink: Kafka sim.alerts
    protocol: Kafka produce
    payload: SimAlert
  - id: F20-SIM-8
    source: Admin UI / API
    sink: SimSession Manager
    protocol: REST
    payload: SimSession CRUD
  - id: F20-SIM-9
    source: SimSession Manager
    sink: PostgreSQL
    protocol: SQL
    payload: sim_sessions CRUD
  - id: F20-SIM-10
    source: SimSession Manager
    sink: Kafka sim.config
    protocol: Kafka produce
    payload: SimConfigEvent
  - id: F20-SIM-11
    source: Kafka sim.config
    sink: VenueSimRouter
    protocol: Kafka consume
    payload: SimConfigEvent (hot reload)
  - id: F20-SIM-12
    source: Kafka execution.venue (LIVE) + sim.execution.venue (SIM)
    sink: Divergence Service
    protocol: Kafka consume (two topics)
    payload: ExecutionReport pair, joined by clientOrderId
  - id: F20-SIM-13
    source: Divergence Service
    sink: ClickHouse
    protocol: HTTP insert
    payload: sim_divergence_log
  - id: F20-SIM-14
    source: Kafka sim.execution.venue + sim.execution.annotations
    sink: ClickHouse
    protocol: market_data writer / CH ingest
    payload: sim_execution_reports (ExecutionReport fields + annotation columns)
  - id: F20-SIM-15
    source: Kafka sim.execution.venue
    sink: Settlement Ledger (sim-book consumer)
    protocol: Kafka consume
    payload: ExecutionReport (sim-book branch -> sim_positions/sim_hedge_pnl)

# SLO targets (§3.1 + §5.3)
slo:
  latencyBudget:
    f20_overhead:        # без LatencyModel sample
      p50: 6 ms
      p95: 21 ms          # SLO < 50 ms; реальный bench при первой реализации
      p99: 42 ms          # SLO < 100 ms
    venue_snapshot_to_cache:
      p50: 15 ms
      p95: 50 ms
      p99: 80 ms
    venue_sim_router_routing:
      p95: 2 ms
      p99: 5 ms
    lob_matching_plus_impact:
      p95: 8 ms
      p99: 15 ms
    kafka_publish_sim_report:
      p95: 10 ms
      p99: 20 ms
  throughput:
    sim_only: 500 orders_per_sec
  freshness:
    lob_cache_lag_p95: 100 ms
    clickhouse_ingest_p95: 1 sec
    sim_alerts_stale_lob: 200 ms
    sim_to_live_switch: 500 ms

# Load tests (§5.2)
loadTests:
  - id: LT-1
    scenario: "500 child-ордеров/сек, SIM_ONLY, 5 мин"
    pass: "p95 latency < 50 мс, нет ошибок Kafka publish"
  - id: LT-2
    scenario: "200 child-ордеров/сек, SHADOW, 5 мин"
    pass: "оба отчёта доставлены; LIVE delta overhead p95 < 10 мс"
  - id: LT-3
    scenario: "LOB freeze на 5 сек"
    pass: "все ордера получают SIM_STALE_LOB в <= 200 мс"
  - id: LT-4
    scenario: "hot reload при нагрузке 300/сек"
    pass: "применение <= 500 мс; нет потери ордеров"

# Известные ограничения / open questions
knownIssues:
  - id: feature-id-rename-f16-to-f20
    severity: rename
    status: documented
    description: >
      Спека-источник внутри текста использует "F-16"; в этом репозитории
      F-16 закреплён за "Operator Console & Kill-Switch". Имя файла
      исходника ("F-20 -Live-Venue-Simulator.md") — авторитетный ID.
      Все "F16-*" метки в derived artefacts переименованы в F20-*.
    location: docs/02-system/features/feature-index.md
  - id: sim-execution-topic-isolation-pending-adr
    severity: design-choice
    status: resolved
    description: >
      RESOLVED by ADR-015 (2026-05-28). Решение: СТРОГАЯ изоляция —
      SimExecutionReport публикуется ТОЛЬКО в sim.execution.venue,
      никогда в общий execution.venue. Спековый вариант «execution.venue
      + simMode=true» отклонён из-за SHADOW double-apply риска (LIVE+SIM
      с одним clientOrderId, идемпотентность ledger по report_id
      пропустит оба → боевой ledger применит sim к реальной позиции).
      Boevые consumers не меняются и физически не видят sim-данные.
    location: docs/03-architecture/adr/ADR-015-sim-execution-topic-isolation.md
    resolved_in: ADR-015
  - id: ledger-sim-book-isolation
    severity: feature-gap
    status: resolved
    description: >
      RESOLVED by ADR-016 (2026-05-28). Решение: ОТДЕЛЬНЫЕ таблицы
      sim_positions / sim_hedge_pnl (+ sim_balances в v1.1), НЕ
      simMode-флаг в существующих positions/balances/hedgeflows.
      Причина: финансовая безопасность — флаг требует WHERE sim_mode=false
      в каждом боевом запросе (margin/liquidation/withdrawal), один
      забытый фильтр = боевое решение на sim-данных. Отдельные таблицы
      делают это невозможным by construction. Sim-book consumer читает
      sim.execution.venue (ADR-015) и пишет только в sim_* таблицы.
    location: docs/03-architecture/adr/ADR-016-ledger-sim-book-storage.md
    resolved_in: ADR-016
  - id: existing-venue-sim-adapter-relationship
    severity: scope-clarification
    status: resolved
    description: >
      RESOLVED by ADR-017 (2026-05-28). Решение: НОВЫЙ класс
      VenueSimulator (cpp/venues/src/app/venue_simulator.*), legacy
      venue_sim_adapter / simulated_venue_adapter остаются как есть
      (backtest/F-04 helper). Причина: разные абстракции — legacy это
      VenueAdapter (точка интеграции одной биржи), VenueSimulator это
      stateful LOB-matcher с моделями на слое VenueSimRouter. Общие
      math-утилиты (VWAP, impact-формулы) могут выделиться в общий
      header позже как emergent refactor, не предусловие.
    location: docs/03-architecture/adr/ADR-017-venue-simulator-vs-legacy-adapter.md
    resolved_in: ADR-017
  - id: hft-effects-out-of-scope
    severity: dev-limitation
    status: documented
    description: >
      VenueSimulator не воспроизводит HFT-уровень (front-running,
      microsecond latency arbitrage, queue position). LOB-depletion mode
      корректен только при серийных ордерах по одному инструменту.
    location: spec §1.4 constraints
  - id: simexecutionreport-not-legally-binding
    severity: dev-limitation
    status: documented
    description: >
      SimExecutionReport не является юридически значимым исполнением
      и не влияет на реальный P&L провайдера. Изоляция должна быть
      строгой на всех downstream (Ledger sim-book, Risk sim-window,
      CH sim_* таблицы).
    location: spec §1.4 constraints
