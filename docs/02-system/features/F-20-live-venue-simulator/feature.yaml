kafkaTopics:
  produces:
    - execution.venue          # SimExecutionReport (simMode=true) — тот же топик, что и LIVE; consumer ignore-by-flag
    - sim.execution.venue      # NEW (optional): изолированный mirror только sim reports
    - sim.alerts               # NEW: STALE_LOB, SIM_TIMEOUT, LOB_SOURCE_DOWN, RANDOM_REJECT_SPIKE
    - sim.config               # NEW: SimConfigEvent при создании/обновлении/удалении SimSession (для hot reload)
  consumes:
    - venue.snapshots          # из F-11: живой LOB (BookDepth) для VenueSimulator
    - venue.health             # из F-11: влияет на параметры RejectionModel
    - execution.intents        # внутренний consumer VenueSimRouter (источник ChildOrderRequest)
    - sim.config               # внутренний consumer VenueSimRouter (hot reload routingMode/scope)
    - execution.venue          # Divergence Service consumer (pairing SIM + LIVE по clientOrderId)

grpcServices:
  exposes:
    - fob.sim.v1.SimSessionManager.CreateSession      # planned REST + gRPC duals
    - fob.sim.v1.SimSessionManager.GetSession         # planned
    - fob.sim.v1.SimSessionManager.UpdateSession      # planned (routingMode switch, hot reload models)
    - fob.sim.v1.SimSessionManager.ListSessions       # planned
    - fob.sim.v1.SimSessionManager.CompleteSession    # planned
  calls:
    - fob.marketdata.v1.MarketDataService.GetSnapshot # на reference snapshot для validation (optional)

acceptanceCriteria:
  # Источник: спека §2.6 (12 пунктов). Renumbered F16-* -> F20-* per Conflict Note.
  - "F20-1: При routingMode=SIM_ONLY ни один реальный вызов к EVC для child-ордеров не производится; все ExecutionReport имеют simMode=true."
  - "F20-2: При routingMode=SHADOW каждый ChildOrderRequest порождает ровно два ExecutionReport: simMode=false (LIVE) и simMode=true (SIM)."
  - "F20-3: VenueSimulator использует актуальный VenueSnapshot из venue.snapshots; lobSnapshotId ссылается на конкретный снапшот."
  - "F20-4: При lobAge > staleLobThresholdMs SimExecutionReport содержит status=REJECTED, rejectReason=SIM_STALE_LOB; реальных ордеров на биржу не уходит."
  - "F20-5: SimExecutionReport с simMode=true НЕ изменяет реальные позиции провайдера в Ledger (обновляется изолированная sim-книга)."
  - "F20-6: Все SimExecutionReport сохраняются в ClickHouse в течение <= 1 сек после публикации."
  - "F20-7: Переключение routingMode через Admin API применяется в течение <= 500 мс."
  - "F20-8: При идентичном LOB расчёт filledQty совпадает с ожидаемым LEVEL_BY_LEVEL с точностью <= 1%."
  - "F20-9: Latency overhead F-20 (без LatencyModel sample): p95 < 50 мс."
  - "F20-10: Divergence-метрики (SHADOW) корректно записываются в sim_divergence_log по каждому clientOrderId."
  - "F20-11: Hot update параметров (LatencyModel/ImpactModel/...) через Admin API применяется к следующим запросам без перезапуска VenueSimulator."
  - "F20-12: В режиме LIVE_ONLY overhead роутера <= 5 мс."

