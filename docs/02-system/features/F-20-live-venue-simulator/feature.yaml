feature:
  id: F-20
  name: Live Venue Simulator
  status: draft           # documentation only; no implementation yet
  owner: core-team

description: >
  Гибридный режим работы системы: приём живых LOB-снапшотов от внешних
  CEX/DEX/AMM через инфраструктуру F-11 продолжается без изменений, но
  child-ордера, эмитированные Venue Execution Adapter (F-12), маршрутизируются
  через VenueSimRouter в один из трёх режимов: SIM_ONLY (только симуляция),
  LIVE_ONLY (только реальное исполнение, как сейчас), SHADOW (dual-send для
  сравнения). В SIM_ONLY VenueSimulator использует актуальный VenueSnapshot
  как источник ликвидности, применяет модели latency / market impact /
  fees / rejection и публикует обычный ExecutionReport (тот же контракт,
  что и реальный venue) в изолированный топик sim.execution.venue.
  Sim-телеметрия (sim_session_id, lob_snapshot_id, lob_age_ms, impact_bps,
  latency_sample_ms) едет отдельным сайдкаром SimExecutionAnnotation —
  ExecutionReport НЕ расширяется sim-полями. Дискриминатор sim/live —
  топик, не поле (ADR-015).

  Источник истины: IN-010 (`incoming-docs/2026-05-26-F-20-live-venue-simulator-v1.md`).

  Conflict Note (feature-id rename): исходная спецификация внутри текста
  использует ID "F-16", но в этом репозитории F-16 закреплён за
  "Operator Console & Kill-Switch". Имя файла спецификации
  ("F-20 -Live-Venue-Simulator.md") является авторитетным — фича
  регистрируется как F-20. Все "F16-*" метки из тела спека механически
  переименованы в "F20-*" в ходе ингеста (см. IN-010.meta.md и
  IN-010.fragment-map.md).

primaryComponents:
  - venue-simulator        # F-20: новый — LOB matcher + LatencyModel + ImpactModel + FeeModel + RejectionModel
  - venue-sim-router       # F-20: новый — switchboard SIM/LIVE/SHADOW per venueId+symbol
  - sim-session-manager    # F-20: новый — CRUD sim_sessions, hot reload через sim.config
  - divergence-service     # F-20: новый — pairing SIM vs LIVE в SHADOW режиме
  - external-venues        # F-11: продолжает поставлять venue.snapshots; НЕ модифицируется
  - venue-execution-adapter # F-12: источник ChildOrderRequest; НЕ модифицируется
  - ledger                 # F-12: новый sim-book consumer на sim.execution.venue → sim_positions/sim_hedge_pnl (ADR-016)
  - risk-manager           # F-12: может потреблять sim.execution.venue для analytics
  - observability-reporting # F-12: новые dashboards Sim Monitor / Sim vs Live / LOB Quality

protoContracts:
  # F-20 переиспользует протокол F-12 БЕЗ изменений: симулятор эмитит
  # тот же ExecutionReport, что и реальный venue (ADR-015).
  - contracts/proto/fob/execution/v1/execution.proto       # consumed/produced AS-IS — НЕ расширяется sim-полями (ADR-015)
  - contracts/proto/fob/venue/v1/venue.proto               # consumed: VenueSnapshot (источник LOB)
  - contracts/proto/fob/common/v1/common.proto             # Decimal, Money, EventMeta
  # Новый proto для F-20:
  - contracts/proto/fob/sim/v1/sim.proto                   # CREATED (PR-F20-3): SimSession, SimConfigEvent, SimAlert, SimExecutionAnnotation, RoutingMode + 5 enums, 4 models, SimSessionManager service. protoc cpp+grpc verified.
  - contracts/openapi/fob/sim/v1/api/sim.yaml              # NEW (planned): REST API SimSession Manager (operator UI)

storageDependencies:
  postgresql:
    - sim_sessions       # CREATED PR-F20-4: SimSession config — routingMode, scope, models JSONB, status
    - sim_positions      # CREATED PR-F20-4 (ADR-016): isolated sim-book positions (sim-book ledger consumer)
    - sim_hedge_pnl      # CREATED PR-F20-4 (ADR-016): isolated sim-book hedge_pnl/fee aggregate
  clickhouse:
    - sim_execution_reports  # CREATED PR-F20-4: ExecutionReport columns + SimExecutionAnnotation sidecar columns; no sim_mode col (topic = discriminator)
    - sim_divergence_log     # CREATED PR-F20-4: per-clientOrderId delta LIVE vs SIM в SHADOW режиме

codePaths:
  # Все пути ниже — planned (NEW). На момент создания этого feature.yaml
  # ни один файл не существует. См. implementation-plan/F-20-live-venue-simulator.tasks.md.
  - cpp/venues/src/app/venue_simulator.cpp                 # planned
  - cpp/venues/src/app/venue_simulator.hpp                 # planned
  - cpp/venues/src/app/venue_sim_router.cpp                # planned
  - cpp/venues/src/app/venue_sim_router.hpp                # planned
  - cpp/venues/src/app/sim_session_manager.cpp             # planned
  - cpp/venues/src/app/sim_session_manager.hpp             # planned
  - cpp/venues/src/app/divergence_service.cpp              # planned
  - cpp/venues/src/app/divergence_service.hpp              # planned
  - cpp/venues/src/domain/models/latency_model.hpp         # planned
  - cpp/venues/src/domain/models/impact_model.hpp          # planned
  - cpp/venues/src/domain/models/fee_model.hpp             # planned
  - cpp/venues/src/domain/models/rejection_model.hpp       # planned
  - cpp/venues/src/infra/postgres_sim_session_repository.cpp # planned
  - cpp/venues/src/infra/sim_config_consumer.cpp           # planned (Kafka sim.config consumer)

kafkaTopics:
  produces:
    # ADR-015: sim ExecutionReport идёт ТОЛЬКО сюда, НЕ в общий execution.venue.
    - sim.execution.venue      # NEW: обычный ExecutionReport (unchanged contract), изолированный sim-поток
    - sim.execution.annotations # NEW: SimExecutionAnnotation (sim telemetry sidecar, corr. by report_id)
    - sim.alerts               # NEW: STALE_LOB, SIM_TIMEOUT, LOB_SOURCE_DOWN, RANDOM_REJECT_SPIKE
    - sim.config               # NEW: SimConfigEvent при создании/обновлении/удалении SimSession (для hot reload)
  consumes:
    - venue.snapshots          # из F-11: живой LOB (BookDepth) для VenueSimulator
    - venue.health             # из F-11: влияет на параметры RejectionModel
    - execution.intents        # внутренний consumer VenueSimRouter (источник ChildOrderRequest)
    - sim.config               # внутренний consumer VenueSimRouter (hot reload routingMode/scope)
    - execution.venue          # Divergence Service: LIVE-сторона (SHADOW pairing по clientOrderId)
    - sim.execution.venue      # Divergence Service: SIM-сторона + sim-book ledger consumer (ADR-015/016)

grpcServices:
  exposes:
    - fob.sim.v1.SimSessionManager.CreateSession      # planned REST + gRPC duals
    - fob.sim.v1.SimSessionManager.GetSession         # planned
    - fob.sim.v1.SimSessionManager.UpdateSession      # planned (routingMode switch, hot reload models)
    - fob.sim.v1.SimSessionManager.ListSessions       # planned
    - fob.sim.v1.SimSessionManager.CompleteSession    # planned
  calls:
    - fob.marketdata.v1.MarketDataService.GetSnapshot # на reference snapshot для validation (optional)

acceptanceCriteria:
  # Источник: спека §2.6 (12 пунктов). Renumbered F16-* -> F20-* per Conflict Note.
  - "F20-1: При routingMode=SIM_ONLY ни один реальный вызов к EVC для child-ордеров не производится; все ExecutionReport идут в топик sim.execution.venue (не execution.venue)."
  - "F20-2: При routingMode=SHADOW каждый ChildOrderRequest порождает ровно два ExecutionReport: один в execution.venue (LIVE), один в sim.execution.venue (SIM), коррелированы по clientOrderId."
  - "F20-3: VenueSimulator использует актуальный VenueSnapshot из venue.snapshots; SimExecutionAnnotation.lob_snapshot_id ссылается на конкретный снапшот."
  - "F20-4: При lobAge > staleLobThresholdMs ExecutionReport содержит status=REJECTED, rejectReason=SIM_STALE_LOB; реальных ордеров на биржу не уходит."
  - "F20-5: ExecutionReport из sim.execution.venue НЕ изменяет реальные позиции провайдера в Ledger (обновляется изолированная sim-книга sim_positions)."
  - "F20-6: Все sim ExecutionReport + SimExecutionAnnotation сохраняются в ClickHouse sim_execution_reports в течение <= 1 сек после публикации."
  - "F20-7: Переключение routingMode через Admin API применяется в течение <= 500 мс."
  - "F20-8: При идентичном LOB расчёт filledQty совпадает с ожидаемым LEVEL_BY_LEVEL с точностью <= 1%."
  - "F20-9: Latency overhead F-20 (без LatencyModel sample): p95 < 50 мс."
  - "F20-10: Divergence-метрики (SHADOW) корректно записываются в sim_divergence_log по каждому clientOrderId."
  - "F20-11: Hot update параметров (LatencyModel/ImpactModel/...) через Admin API применяется к следующим запросам без перезапуска VenueSimulator."
  - "F20-12: В режиме LIVE_ONLY overhead роутера <= 5 мс."

# 19-item DoD из спека §6. Все пункты пока not-implemented; первый PR-F20-* будет ингестировать sub-set.
definitionOfDone:
  - id: DoD-1
    status: partial
    title: VenueSimulator реализован
    description: >
      Подписан на Kafka venue.snapshots, поддерживает актуальный LOB-кэш по
      (venueId, symbol), реализует LEVEL_BY_LEVEL matching, ImpactModel
      (LINEAR / SQRT / POWER_LAW), FeeModel, RejectionModel, LatencyModel с
      async-delay.

      PR-F20-5 (2026-05-28): ЯДРО реализовано — pure engine
      cpp/venues/src/app/venue_simulator.{hpp,cpp} `Simulate(request,
      models) -> SimulateResult`. Покрывает LEVEL_BY_LEVEL matching (VWAP
      по уровням book), ImpactModel (LINEAR/SQRT/POWER_LAW/LEVEL_BY_LEVEL),
      FeeModel (maker/taker/min/gas), RejectionModel (stale/no-liq/
      random/rate-limit/price-constraint), LatencyModel (FIXED/UNIFORM/
      LOGNORMAL sampling + timeout→SIM_TIMEOUT). Детерминирован по
      rng_seed. Математика в double (CLAUDE.md §9 — симуляция, sim-book
      non-authoritative).

      Остаётся (Phase 4 wiring, НЕ в этом ядре): Kafka venue.snapshots
      consumer + LOB-кэш по (venue,symbol), async-delay реальная задержка
      перед publish (сейчас latency только СЭМПЛИТСЯ в результат). Это
      T-F20-301 runtime часть + VenueSimRouter (DoD-2).
    evidence: |
      cpp/venues/src/app/venue_simulator.{hpp,cpp},
      cpp/venues/tests/venue_simulator_test.cpp (12 cases ALL PASS,
      built+run on ubuntu-dev exit 0).
    blocked_by_ac: [F20-3, F20-8]
  - id: DoD-2
    status: partial
    title: VenueSimRouter реализован
    description: >
      Маршрутизирует ChildOrderRequest в SIM_ONLY / LIVE_ONLY / SHADOW;
      поддерживает hot reload конфигурации из Kafka sim.config без перезапуска.

      PR-F20-6 (2026-05-28): ЯДРО решения реализовано — pure routing
      decision cpp/venues/src/app/venue_sim_router.{hpp,cpp}
      `Decide(venue, symbol) -> RouteDecision` (SIM_ONLY/LIVE_ONLY/SHADOW),
      по умолчанию LIVE_ONLY когда активная сессия не покрывает
      (venue,instrument) — симулятор строго opt-in. + SimSessionRegistry
      cpp/venues/src/app/sim_session_registry.{hpp,cpp}: thread-safe
      in-memory store live SimSession, Resolve со scope-match (пустой
      scope = wildcard), ACTIVE-фильтром и детерминированным tie-break
      (activated_at desc, затем sim_session_id). RouteDecision несёт
      SimModels + staleLobThreshold + partialFillMode для VenueSimulator.

      Остаётся (следующий wiring PR): hot reload из Kafka sim.config
      consumer (сейчас registry наполняется только программно — будущий
      consumer/gRPC SimSessionManager), execution fork (вызов
      VenueSimulator, async-delay, publish в sim.execution.venue +
      SimExecutionAnnotation), SimAlert эмиссия.
    evidence: |
      cpp/venues/src/app/venue_sim_router.{hpp,cpp},
      cpp/venues/src/app/sim_session_registry.{hpp,cpp},
      cpp/venues/tests/venue_sim_router_test.cpp (12 cases ALL PASS,
      built+run on ubuntu-dev exit 0).
    blocked_by_ac: [F20-1, F20-2, F20-7, F20-11, F20-12]
  - id: DoD-3
    status: not-implemented
    title: SimSession Manager реализован
    description: >
      CRUD SimSession через Admin API; persistence в PostgreSQL sim_sessions;
      публикация изменений в Kafka sim.config.
    evidence: cpp/venues/src/app/sim_session_manager.{cpp,hpp} (отсутствует)
  - id: DoD-4
    status: implemented
    title: Алгоритм LOB-matching корректен
    description: >
      Расчёт filledQty, avgPrice, impactBps соответствует спеке TRD §4.4;
      при идентичном LOB ошибка объёма <= 1%.
      PR-F20-5: verified unit-тестами venue_simulator_test U1/U2/U4/U10 —
      VWAP precision (BUY 2.0 → 1.0@101+1.0@102 → 101.5 exact),
      impact_bps vs mid (~150bps), partial fill (6 of 10), no-overfill
      (filled == target exactly), sell-side hits bids.
    evidence: cpp/venues/tests/venue_simulator_test.cpp (U1,U2,U4,U10,sell — ALL PASS)
    blocked_by_ac: [F20-8]
  - id: DoD-5
    status: partial
    title: Stale-LOB защита
    description: >
      При lobAge > staleLobThresholdMs VenueSimulator возвращает
      REJECTED, SIM_STALE_LOB; алерт в sim.alerts; реальных ордеров на биржу
      не уходит.
      PR-F20-5: engine-часть реализована + verified (U3: lobAge 5000 >
      threshold 2000 → REJECTED/SIM_STALE_LOB, никакого fill). Остаётся:
      эмиссия SimAlert в sim.alerts — это runtime/wiring часть (Phase 4,
      когда VenueSimulator подключён к Kafka producer).
    evidence: cpp/venues/tests/venue_simulator_test.cpp (U3_stale — PASS); SimAlert emit pending Phase 4
    blocked_by_ac: [F20-4]
  - id: DoD-6
    status: not-implemented
    title: ExecutionReport (unchanged) в sim.execution.venue + SimExecutionAnnotation sidecar
    description: >
      ADR-015: VenueSimulator публикует ОБЫЧНЫЙ ExecutionReport (тот же
      контракт F-12, заполняет filled_qty/average_price/slippage_bps/
      hedge_pnl/reference_mid/fee_total) в изолированный топик
      sim.execution.venue — НЕ в общий execution.venue, без поля simMode.
      Sim-телеметрия (sim_session_id, lob_snapshot_id, lob_age_ms,
      impact_bps, latency_sample_ms) едет отдельным
      fob.sim.v1.SimExecutionAnnotation, коррелированным по report_id,
      в sim.execution.annotations.
    evidence: contracts/proto/fob/sim/v1/sim.proto SimExecutionAnnotation (planned, T-F20-101); execution.proto НЕ трогается
  - id: DoD-7
    status: not-implemented
    title: Settlement Ledger sim-book consumer на sim.execution.venue
    description: >
      ADR-016: новый sim-book consumer подписан на sim.execution.venue
      (всё на этом топике — sim по определению, ADR-015), обновляет
      изолированные таблицы sim_positions / sim_hedge_pnl, НЕ изменяет
      реальные positions/balances/hedgeflows. Никакого simMode-флага в
      боевых таблицах.
    evidence: cpp/ledger/src/app/ (новый sim-book consumer, planned T-F20-501)
    blocked_by_ac: [F20-5]
  - id: DoD-8
    status: partial
    title: ClickHouse приём SimExecutionReport
    description: >
      Таблица sim_execution_reports в init.sql + market_data writer; <= 1 сек
      latency от публикации до записи.
      PR-F20-4 (2026-05-28): SCHEMA готова — sim_execution_reports +
      sim_divergence_log созданы в infra/clickhouse/init.sql, применены и
      проверены на live CH (DESCRIBE ok). Колонки = ExecutionReport +
      SimExecutionAnnotation sidecar; sim_mode-колонки нет (топик —
      дискриминатор, ADR-015). Остаётся WRITER: cpp/market_data (или
      sim CH ingest) должен читать sim.execution.venue +
      sim.execution.annotations и писать строки (T-F20-502).
    evidence: infra/clickhouse/init.sql (sim_execution_reports + sim_divergence_log — applied+verified); writer pending T-F20-502
    blocked_by_ac: [F20-6]
  - id: DoD-9
    status: not-implemented
    title: Divergence Service (SHADOW режим)
    description: >
      Pairing LIVE и SIM ExecutionReport по clientOrderId; вычисление delta
      метрик; запись в sim_divergence_log.
    evidence: cpp/venues/src/app/divergence_service.{cpp,hpp} (отсутствует)
    blocked_by_ac: [F20-10]
  - id: DoD-10
    status: not-implemented
    title: Unit-тесты VenueSimulator U1..U10
    description: >
      Happy-path FILLED, partial fill, stale LOB, LEVEL_BY_LEVEL precision,
