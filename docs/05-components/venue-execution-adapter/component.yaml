component:
  id: venue-execution-adapter
  name: Venue Execution Adapter
  layer: edge
  status: partial-hosted-inside-venues
  codePath: cpp/venues/src
  owner: core-team

responsibility:
  summary: >
    Адаптер state machine хеджирования: создаёт HedgeFlow в PostgreSQL,
    для каждого venue в routing plan создаёт child_order, вызывает
    External Venues Connector (CexWsRest, DexAmmRpc, VenueSim), нормализует
    raw execution events в ExecutionReport, публикует в Kafka execution.venue.
    Также управляет timeout watchdog, overfill guard, reconciliation
    и idempotency по client_order_id.

  conflictNote: >
    В коде нет отдельного бинарника `cpp/venue_execution_adapter/`. Логика
    физически живёт в `cpp/venues/src/app/execute_on_venue.cpp` +
    `cpp/venues/src/infra/execution_intents_consumer.cpp` +
    `cpp/venues/src/infra/execution_report_producer.cpp`. Кандидат на
    выделение в отдельный сервис — ADR-012.

sourceTreeEvidence:
  app:
    - cpp/venues/src/app/execute_on_venue.cpp
    - cpp/venues/src/app/execute_on_venue.hpp
    - cpp/venues/src/app/venues_loop.cpp
    - cpp/venues/src/app/venues_loop.hpp
  infra:
    - cpp/venues/src/infra/execution_intents_consumer.cpp
    - cpp/venues/src/infra/execution_intents_consumer.hpp
    - cpp/venues/src/infra/execution_report_producer.cpp
    - cpp/venues/src/infra/execution_report_producer.hpp
  domain:
    - cpp/venues/src/domain/venue_adapter.hpp

features:
  - F-12

protoContracts:
  - contracts/proto/fob/execution/v1/execution.proto
  - contracts/proto/fob/hedge/v1/hedge.proto
  - contracts/proto/fob/common/v1/common.proto

entities:
  - HedgeFlow
  - ChildOrder
  - ExecutionIntent
  - ExecutionReport

dependencies:
  upstream:
    - execution-planning  # принимает RoutingPlan
    - matching-fob-core   # косвенно: эмитент ExecutionIntent
  downstream:
    - external-venues     # PlaceChildOrder / CancelOrder
    - ledger              # via Kafka execution.venue
    - risk-manager        # PreHedgeCheck + risk.alerts on errors

kafkaConsumes:
  - topic: execution.intents
    messageType: fob.execution.v1.ExecutionIntent
    consumerGroup: venue-execution-adapter

kafkaProduces:
  - topic: execution.venue
    messageType: fob.execution.v1.ExecutionReport
    partitionKey: hedge_flow_id
  - topic: risk.alerts
    messageType: fob.risk.v1.RiskAlert
    partitionKey: hedge_flow_id
    note: producer for HEDGE_UNDERFILL / HEDGE_STUCK only

storageAccess:
  postgresql:
    - hedgeflows       # insert/update
    - child_orders     # insert/update
  clickhouse: []        # запись через Kafka MV, не прямой write

knownIssues:
  - id: no-postgres-persistence
    severity: feature-gap
    description: >
      ExecuteOnVenue в коде не пишет в PostgreSQL. Текущая реализация
      создаёт ExecutionReport в памяти и публикует в Kafka. HedgeFlow
      state-machine отсутствует.
    location: cpp/venues/src/app/execute_on_venue.cpp
  - id: no-timeout-watchdog
    severity: feature-gap
    description: >
      Нет background-потока, который detect-ит истечение hedgeTimeoutMs.
      F12-5 reconciliation не работает.
  - id: no-overfill-detection
    severity: feature-gap
    description: F12-4 overfill guard не реализован в коде.
  - id: legacy-topic-execution-reports
    severity: conflict
    description: >
      ExecutionReportProducer пишет в topic `execution.reports` (legacy).
      IN-005 канонический topic — `execution.venue`. Требуется переключение.
    location: cpp/venues/src/infra/execution_report_producer.cpp

tests:
  unit:
    - cpp/venues/tests/execute_on_venue_test.cpp
    - cpp/venues/tests/execution_report_producer_test.cpp
    - cpp/venues/tests/simulated_venue_adapter_test.cpp
    - cpp/venues/tests/venue_sim_adapter_test.cpp
  integration:
    - cpp/venues/tests/backtest_parity_check_test.cpp
    - cpp/venues/tests/backtest_synthetic_scenarios_test.cpp
  contract: []
