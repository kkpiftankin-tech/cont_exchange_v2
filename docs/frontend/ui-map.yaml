# Карта экранов (IN-019 §4.1, Этап 3 ADR-086). Сгенерированные поля (`generated:`)
# пишет tools/ui-map/scan.py — не редактировать руками, он их перезатрёт.
# Остальные поля — руками. Пилот 2026-10-27: только /vector-clearing-live
# (решение владельца — 1 экран, не все 6 из приоритета брифа, за один заход).
#
# capability: обновлено Этапом 7 на реальные id из feature.yaml.capabilities[]
# (появились в Этапе 4, после того как был написан этот комментарий).
# UI-VC-POS-BASIS получил владеющую capability в Этапе 8 (CR-F18-001,
# CAP-F18-ARBITRAGEUR-BASIS) — до этого был placeholder CAP-F18-NN.

screens:
  - id: UI-VC
    route: /vector-clearing-live  # как в frontend/web/src/App.js
    title: Векторный клиринг (live)
    component: frontend/web/src/pages/VectorClearing/VectorClearingLive.js
    features: [F-18, F-05A]
    elements:
      - id: UI-VC-POS-BASIS
        generated: {component: frontend/web/src/pages/VectorClearing/VectorClearingLive.js, line: 504}  # tools/ui-map/scan.py, api-эвристика не нашла (вызов в той же функции, но axios.get с API_BASE далеко от data-ui-id)
        label: «Живые позиции» → арбитражёр → «базис»
        kind: value
        meaning: Разница цен бирж × перевозимый объём (результат разницы цен, не реализован)
        unit: USDT
        field: "agentRows[].basis_mtm_usdt"
        openapi: "contracts/openapi/fob/bff/v1/api/bff.yaml#/paths/~1api~1vector-clearing~1agent-positions/get"  # TODO Этап 3 п.3 — OpenAPI BFF ещё не создан
        contract: docs/06-api/grpc/ledger-agent-positions.md
        calc: CALC-F18-CE-ARBITRAGEUR-BASIS
        capability: CAP-F18-ARBITRAGEUR-BASIS
        refresh: poll 2s
        states: {empty: "—", stale: "баннер «ЦЕПОЧКА ОСТАНОВЛЕНА» (dataAgeMs > порога)"}

      - id: UI-VC-BAND-MODE
        generated: {component: frontend/web/src/pages/VectorClearing/VectorClearingLive.js, line: 1611}  # tools/ui-map/scan.py
        label: Настройки CE → «ширина полосы хеджа»
        kind: control
        meaning: Режим определения ширины полосы хеджа (от комиссии / авто по волатильности / вручную)
        field: cfgBandMode
        openapi: "contracts/openapi/fob/bff/v1/api/bff.yaml#/paths/~1api~1vector-clearing~1config"  # TODO Этап 3 п.3
        contract: docs/06-api/rest/vector-clearing-config.md
        calc: CALC-CE-SKEW-BAND-CALIBRATION
        capability: CAP-F18-BAND-WIDTH
        refresh: on load / on save
        states: {empty: null, stale: null}

      - id: UI-VC-SYSTEM-PNL
        generated: {component: frontend/web/src/pages/VectorClearing/SystemPnlBlock.js, line: 50}  # tools/ui-map/scan.py: файл отличается от screen.component (SystemPnlBlock.js — подкомпонент VectorClearingLive.js)
        label: Панель «Система по остаткам»
        kind: banner
        meaning: Прибыль системы по реальным остаткам биржи (T = торговый результат, V = переоценка запасов)
        unit: USDT
        field: "n/a — панель, не одно значение"
        openapi: "contracts/openapi/fob/bff/v1/api/bff.yaml#/paths/~1api~1vector-clearing~1system-pnl/get"  # TODO Этап 3 п.3
        contract: docs/06-api/rest/system-pnl.md
        calc: CALC-CE-SYSTEM-PNL
        capability: CAP-F18-SYSTEM-PNL
        refresh: poll 30s
        states: {empty: "«нет данных»", stale: null}

  - id: UI-PNL
    route: /hedge-pnl-live  # как в frontend/web/src/App.js; вкладка «PnL» в NavBar
    title: Hedge PnL Dashboard (live) — вкладка «PnL»
    component: frontend/web/src/pages/HedgePnlDashboard/HedgePnlDashboardLive.js
    features: [F-18, F-12]
    elements:
      - id: UI-PNL-AGENTS
        generated: {component: frontend/web/src/pages/HedgePnlDashboard/AgentPnlTable.js, line: 85}  # tools/ui-map/scan.py (строку обновит --write)
        label: Таблица «Заработок агентов — R / U / R+U»
        kind: table
        meaning: По каждому агенту R (реализованный) и U (нереализованный) внутренней биржи CE, внешних бирж и итого; строка «все агенты»
        unit: USDT
        field: "agents[].internal / external / total (r, u, r_plus_u); totals"
        openapi: "contracts/openapi/fob/bff/v1/api/bff.yaml#/paths/~1api~1vector-clearing~1agent-pnl/get"  # TODO Этап 3 п.3 — OpenAPI BFF ещё не создан
        contract: docs/06-api/rest/agent-pnl.md
        calc: CALC-CE-AGENT-PNL
        capability: CAP-F18-AGENT-PNL
        refresh: poll 5s
        states: {empty: "«Нет агентов с позицией»", stale: "«ledger недоступен» (502), прежние данные остаются"}
      - id: UI-PNL-HISTORY
        generated: {component: frontend/web/src/pages/HedgePnlDashboard/PnlHistoryChart.js, line: 90}  # tools/ui-map/scan.py (строку обновит --write)
        label: График «Заработок во времени — R / U / R+U»
        kind: chart
        meaning: Как менялись во времени R, U и R+U заработка агентов — по охвату (все агенты, переводчики, арбитражёры или один агент по клику на строку таблицы) и группе (итого, внутренняя биржа CE, внешние биржи); ряды отмечаются галочками
        unit: USDT
        field: "points[].groups.{internal,external,total}.{r,u,total}; points[].agents, incomplete (итоги, /pnl-history); для одного агента — /agent-pnl-history, points[].groups"
        openapi: "contracts/openapi/fob/bff/v1/api/bff.yaml#/paths/~1api~1vector-clearing~1pnl-history/get"  # TODO Этап 3 п.3 — OpenAPI BFF ещё не создан
        contract: docs/06-api/rest/agent-pnl-history.md
        calc: CALC-CE-AGENT-PNL
        capability: CAP-F18-AGENT-PNL
        refresh: poll 30s
        states: {empty: "«За выбранное окно записей пока нет: история копится раз в минуту»", stale: "«не удалось загрузить историю заработка», прежние данные остаются"}
