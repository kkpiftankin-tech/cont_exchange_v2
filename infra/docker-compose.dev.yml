services:
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cex
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: cex
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001_cex_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex -d cex >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    restart: unless-stopped
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash","/create_topics.sh"]
    environment:
      BROKER: redpanda:9092
      P: 3

  redpanda-console:
    restart: unless-stopped
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - |
        echo "kafka:
          brokers: [\"redpanda:9092\"]
        " > /tmp/config.yaml
        /app/console --config.filepath=/tmp/config.yaml

  # --- Core services ---
  risk:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: risk
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  # При старте ledger'а сбрасываем активные ордера чтобы резервы не накапливались между сессиями
  ledger-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: cex
    command: >
      psql -h postgres -U cex -d cex -c
      "UPDATE flow_orders SET status='canceled' WHERE status NOT IN ('filled','canceled');"
    restart: "no"

  ledger:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: ledger
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      ledger-init:
        condition: service_completed_successfully
      topics-init:
        condition: service_completed_successfully

  order_flow:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: order_flow
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      risk:
        condition: service_started
      ledger:
        condition: service_started
      # PR-F02-001: PG writer needs postgres up for flow_orders inserts.
      postgres:
        condition: service_healthy

  matching:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: matching
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      MATCHING_DISABLE_EXTERNAL_VENUES: "0"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  venues:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: venues
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      # multi_real: Binance geo-blocked → упадёт через circuit breaker
      # Coinbase доступен → будет основным источником реальных данных
      VENUES_ADAPTER_MODE: "multi_real"
      CURVE_LEVEL: "L3"
      BINANCE_VENUE_ID: "binance"
      BINANCE_VENUE_SYMBOL: "BTCUSDT"
      COINBASE_VENUE_ID: "coinbase"
      COINBASE_VENUE_SYMBOL: "BTC-USD"
      UNISWAP_VENUE_ID: "uniswap_v3"
      UNISWAP_VENUE_SYMBOL: "WBTCUSDC"
      # Ускоряем срабатывание circuit breaker для Binance чтобы быстрее переключиться на Coinbase
      CIRCUIT_BREAKER_ERRORS: "3"
      CIRCUIT_BREAKER_WINDOW_S: "10"
      CIRCUIT_BREAKER_COOLDOWN_S: "60"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  venue_health:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { TARGET: venue_health }
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  market_data:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: market_data
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      MARKET_DATA_TRACE_EACH_MESSAGE: "1"
      POSTGRES_CONN: "host=postgres port=5432 dbname=cex user=cex password=cex"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  backtest:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: backtest
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
    ports:
      - "8087:8087"

  observability:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: observability
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: gateway
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      order_flow:
        condition: service_started
    ports:
      - "8088:8080"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.54.1
    depends_on:
      matching:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    ports:
      - "9090:9090"

networks:
  default:
    name: cex_net
