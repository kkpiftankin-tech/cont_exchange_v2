services:
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/001_cex_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cex
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: cex
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001_cex_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex -d cex >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    restart: unless-stopped
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash","/create_topics.sh"]
    environment:
      BROKER: redpanda:9092
      P: 3

  redpanda-console:
    restart: unless-stopped
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - |
        echo "kafka:
          brokers: [\"redpanda:9092\"]
        " > /tmp/config.yaml
        /app/console --config.filepath=/tmp/config.yaml

  # --- Core services ---
  risk:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: risk
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  ledger:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: ledger
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  order_flow:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: order_flow
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      # F-09 MVP-5/6: разрешить external_compensating combo (внешние ноги +
      # compensation resolution). По умолчанию выключено (honest gate, T-F09-002).
      F09_EXTERNAL_COMPENSATING_ENABLED: "true"
      # F-09 MVP-7 (ADR-041): auto-policy resolution (default OFF; dev — ON с лимитами).
      F09_AUTO_RESOLVE_ENABLED: "true"
      F09_AUTO_MAX_NOTIONAL: "1000000"
      F09_AUTO_WINDOW_NOTIONAL: "10000000"
      F09_AUTO_MAX_PER_WINDOW: "100"
      F09_AUTO_MIN_AGE_MS: "3000"
      F09_AUTO_RESOLVE_INTERVAL_MS: "5000"
      F09_AUTO_WINDOW_MS: "3600000"
    depends_on:
      risk:
        condition: service_started
      ledger:
        condition: service_started
      # PR-F02-001: PG writer needs postgres up for flow_orders inserts.
      postgres:
        condition: service_healthy

  matching:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: matching
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      MATCHING_DISABLE_EXTERNAL_VENUES: "0"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  venues:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: venues
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      VENUES_ADAPTER_MODE: "multi_real"
      CURVE_LEVEL: "L3"
      BINANCE_VENUE_ID: "binance"
      BINANCE_VENUE_SYMBOL: "BTCUSDT"
      # F-09 T-F09-068: binance (simulate) отклоняет дискретный ордер по ETH/USDT,
      # чтобы воспроизвести combo external-leg failure → compensation.
      BINANCE_SIMULATE_REJECT_SYMBOLS: "ETH/USDT"
      # F-09 UX: доп. символы для тикер-фида (live-котировки в combo-форме). Пары,
      # которые binance реально торгует (USDT/USDC/EUR/BTC-quote для major-баз).
      VENUES_FEED_SYMBOLS: "ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,LTC/USDT,DOT/USDT,MATIC/USDT,TRX/USDT,ATOM/USDT,UNI/USDT,BCH/USDT,NEAR/USDT,APT/USDT,ARB/USDT,OP/USDT,FIL/USDT,ETC/USDT,XLM/USDT,ALGO/USDT,INJ/USDT,SUI/USDT,SEI/USDT,BTC/USDC,ETH/USDC,SOL/USDC,XRP/USDC,BTC/EUR,ETH/EUR,SOL/EUR,ETH/BTC,SOL/BTC,BNB/BTC,XRP/BTC"
      COINBASE_VENUE_ID: "coinbase"
      COINBASE_VENUE_SYMBOL: "BTC-USD"
      UNISWAP_VENUE_ID: "uniswap_v3"
      UNISWAP_VENUE_SYMBOL: "WBTCUSDC"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  venue_health:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args: { TARGET: venue_health }
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  market_data:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: market_data
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    environment:
      MARKET_DATA_TRACE_EACH_MESSAGE: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  backtest:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: backtest
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
    ports:
      - "8087:8087"

  observability:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: observability
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      topics-init:
        condition: service_completed_successfully

  gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        TARGET: gateway
        BUILD_JOBS: ${BUILD_JOBS:-1}
    env_file: [ ./env/.env-example ]
    depends_on:
      postgres:
        condition: service_healthy
      order_flow:
        condition: service_started
    ports:
      - "8088:8080"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.54.1
    depends_on:
      matching:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    ports:
      - "9090:9090"

networks:
  default:
    name: cex_net
