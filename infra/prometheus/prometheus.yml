global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: matching
    static_configs:
      - targets:
          - matching:8081

  - job_name: backtest
    static_configs:
      - targets:
          - backtest:8087

  # F-12 DoD-16 (PR-F12-12): aggregated hedge metrics from PG + CH.
  # frontend-api lives on the `cex_net` network (mapped via the
  # standalone frontend/docker-compose.yml); reachable as "frontend-api"
  # when prometheus is also attached to cex_net.
  - job_name: frontend-api-hedge
    scrape_interval: 15s
    static_configs:
      - targets:
          - frontend-api:8090
