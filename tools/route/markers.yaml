# Маркеры типа реплики (IN-019 §3.4/§6.1, Этап 5, пилот). Ключевые слова
# и фразы — НЕ ML, просто substring-совпадения в нижнем регистре; оценка
# типа = число совпавших маркеров. Эталонная проверка качества —
# tools/route/golden.yaml + tools/route/eval.py.

types:
  ask:
    - что значит
    - откуда цифра
    - откуда число
    - откуда число
    - почему 0
    - почему ноль
    - что такое
    - как считается
    - что это значит
    - что означает

  fix:
    - не работает
    - не совпадает
    - неверно
    - неправильно
    - ошибка
    - сломан
    - баг
    - не обновляется
    - не обнулился
    - не обнулилась
    - в убыток
    - не так, как должно

  refine:
    - не описано
    - нет описания
    - не задокументировано
    - не объяснено
    - непонятно, что значит
    - на экране верно, но

  change:
    - считаться иначе
    - по-другому
    - не так как сейчас
    - пересчитать
    - вместо
    - не дублироваться
    - единым источником
    - считать иначе

  extend:
    - добавь
    - добавить
    - новая колонка
    - новый график
    - новый режим
    - расширить
    - нужна колонка
    - нужен график

  new:
    - новая функция
    - нет в реестре
    - совсем новое
    - никогда не было
    - новый тип
    - нового типа
    - третьего типа

  describe:
    - опиши
    - расскажи
    - объясни
    - как работает

  spike:
    - попробуй
    - проверь гипотезу
    - а что если
    - эксперимент
    - посмотрим что будет
